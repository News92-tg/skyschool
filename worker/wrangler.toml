name = "skyschool-ai"
main = "worker.js"
compatibility_date = "2025-01-01"

# Ключи сюда НЕ пишутся. Они задаются отдельными командами и хранятся
# на стороне Cloudflare:
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put GEMINI_API_KEY     # нужен только для /check-photo

# Лимиты и модели. Всё перечисленное имеет значение по умолчанию в
# worker.js — раскомментируйте только то, что хотите поменять.
# Меняются в панели Cloudflare без выкатки нового кода: цифры тарифов и
# названия моделей меняются часто, и держать их в коде неудобно.
[vars]
# сколько запросов с одного адреса за минуту (любые эндпоинты)
# RATE_PER_MIN = "20"

# минимальный промежуток между разборами фото с одного адреса, секунды
# RATE_PHOTO_SECONDS = "30"

# минимальный промежуток между объяснениями шахматных ходов, секунды
# RATE_CHESS_SECONDS = "3"

# максимальный размер фото после сжатия в браузере, КБ
# MAX_IMAGE_KB = "1200"

# имена моделей
# DEEPSEEK_MODEL = "deepseek-chat"
# GEMINI_MODEL = "gemini-2.5-flash"

# потолок ответа модели в токенах
# MAX_TOKENS = "500"
# MAX_TOKENS_PHOTO = "900"

# домены, которым разрешено обращаться к Worker, через запятую.
# Свой домен добавьте сюда, иначе запросы с него получат 403.
# ALLOWED_ORIGINS = "https://news92-tg.github.io,http://127.0.0.1:8080"
