<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Разбор работ — SkyySchool</title>
<meta name="description" content="Как ученики решали подборки: ответ по каждому заданию, правильный ответ и объяснение ошибок.">
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<!-- Разбор работ учеников: подборки → ученики → ответы по заданиям.
     Логика — assets/teacher-review.js, данные — task_collections и
     collection_submissions (sql/schema-collections.sql), объяснение
     ошибки — Worker /explain. -->
<style>
  .tr-wrap{max-width:1000px}
  .tr-back{margin-bottom:8px}
  .tr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
  .tr-head h1{margin:0;word-break:break-word}
  .tr-head .lead{margin:6px 0 0}
  .tr-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:700}
  .tr-meta .mono{color:var(--ink-2)}
  #trView{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  #trView > *{min-width:0}

  /* подборки */
  .tr-colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .tr-coll{display:grid;gap:8px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
    color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
  .tr-coll:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
  .tr-coll:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tr-coll h3{margin:0;font-size:16px;line-height:1.3;word-break:break-word}
  .tr-coll .tr-meta{margin:0}
  .tr-coll .stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink-2)}
  .tr-coll .stat b{font-size:20px;color:var(--ink)}

  /* сводка и инструменты */
  .tr-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
  .tr-bar .grow{margin-left:auto}
  .tr-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tr-sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;font-weight:700;color:var(--muted)}
  .tr-sum b{color:var(--ink)}
  .tr-sort{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line)}
  .tr-sort button{font:inherit;font-size:12.5px;font-weight:800;padding:6px 11px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tr-sort button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

  .tr-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ctable{width:100%;border-collapse:collapse;font-size:13.5px}
  .ctable th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ctable td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .ctable tr:last-child td{border-bottom:none}
  .ctable .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tr-students tbody tr{cursor:pointer}
  .tr-students tbody tr:hover td{background:var(--panel-2)}
  .tr-students td{vertical-align:middle}
  .tr-students a{color:var(--ink);font-weight:800;text-decoration:none}
  .tr-students a:hover{color:var(--accent)}
  .tr-cls{display:inline-block;min-width:28px;padding:2px 7px;border-radius:7px;background:var(--panel-2);font-size:12px;font-weight:800;color:var(--ink-2);text-align:center}

  /* оценка */
  .tr-grade{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:9px;font-weight:900;font-size:14px}
  .tr-grade.g5{background:var(--ok-soft);color:var(--ok)}
  .tr-grade.g4{background:var(--m-learn-soft);color:var(--m-learn)}
  .tr-grade.g3{background:var(--warn-soft);color:var(--warn)}
  .tr-grade.g2{background:var(--no-soft);color:var(--no)}

  /* разбор одной работы */
  .tr-score{display:flex;align-items:center;gap:16px 22px;flex-wrap:wrap;padding:18px 20px}
  .tr-score .big{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1}
  .tr-score .big small{font-size:18px;color:var(--muted);font-weight:800}
  .tr-score .txt{display:grid;gap:3px;font-size:14px;font-weight:700}
  .tr-score .txt span{color:var(--muted);font-size:13px}
  .tr-score .tr-grade{min-width:44px;height:44px;font-size:22px;border-radius:13px}
  .tr-note{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tr-note a:not(.btn){color:var(--accent)}
  .tr-note .btn{margin-left:auto}
  .tr-comment{padding:12px 14px;border-radius:12px;background:var(--panel-2);font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .tr-comment b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}

  .tr-tasks td:first-child{width:34px;color:var(--muted);font-weight:900}
  .tr-tasks .q{font-weight:700;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .tr-tasks .a{line-height:1.45;word-break:break-word}
  .tr-tasks .a.none{color:var(--muted);font-style:italic}
  .tr-tasks .a.right{color:var(--ok);font-weight:700}
  .tr-tasks .a.wrong{color:var(--no);font-weight:700}
  .tr-mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:900;font-size:15px}
  .tr-mark.ok{background:var(--ok-soft);color:var(--ok)}
  .tr-mark.no{background:var(--no-soft);color:var(--no)}
  .tr-mark.wait{background:var(--warn-soft);color:var(--warn)}
  .tr-tasks tr.is-wrong td{background:color-mix(in srgb,var(--no-soft) 45%,transparent)}
  .tr-pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

  /* окно объяснения */
  .tr-ex h2{margin:0 0 8px;font-size:19px}
  .tr-ex .q{font-weight:700;line-height:1.5;white-space:pre-wrap;margin:0 0 12px}
  .tr-ex .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tr-ex .pair div{padding:10px 12px;border-radius:12px;background:var(--panel-2);font-size:13.5px;font-weight:700;word-break:break-word}
  .tr-ex .pair small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .tr-ex .pair .no{color:var(--no)}
  .tr-ex .pair .ok{color:var(--ok)}
  .tr-ex-body{font-size:14.5px;line-height:1.65;min-height:60px}
  .tr-ex-body p{margin:0 0 10px}
  .tr-ex-body .err{color:var(--no);font-weight:700}
  .tr-ex-src{margin-top:6px;font-size:11.5px;color:var(--muted);font-weight:700}

  @media (max-width:640px){
    .tr-bar .grow{margin-left:0}
    .tr-note .btn{margin-left:0}
    .tr-ex .pair{grid-template-columns:1fr}
    /* разбор по заданиям — карточками: таблица в пять колонок на телефоне не читается */
    .tr-tasks thead{display:none}
    .tr-tasks, .tr-tasks tbody, .tr-tasks tr, .tr-tasks td{display:block;width:auto}
    .tr-tasks tr{position:relative;padding:12px 14px 12px 46px;border-bottom:1px solid var(--line)}
    .tr-tasks tr:last-child{border-bottom:none}
    .tr-tasks td{padding:2px 0;border:0}
    .tr-tasks td:first-child{position:absolute;left:14px;top:12px;width:auto}
    .tr-tasks td[data-l]::before{content:attr(data-l) ': ';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
    .tr-tasks td.mk{position:absolute;right:12px;top:10px}
    .tr-tasks td.q-cell{padding-right:36px;margin-bottom:4px}
    .tr-tasks td.act:empty{display:none}
    .tr-tasks td.act{padding-top:6px}
    .tr-tasks tr.is-wrong{background:color-mix(in srgb,var(--no-soft) 45%,transparent)}
    .tr-tasks tr.is-wrong td{background:none}
    /* сводка: «1 / 3» и оценка в строку, пояснение под ними */
    .tr-score{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 14px;padding:16px}
    .tr-score > div:last-child{grid-row:1;grid-column:2;margin:0 !important}
    .tr-score .txt{grid-column:1 / -1}
  }
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap tr-wrap">
  <div id="trView" aria-live="polite"><div class="panel"><span class="spin"></span></div></div>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/errors.js"></script>
<script src="assets/teacher-review.js"></script>
</body>
</html>
