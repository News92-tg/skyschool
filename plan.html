<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>План — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<style>
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
.day{border:1.5px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center;transition:.2s}
.day b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.day span{font-size:10px;color:var(--muted);font-weight:800}
.day.hit{border-color:var(--ok);background:var(--ok-soft)}
.day.hit b{color:var(--ok)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--m-learn-soft)}

/* ---------- тесты: бейджи готовности ---------- */
.test-badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.test-badge{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:99px;
  padding:6px 14px 6px 8px;font-size:12.5px;font-weight:800;background:var(--panel);text-decoration:none;color:inherit;transition:.15s}
.test-badge:hover{border-color:var(--line-2);transform:translateY(-1px)}
.test-badge .ic{font-size:17px}
.test-badge .lvl{font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:99px}
.lvl.none{background:var(--panel-2);color:var(--muted)}
.lvl.start,.lvl.low{background:var(--no-soft);color:var(--no)}
.lvl.mid{background:var(--warn-soft);color:var(--warn)}
.lvl.adv,.lvl.high{background:var(--ok-soft);color:var(--ok)}

/* ---------- динамический план по неделям ---------- */
.plan-weeks{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.plan-week{border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.plan-week.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--m-plan-soft)}
.plan-week-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.plan-week-head b{font-size:14px;font-weight:900}
.plan-week-head span{font-size:11.5px;color:var(--muted);font-weight:700}
.plan-subj{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-sm);
  text-decoration:none;color:inherit;transition:.15s}
.plan-subj:hover{background:var(--panel-2)}
.plan-subj .ic{font-size:19px;flex:none}
.plan-subj .info{flex:1;min-width:0}
.plan-subj .info b{display:block;font-size:13px;font-weight:800}
.plan-subj .info span{font-size:11px;color:var(--muted);font-weight:700}
.plan-subj .progress{width:84px;flex:none}
.plan-subj .cnt{font-size:11.5px;font-weight:800;color:var(--muted);flex:none;width:48px;text-align:right}
.plan-subj.done .cnt{color:var(--ok)}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>

  <div class="panel section">
    <h2 data-i18n="examBlock"></h2>
    <div class="row" style="margin-top:16px">
      <div class="field">
        <label data-i18n="examName"></label>
        <input type="text" id="examName" data-i18n-ph="examNamePh">
      </div>
      <div class="field">
        <label data-i18n="examDate"></label>
        <input type="date" id="examDate">
      </div>
      <div class="field">
        <label data-i18n="goal"></label>
        <input type="number" id="goal" min="1" max="200" step="1">
      </div>
      <div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end">
        <button class="btn" id="saveBtn" data-i18n="save"></button>
      </div>
    </div>
    <div class="grid g2" style="margin-top:22px">
      <div>
        <div class="eyebrow" data-i18n="left"></div>
        <div class="count" id="daysLeft" style="margin:6px 0 4px">—</div>
        <p class="lead" style="font-size:12.5px" id="paceNote"></p>
      </div>
      <div>
        <div class="eyebrow" data-i18n="todayGoal"></div>
        <div class="count" id="todayN" style="margin:6px 0 4px">0</div>
        <div class="progress"><i id="todayBar"></i></div>
      </div>
    </div>
  </div>

  <div class="panel section">
    <h2 data-i18n="testsTitle"></h2>
    <p class="lead" style="font-size:13px;margin-top:6px" data-i18n="testsLead"></p>
    <div class="test-badges" id="testBadges"></div>
  </div>

  <div class="panel section">
    <h2 data-i18n="weekPlanTitle"></h2>
    <p class="lead" style="font-size:13px;margin-top:6px" data-i18n="weekPlanLead"></p>
    <div id="weekPlanBody"></div>
  </div>

  <div class="panel section">
    <h2 data-i18n="week"></h2>
    <p class="lead" style="font-size:13px;margin-top:6px" data-i18n="weekLead"></p>
    <div class="week" id="week"></div>
  </div>

  <div class="panel section">
    <h2 data-i18n="remind"></h2>
    <p class="lead" style="font-size:13px;margin-top:6px" data-i18n="remindLead"></p>
    <div class="row" style="margin-top:16px">
      <div class="field" style="flex:0 0 150px">
        <label data-i18n="atTime"></label>
        <input type="time" id="notifyAt">
      </div>
      <div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end;gap:9px">
        <button class="btn" id="notifyOn"></button>
        <button class="btn ghost" id="notifyTest" data-i18n="test"></button>
      </div>
    </div>
    <p class="note" id="notifyState"></p>
  </div>

  <div class="panel section">
    <h2 data-i18n="todo"></h2>
    <div class="row" style="margin:16px 0">
      <div class="field"><input type="text" id="newItem" data-i18n-ph="todoPh"></div>
      <div class="field" style="flex:0 0 auto"><button class="btn" id="addItem" data-i18n="add"></button></div>
    </div>
    <div class="list" id="items"></div>
  </div>

  <div class="panel section">
    <h2 data-i18n="danger"></h2>
    <p class="lead" style="font-size:13px;margin-top:6px" data-i18n="dangerLead"></p>
    <div class="actions">
      <button class="btn ghost small" id="exportBtn" data-i18n="exportBtn"></button>
      <button class="btn danger small" id="resetBtn" data-i18n="resetBtn"></button>
    </div>
  </div>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script>

  examBlock:{ru:'Экзамен и цель',en:'Exam and goal'},
  examName:{ru:'Какой экзамен',en:'Which exam'},
  examNamePh:{ru:'Например: ЕГЭ по информатике',en:'e.g. Computer science exam'},
  examDate:{ru:'Дата',en:'Date'},
  goal:{ru:'Заданий в день',en:'Problems per day'},
  left:{ru:'Дней осталось',en:'Days left'},
  todayGoal:{ru:'Решено сегодня',en:'Solved today'},
  paceNone:{ru:'Поставьте дату экзамена — посчитаю, сколько заданий в день нужно решать.',

  pacePast:{ru:'Дата уже прошла.',en:'That date has passed.'},
  pace:{ru:'При цели %1 в день это ещё %2 заданий до экзамена.',en:'At %1 a day that is %2 more problems before the exam.'},

  week:{ru:'Последние 7 дней',en:'The last 7 days'},
  weekLead:{ru:'Зелёным отмечены дни, когда дневная цель выполнена. Смысл не в рекордах, а в том, чтобы не было длинных пропусков.',
            en:'Green marks the days you hit the goal. The point is not records but avoiding long gaps.'},

  testsTitle:{ru:'Тесты',en:'Tests'},
  testsLead:{ru:'IQ-тест и тест на уровень подготовки по предметам — их результаты используются ниже при сборке плана по неделям.',
             en:'The IQ test and the subject-readiness test — their results are used below to build the weekly plan.'},
  iqBadgeL:{ru:'IQ-тест',en:'IQ test'},
  lvLevelNone:{ru:'не пройден',en:'not taken'},
  lvLevelStart:{ru:'начальный',en:'beginner'},
  lvLevelMid:{ru:'средний',en:'intermediate'},
  lvLevelAdv:{ru:'продвинутый',en:'advanced'},
  iqLevelLow:{ru:'низкий',en:'low'},
  iqLevelMid:{ru:'средний',en:'medium'},
  iqLevelHigh:{ru:'высокий',en:'high'},

  weekPlanTitle:{ru:'План по неделям',en:'Weekly plan'},
  weekPlanLead:{ru:'Собирается автоматически из даты экзамена, дневной цели и теста на уровень подготовки: слабым предметам достаётся больше заданий в неделю. Прогресс по каждому предмету считается из уже решённых заданий тренажёра.',
                en:'Built automatically from the exam date, the daily goal and the readiness test: weaker subjects get more problems per week. Progress per subject comes from problems already solved in the trainer.'},
  weekPlanNoExam:{ru:'Укажите дату экзамена и цель в блоке выше — тогда здесь появится план по неделям.',

  weekPlanNoLevel:{ru:'План ниже строится по умолчанию, как для среднего уровня. Чтобы он учитывал именно ваши сильные и слабые стороны, пройдите тест на уровень подготовки.',
                   en:'The plan below defaults to an intermediate level for every subject. Take the readiness test so it reflects your actual strengths and weaknesses.'},
  weekLabel:{ru:'Неделя %1',en:'Week %1'},
  weekCurrent:{ru:'текущая',en:'current'},
  weekMoreLeft:{ru:'И ещё %1 нед. до экзамена — тот же принцип повторяется каждую неделю.',
                en:'%1 more weeks until the exam — the same pattern repeats every week.'},
  weekTarget:{ru:'%1 в нед.',en:'%1 / wk'},
  takeIqTest:{ru:'Пройти IQ-тест →',en:'Take the IQ test →'},
  takeLevelTest:{ru:'Пройти тест на уровень →',en:'Take the readiness test →'},

  remind:{ru:'Напоминание',en:'Reminder'},
  remindLead:{ru:'Если к назначенному времени дневная цель не выполнена, браузер покажет уведомление.',
              en:'If the daily goal is not met by that time, the browser shows a notification.'},
  atTime:{ru:'Во сколько',en:'At'},
  enable:{ru:'Включить',en:'Turn on'},
  disable:{ru:'Выключить',en:'Turn off'},
  test:{ru:'Проверить',en:'Test it'},
  stOff:{ru:'Напоминания выключены.',en:'Reminders are off.'},
  stOn:{ru:'Напоминания включены на %1. Работают, пока открыта вкладка с сайтом: у статического сайта нет сервера, который разбудил бы вас сам.',
        en:'Reminders are on for %1. They work while this tab is open: a static site has no server that could wake you up on its own.'},
  stDenied:{ru:'Браузер запретил уведомления для этого сайта. Разрешите их в настройках сайта — значок слева от адреса — и нажмите «Включить» ещё раз.',
            en:'The browser has blocked notifications for this site. Allow them in the site settings — the icon left of the address — and press "Turn on" again.'},
  stUnsupported:{ru:'Этот браузер не умеет показывать уведомления. Всё остальное работает.',
                 en:'This browser cannot show notifications. Everything else works.'},
  testTitle:{ru:'SkyySchool',en:'SkyySchool'},
  testBody:{ru:'Вот так будет выглядеть напоминание.',en:'This is what the reminder will look like.'},
  remindBody:{ru:'Сегодня решено %1 из %2. Десять минут — и цель закрыта.',
              en:'You have solved %1 of %2 today. Ten minutes and the goal is done.'},

  todo:{ru:'Что нужно сделать',en:'To do'},
  todoPh:{ru:'Например: разобрать логарифмы',en:'e.g. review logarithms'},
  todoNone:{ru:'Список пуст. Сюда удобно записывать темы, которые вы отложили «на потом».',
            en:'The list is empty. A good place for topics you keep putting off.'},

  danger:{ru:'Данные',en:'Your data'},
  dangerLead:{ru:'Прогресс, расписание повторений и этот план хранятся в localStorage браузера. На сервер не уходят, но и на другое устройство не переносятся — сделайте копию, если чистите браузер.',
              en:'Progress, the review schedule and this plan live in your browser localStorage. Nothing goes to a server — but nothing moves to another device either, so make a copy if you clear your browser.'},
  exportBtn:{ru:'Сделать копию',en:'Make a copy'},
  exportT:{ru:'Копия ваших данных',en:'A copy of your data'},
  exportD:{ru:'Скопируйте этот текст и сохраните куда угодно — в заметки, в файл, себе в сообщения. Здесь весь прогресс, расписание повторений и план.',
           en:'Copy this text and keep it anywhere — notes, a file, a message to yourself. It holds all your progress, the review schedule and the plan.'},
  exportCopy:{ru:'Скопировать',en:'Copy'},
  exportOk:{ru:'Скопировано',en:'Copied'},
  exportManual:{ru:'Текст выделен — скопируйте его сочетанием клавиш',en:'The text is selected — copy it with your keyboard'},
  resetBtn:{ru:'Сбросить прогресс',en:'Reset progress'},
  resetAsk:{ru:'Удалить всю статистику и расписание повторений? Отменить будет нельзя.',
            en:'Delete all statistics and the review schedule? This cannot be undone.'},
  resetDone:{ru:'Прогресс сброшен.',en:'Progress reset.'}
});

const $ = s => document.querySelector(s);
const esc = Sky.auth.esc;

const plan = () => Sky.get('plan', { exam:'', examName:'', goal:10, items:[], notify:false, notifyAt:'18:00' });
const savePlan = v => { Sky.set('plan', v); };

function load() {
  const p = plan();
  $('#examName').value = p.examName || '';
  $('#examDate').value = p.exam || '';
  $('#goal').value = p.goal || 10;
  $('#notifyAt').value = p.notifyAt || '18:00';
  render();
}

function render() {
  const p = plan();
  const d = Sky.daysLeft(p.exam);
  $('#daysLeft').textContent = (d === null || d < 0) ? '—' : d;
  $('#paceNote').textContent = d === null ? Sky.t('paceNone')
    : d < 0 ? Sky.t('pacePast')
    : Sky.t('pace').replace('%1', p.goal || 10).replace('%2', (p.goal || 10) * d);

  const done = Sky.todayCount(), goal = p.goal || 10;
  $('#todayN').textContent = done;
  $('#todayBar').style.width = Math.min(100, Math.round(done / goal * 100)) + '%';

  /* неделя */
  const week = $('#week'); week.innerHTML = '';
  const stats = Sky.stats();
  const names = Sky.lang === 'ru' ? ['пн','вт','ср','чт','пт','сб','вс'] : ['Mo','Tu','We','Th','Fr','Sa','Su'];
  for (let i = 6; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const n = (stats.byDay[Sky.dayKey(dt.getTime())] || {}).n || 0;
    const el = document.createElement('div');
    el.className = 'day' + (n >= goal ? ' hit' : '') + (i === 0 ? ' today' : '');
    el.innerHTML = `<b>${n}</b><span>${names[(dt.getDay() + 6) % 7]}</span>`;
    week.appendChild(el);
  }

  /* уведомления */
  const state = $('#notifyState');
  if (!('Notification' in window)) state.textContent = Sky.t('stUnsupported');
  else if (Notification.permission === 'denied') state.textContent = Sky.t('stDenied');
  else state.textContent = p.notify ? Sky.t('stOn').replace('%1', p.notifyAt || '18:00') : Sky.t('stOff');
  $('#notifyOn').textContent = Sky.t(p.notify ? 'disable' : 'enable');

  renderItems();
  renderTestBadges();
  renderWeekPlan();
}

/* ---------- предметы теста на уровень подготовки ----------
   Те же 4 предмета, что и на test.html (id банков из data/bank-*.js).
   Иконку и название дублируем здесь как константы, а не подключаем
   сами файлы банков: на странице плана незачем грузить сотни
   килобайт заданий ради названия предмета и эмодзи. */
const PLAN_SUBJECTS = [
  { id:'math',    icon:'∑',  name:{ru:'Математика',en:'Mathematics'} },
  { id:'russian', icon:'Я',  name:{ru:'Русский язык',en:'Russian language'} },
  { id:'english', icon:'🇬🇧', name:{ru:'Английский',en:'English'} },
  { id:'history', icon:'📜', name:{ru:'История',en:'History'} }
];
const MAX_WEEKS_SHOWN = 8;

function levelBadgeClass(level) { return level || 'none'; }
function subjLevelLabel(level) {
  return Sky.t(level === 'adv' ? 'lvLevelAdv' : level === 'mid' ? 'lvLevelMid' : level === 'start' ? 'lvLevelStart' : 'lvLevelNone');
}
/* вес предмета в распределении дневной цели: чем слабее уровень,
   тем больше заданий в неделю ему достаётся */
function subjWeight(level) { return level === 'adv' ? 1 : level === 'start' ? 3 : 2; /* mid и «не пройден» — по умолчанию 2 */ }

function renderTestBadges() {
  const box = $('#testBadges'); box.innerHTML = '';
  const iqList = Sky.get('iqResults', []);
  const iqLast = iqList.length ? iqList[iqList.length - 1] : null;

  const iqBadge = document.createElement('a');
  iqBadge.className = 'test-badge';
  iqBadge.href = 'test.html#iq';
  iqBadge.innerHTML = `<span class="ic">🧠</span><span>${Sky.t('iqBadgeL')}</span>` +
    `<span class="lvl ${levelBadgeClass(iqLast ? iqLast.level : null)}">${iqLast ? Sky.t('iqLevel' + iqLast.level[0].toUpperCase() + iqLast.level.slice(1)) : Sky.t('lvLevelNone')}</span>`;
  box.appendChild(iqBadge);

  const results = Sky.get('levelResults', {});
  PLAN_SUBJECTS.forEach(s => {
    const res = results[s.id];
    const b = document.createElement('a');
    b.className = 'test-badge';
    b.href = 'test.html#level';
    b.innerHTML = `<span class="ic">${s.icon}</span><span>${Sky.L(s.name)}</span>` +
      `<span class="lvl ${levelBadgeClass(res ? res.level : null)}">${res ? subjLevelLabel(res.level) : Sky.t('lvLevelNone')}</span>`;
    box.appendChild(b);
  });
}

/* Прогресс недели считается не по отдельной новой статистике, а по
   уже существующей SRS-карточке (Sky.srs()): ключи там вида
   «предмет:id_задания», а rec.last — время последнего ответа. Так
   план обновляется сам собой из обычной работы в тренажёре — без
   дополнительных полей в core.js и без риска что-то там сломать. */
function subjectProgressInRange(subjectId, start, end) {
  const all = Sky.srs();
  let n = 0;
  for (const key in all) {
    if (!key.startsWith(subjectId + ':')) continue;
    const rec = all[key];
    if (rec && rec.last >= start && rec.last < end) n++;
  }
  return n;
}

function renderWeekPlan() {
  const body = $('#weekPlanBody');
  const p = plan();
  const daysLeft = Sky.daysLeft(p.exam);

  if (!p.exam || daysLeft === null || daysLeft < 0) {
    body.innerHTML = `<p class="note">${Sky.t('weekPlanNoExam')}</p>`;
    return;
  }

  const results = Sky.get('levelResults', {});
  const anyTested = PLAN_SUBJECTS.some(s => results[s.id]);
  const dailyGoal = p.goal || 10;

  const weights = {};
  PLAN_SUBJECTS.forEach(s => { weights[s.id] = subjWeight(results[s.id] ? results[s.id].level : null); });
  const totalWeight = PLAN_SUBJECTS.reduce((sum, s) => sum + weights[s.id], 0);

  const weeksLeft = Math.max(1, Math.ceil((daysLeft + 1) / 7));
  const weeksShown = Math.min(weeksLeft, MAX_WEEKS_SHOWN);

  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  let html = '';
  if (!anyTested) html += `<p class="note" style="margin-bottom:14px">${Sky.t('weekPlanNoLevel')} <a href="test.html#level">${Sky.t('takeLevelTest')}</a></p>`;

  html += '<div class="plan-weeks">';
  for (let w = 1; w <= weeksShown; w++) {
    const start = today0.getTime() + (w - 1) * 7 * 864e5;
    const end = start + 7 * 864e5;
    const isCurrent = w === 1;

    html += `<div class="plan-week${isCurrent ? ' current' : ''}">` +
      `<div class="plan-week-head"><b>${Sky.t('weekLabel').replace('%1', w)}</b>` +
      (isCurrent ? `<span>${Sky.t('weekCurrent')}</span>` : '') + '</div>';

    PLAN_SUBJECTS.forEach(s => {
      const weeklyTarget = Math.max(1, Math.round(dailyGoal * weights[s.id] / totalWeight)) * 7;
      const done = isCurrent ? subjectProgressInRange(s.id, start, end) : 0; /* прогресс есть только для текущей недели — будущее ещё не решено */
      const pct = Math.min(100, Math.round(done / weeklyTarget * 100));
      const link = `trainer.html?subject=${s.id}&mode=due&autostart=1`;

      html += `<a class="plan-subj${done >= weeklyTarget ? ' done' : ''}" href="${isCurrent ? link : 'test.html#level'}">` +
        `<span class="ic">${s.icon}</span>` +
        `<span class="info"><b>${Sky.L(s.name)}</b><span>${subjLevelLabel(results[s.id] ? results[s.id].level : null)}</span></span>` +
        (isCurrent ? `<span class="progress"><i style="width:${pct}%"></i></span><span class="cnt">${done}/${weeklyTarget}</span>`
                    : `<span class="cnt">${Sky.t('weekTarget').replace('%1', weeklyTarget)}</span>`) +
        `</a>`;
    });

    html += '</div>';
  }
  html += '</div>';

  if (weeksLeft > MAX_WEEKS_SHOWN) {
    html += `<p class="note" style="margin-top:12px">${Sky.t('weekMoreLeft').replace('%1', weeksLeft - MAX_WEEKS_SHOWN)}</p>`;
  }

  body.innerHTML = html;
}

function renderItems() {
  const p = plan();
  const box = $('#items');
  if (!p.items.length) {
    box.innerHTML = `<div class="empty"><div class="big">📋</div><p>${Sky.t('todoNone')}</p></div>`;
    return;
  }
  box.innerHTML = '';
  p.items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'item' + (it.done ? ' done' : '');
    el.innerHTML = `<button class="check" type="button">${it.done ? '✓' : ''}</button>
      <div class="txt"><b>${esc(it.text)}</b></div>
      <button class="btn small ghost" type="button">×</button>`;
    el.querySelector('.check').addEventListener('click', () => {
      const cur = plan(); cur.items[i].done = !cur.items[i].done; savePlan(cur); renderItems();
    });
    el.querySelector('.btn').addEventListener('click', () => {
      const cur = plan(); cur.items.splice(i, 1); savePlan(cur); renderItems();
    });
    box.appendChild(el);
  });
}

$('#saveBtn').addEventListener('click', () => {
  const p = plan();
  p.examName = $('#examName').value.trim();
  p.exam = $('#examDate').value;
  p.goal = Math.max(1, Math.min(200, +$('#goal').value || 10));
  p.notifyAt = $('#notifyAt').value || '18:00';
  savePlan(p);
  Sky.toast(Sky.t('saved'));
  render();
});

$('#notifyOn').addEventListener('click', async () => {
  const p = plan();
  if (p.notify) { p.notify = false; savePlan(p); render(); return; }
  const res = await Sky.askNotify();
  if (res === 'granted') { p.notify = true; p.notifyAt = $('#notifyAt').value || '18:00'; savePlan(p); }
  render();
});

$('#notifyTest').addEventListener('click', async () => {
  const res = await Sky.askNotify();
  if (res === 'granted') Sky.notify(Sky.t('testTitle'), Sky.t('testBody'));
  else Sky.toast(Sky.t(res === 'denied' ? 'stDenied' : 'stUnsupported'));
  render();
});

function addItem() {
  const v = $('#newItem').value.trim(); if (!v) return;
  const p = plan();
  p.items.push({ text: v.slice(0, 120), done: false });
  savePlan(p);
  $('#newItem').value = '';
  renderItems();
}
$('#addItem').addEventListener('click', addItem);
$('#newItem').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

/* Копия данных отдаётся текстом, а не файлом по ссылке.
   Причина: в части окружений (например когда сайт открыт внутри
   другого приложения) программное скачивание молча блокируется —
   кнопка нажимается, а файла нет. Копирование работает везде. */
$('#exportBtn').addEventListener('click', () => {
  const dump = {
    exported: new Date().toISOString(),
    stats: Sky.stats(), srs: Sky.srs(), plan: plan(),
    life: Sky.get('life', {}),
    kids: { m3best: Sky.get('m3best', 0), solved: Sky.get('m3solved', 0) },
    puzzles: Sky.get('puzzlesSolved', [])
  };
  const text = JSON.stringify(dump, null, 2);

  Sky.modal(
    `<h2>${Sky.t('exportT')}</h2>
     <p class="lead" style="font-size:13px;margin-top:8px">${Sky.t('exportD')}</p>
     <div class="field" style="margin-top:14px">
       <textarea id="exBox" readonly style="height:220px;font-family:'JetBrains Mono',monospace;font-size:11px"></textarea>
     </div>
     <button class="btn full big" id="exCopy" style="margin-top:12px">${Sky.t('exportCopy')}</button>`,
    (box, close) => {
      const area = box.querySelector('#exBox');
      area.value = text;
      box.querySelector('#exCopy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          Sky.toast(Sky.t('exportOk'));
          close();
        } catch (e) {
          /* Буфер обмена может быть недоступен без явного разрешения —
             тогда выделяем текст, чтобы скопировать вручную. */
          area.focus(); area.select();
          Sky.toast(Sky.t('exportManual'));
        }
      });
    }
  );
});

$('#resetBtn').addEventListener('click', () => {
  if (!confirm(Sky.t('resetAsk'))) return;
  Sky.resetProgress();
  Sky.toast(Sky.t('resetDone'));
  render();
});

/* напоминание: проверяем раз в минуту, пока вкладка открыта */
setInterval(() => {
  const p = plan();
  if (!p.notify || !p.notifyAt) return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  if (hhmm !== p.notifyAt) return;
  const key = 'notified_' + Sky.dayKey();
  if (Sky.get(key)) return;
  Sky.set(key, true);
  const done = Sky.todayCount(), goal = p.goal || 10;
  if (done < goal) Sky.notify(Sky.t('testTitle'), Sky.t('remindBody').replace('%1', done).replace('%2', goal));
}, 60000);

document.addEventListener('langchange', render);
document.addEventListener('statschange', render);
load();
</script>
</body>
