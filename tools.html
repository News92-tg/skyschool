<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Инструменты — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<style>
  /* ---------- калькулятор ---------- */
  .calc-wrap{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start}
  @media (max-width:760px){.calc-wrap{grid-template-columns:1fr}}
  .calc{max-width:420px}
  .calc-screen{
    background:var(--ink,#0e2540);color:#fff;border-radius:var(--r-lg);padding:18px 18px 14px;
    text-align:right;margin-bottom:12px;
  }
  .calc-expr{font-family:'JetBrains Mono',monospace;font-size:14px;color:#9db8d9;min-height:18px;
    overflow-x:auto;white-space:nowrap;word-break:break-all}
  .calc-val{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:800;margin-top:4px;
    overflow-x:auto;white-space:nowrap}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .calc-grid.sci{grid-template-columns:repeat(5,1fr)}
  .calc-grid button{
    border:1.5px solid var(--line);background:var(--card);border-radius:13px;
    font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;padding:14px 0;
    cursor:pointer;transition:.15s;color:var(--ink)
  }
  .calc-grid button:hover{border-color:var(--m-tools);background:var(--m-tools-soft)}
  .calc-grid button:active{transform:scale(.95)}
  .calc-grid button.op{color:var(--m-tools);font-weight:800}
  .calc-grid button.eq{background:var(--m-tools);border-color:var(--m-tools);color:#fff;grid-row:span 1}
  .calc-grid button.eq:hover{background:var(--m-tools);opacity:.9}
  .calc-grid button.wide{grid-column:span 2}
  .calc-grid button.fn{font-size:12.5px}
  .calc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .seg button[aria-pressed="true"]{background:var(--m-tools);color:#fff;border-color:var(--m-tools)}
  .calc-hist{max-height:520px;overflow:auto}
  .calc-hist .row{
    border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;font-size:12.5px
  }
  .calc-hist .row:hover{background:var(--m-tools-soft)}
  .calc-hist .e{color:var(--muted);font-family:'JetBrains Mono',monospace}
  .calc-hist .r{font-family:'JetBrains Mono',monospace;font-weight:800;margin-top:2px}
  .calc-hist-empty{color:var(--muted);font-size:13px;padding:8px 2px}

  /* ---------- браузер ---------- */
  .browser-bar{display:flex;gap:8px;margin-bottom:10px}
  .browser-bar input{flex:1}
  .browser-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chip{
    border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)
  }
  .chip:hover{border-color:var(--m-tools);color:var(--m-tools)}
  .browser-frame-wrap{
    border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
    background:var(--card);min-height:520px;position:relative
  }
  .browser-frame-wrap iframe{width:100%;height:600px;border:0;display:block;background:#fff}
  .browser-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:520px;color:var(--muted);text-align:center;padding:20px;gap:8px
  }
  .browser-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.55}
  .browser-openout{font-size:12.5px;margin-top:8px}

  /* ---------- Python ---------- */
  .py-wrap{display:grid;grid-template-columns:1fr;gap:14px}
  .py-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .py-editor{
    width:100%;min-height:220px;font-family:'JetBrains Mono',monospace;font-size:13.5px;
    border:1.5px solid var(--line);border-radius:var(--r);padding:14px;resize:vertical;
    background:var(--card);color:var(--ink);line-height:1.6;tab-size:4
  }
  .py-editor:focus{outline:none;border-color:var(--m-tools)}
  .py-console{
    background:var(--ink,#0e2540);color:#d7e6fa;border-radius:var(--r);padding:14px;
    font-family:'JetBrains Mono',monospace;font-size:13px;min-height:120px;max-height:300px;
    overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:10px
  }
  .py-console .err{color:#ff9b9b}
  .py-console .muted{color:#7f96b8}
  .py-status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .py-status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .py-status.ready .dot{background:var(--ok)}
  .py-status.busy .dot{background:var(--warn);animation:pulse 1s infinite}
  .py-status.err .dot{background:var(--no)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>

  <div class="tabs" role="tablist">
    <button type="button" data-tab="calc" aria-selected="true" data-i18n="tabCalc"></button>
    <button type="button" data-tab="browser" aria-selected="false" data-i18n="tabBrowser"></button>
    <button type="button" data-tab="python" aria-selected="false" data-i18n="tabPython"></button>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <section id="tab-calc">
    <div class="calc-wrap">
      <div class="calc">
        <div class="calc-top">
          <div class="seg" id="calcMode">
            <button type="button" data-mode="simple" aria-pressed="true" data-i18n="calcSimple"></button>
            <button type="button" data-mode="sci" aria-pressed="false" data-i18n="calcSci"></button>
          </div>
          <div class="seg" id="calcAngle">
            <button type="button" data-angle="deg" aria-pressed="true">DEG</button>
            <button type="button" data-angle="rad" aria-pressed="false">RAD</button>
          </div>
        </div>
        <div class="calc-screen">
          <div class="calc-expr" id="calcExpr">&nbsp;</div>
          <div class="calc-val" id="calcVal">0</div>
        </div>
        <div class="calc-grid" id="calcGrid"></div>
      </div>
      <div class="panel">
        <div class="eyebrow" data-i18n="calcHistT"></div>
        <div class="calc-hist" id="calcHist" style="margin-top:8px"></div>
        <button class="btn ghost small full" id="calcHistClear" style="margin-top:10px" data-i18n="calcHistClear"></button>
      </div>
    </div>
  </section>

  <!-- БРАУЗЕР -->
  <section id="tab-browser" class="hidden">
    <div class="browser-bar">
      <input type="text" id="browserUrl" data-i18n-ph="browserPh">
      <button class="btn" id="browserGo" data-i18n="browserGo"></button>
    </div>
    <div class="browser-chips" id="browserChips"></div>
    <div class="browser-frame-wrap" id="browserFrameWrap">
      <div class="browser-empty">
        <div style="font-size:34px">🧭</div>
        <p data-i18n="browserEmptyT" style="font-weight:800;color:var(--ink)"></p>
        <p data-i18n="browserEmptyD" style="max-width:360px;font-size:13px"></p>
      </div>
    </div>
    <p class="browser-note" data-i18n="browserNote"></p>
    <p class="browser-openout hidden" id="browserOpenOut"></p>
  </section>

  <!-- PYTHON -->
  <section id="tab-python" class="hidden">
    <div class="py-wrap">
      <div class="py-toolbar">
        <select id="pySnippet"></select>
        <button class="btn" id="pyRun" data-i18n="pyRun"></button>
        <button class="btn ghost" id="pyClear" data-i18n="pyClearOut"></button>
        <span class="py-status" id="pyStatus"><span class="dot"></span><span id="pyStatusText"></span></span>
      </div>
      <textarea class="py-editor" id="pyEditor" spellcheck="false"></textarea>
      <div class="py-console" id="pyConsole"></div>
      <p class="browser-note" data-i18n="pyNote"></p>
    </div>
  </section>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>

<script>
'use strict';
Sky.init({
  h1:{ru:'Инструменты',en:'Tools'},
  lead:{ru:'Калькулятор, браузер для справочников и песочница Python — без установки, прямо в сайте. Калькулятор и запуск уже введённого кода работают офлайн; первому открытию браузера и первому запуску Python нужен интернет.',
        en:'A calculator, a reference browser and a Python sandbox — no install, right on the site. The calculator and re-running code you already typed work offline; the browser and the first Python run need internet.'},

  tabCalc:{ru:'Калькулятор',en:'Calculator'},
  tabBrowser:{ru:'Браузер',en:'Browser'},
  tabPython:{ru:'Python',en:'Python'},

  calcSimple:{ru:'Простой',en:'Simple'},
  calcSci:{ru:'Инженерный',en:'Scientific'},
  calcHistT:{ru:'История',en:'History'},
  calcHistClear:{ru:'Очистить историю',en:'Clear history'},
  calcHistEmpty:{ru:'Здесь появятся ваши вычисления.',en:'Your calculations will show up here.'},
  calcErr:{ru:'Ошибка в выражении',en:'Error in expression'},

  browserPh:{ru:'Введите адрес сайта или запрос…',en:'Enter a web address or search…'},
  browserGo:{ru:'Перейти',en:'Go'},
  browserEmptyT:{ru:'Встроенный браузер для быстрых справок',en:'A built-in browser for quick lookups'},
  browserEmptyD:{ru:'Введите адрес сверху или выберите один из справочников ниже.',
                 en:'Type an address above or pick one of the reference sites below.'},
  browserNote:{ru:'Честно предупреждаем: часть сайтов (например, поисковики и соцсети) запрещают показывать себя внутри чужой страницы — такие сайты здесь не откроются, даже если адрес правильный. В этом случае воспользуйтесь ссылкой «открыть в новой вкладке» ниже. Экранное время в этом окне не считается временем занятий.',
               en:'Fair warning: some sites (search engines and social networks, for instance) refuse to display inside another page — those won’t open here even with a correct address. Use the "open in a new tab" link below when that happens. Time here does not count as study time in the screen-time tracker.'},
  browserOpenOut:{ru:'Не загрузилось? Открыть %1 в новой вкладке →',en:'Not loading? Open %1 in a new tab →'},

  pyRun:{ru:'▶ Выполнить',en:'▶ Run'},
  pyClearOut:{ru:'Очистить вывод',en:'Clear output'},
  pyNote:{ru:'Работает на Pyodide — настоящем Python, выполняющемся прямо в браузере, без сервера. Первый запуск скачивает среду выполнения (около 10–15 МБ) и требует интернет; дальше, если открывать сайт снова в этом же браузере, всё запускается офлайн.',
          en:'Runs on Pyodide — real Python executing right in the browser, no server involved. The first run downloads the runtime (about 10–15 MB) and needs internet; after that, reopening the site in this same browser runs it offline.'},
  pyIdle:{ru:'не запущено',en:'not started'},
  pyLoading:{ru:'загружается среда Python…',en:'loading the Python runtime…'},
  pyRunning:{ru:'выполняется…',en:'running…'},
  pyReady:{ru:'готово',en:'ready'},
  pyNoNet:{ru:'Не удалось загрузить среду Python — нужен интернет хотя бы для первого раза.',
           en:'Could not load the Python runtime — you need internet at least once, for the first time.'},
  pySnipLoop:{ru:'— пример: циклы —',en:'— example: loops —'},
  pySnipList:{ru:'— пример: списки —',en:'— example: lists —'},
  pySnipFunc:{ru:'— пример: функция —',en:'— example: a function —'},
  pySnipSort:{ru:'— пример: сортировка —',en:'— example: sorting —'},
  pySnipSet:{ru:'— пример: множества —',en:'— example: sets —'}
});

/* =================================================================
   КАЛЬКУЛЯТОР — свой разбор выражений, без eval().
   Поддерживает + - * / ^ % скобки, унарный минус, функции
   sin/cos/tan/sqrt/ln/log/abs, константы pi/e, память и историю.
================================================================= */
(function calculator() {
  const exprEl = document.getElementById('calcExpr');
  const valEl  = document.getElementById('calcVal');
  const grid   = document.getElementById('calcGrid');
  const histEl = document.getElementById('calcHist');
  let expr = '';
  let angleMode = 'deg';
  let memory = 0;
  let lastResult = null;

  function tokenize(s) {
    const toks = []; let i = 0;
    const FN = ['sin','cos','tan','asin','acos','atan','sqrt','ln','log','abs'];
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        toks.push({ t:'num', v: parseFloat(s.slice(i, j)) }); i = j; continue;
      }
      if (/[a-zA-Z]/.test(c)) {
        let j = i; while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
        const word = s.slice(i, j);
        if (word === 'pi') toks.push({ t:'num', v: Math.PI });
        else if (word === 'e') toks.push({ t:'num', v: Math.E });
        else if (word === 'ans') toks.push({ t:'num', v: lastResult || 0 });
        else if (FN.includes(word)) toks.push({ t:'fn', v: word });
        else throw new Error('bad word');
        i = j; continue;
      }
      if ('+-*/^%()'.includes(c)) { toks.push({ t:'op', v:c }); i++; continue; }
      throw new Error('bad char');
    }
    return toks;
  }

  /* рекурсивный спуск: expr -> term (+-) term ... ; term -> pow (* / %) pow ...; pow -> unary (^ pow)?; unary -> (-)? atom */
  function parse(toks) {
    let pos = 0;
    const peek = () => toks[pos];
    const next = () => toks[pos++];

    function atom() {
      const tk = peek();
      if (!tk) throw new Error('unexpected end');
      if (tk.t === 'num') { next(); return tk.v; }
      if (tk.t === 'fn') {
        next();
        if (!peek() || peek().v !== '(') throw new Error('expected (');
        next();
        const v = exprLevel();
        if (!peek() || peek().v !== ')') throw new Error('expected )');
        next();
        return applyFn(tk.v, v);
      }
      if (tk.t === 'op' && tk.v === '(') {
        next();
        const v = exprLevel();
        if (!peek() || peek().v !== ')') throw new Error('expected )');
        next();
        return v;
      }
      throw new Error('unexpected token');
    }
    function unary() {
      if (peek() && peek().t === 'op' && peek().v === '-') { next(); return -unary(); }
      if (peek() && peek().t === 'op' && peek().v === '+') { next(); return unary(); }
      return atom();
    }
    function power() {
      const base = unary();
      if (peek() && peek().t === 'op' && peek().v === '^') { next(); return Math.pow(base, power()); }
      return base;
    }
    function term() {
      let v = power();
      while (peek() && peek().t === 'op' && (peek().v === '*' || peek().v === '/' || peek().v === '%')) {
        const op = next().v; const r = power();
        if (op === '*') v *= r; else if (op === '/') { if (r === 0) throw new Error('div0'); v /= r; } else v = v % r;
      }
      return v;
    }
    function exprLevel() {
      let v = term();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
        const op = next().v; const r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    const result = exprLevel();
    if (pos !== toks.length) throw new Error('trailing tokens');
    return result;
  }

  function toRad(x) { return angleMode === 'deg' ? x * Math.PI / 180 : x; }
  function applyFn(name, x) {
    switch (name) {
      case 'sin': return Math.sin(toRad(x));
      case 'cos': return Math.cos(toRad(x));
      case 'tan': return Math.tan(toRad(x));
      case 'asin': { const r = Math.asin(x); return angleMode === 'deg' ? r * 180 / Math.PI : r; }
      case 'acos': { const r = Math.acos(x); return angleMode === 'deg' ? r * 180 / Math.PI : r; }
      case 'atan': { const r = Math.atan(x); return angleMode === 'deg' ? r * 180 / Math.PI : r; }
      case 'sqrt': if (x < 0) throw new Error('neg sqrt'); return Math.sqrt(x);
      case 'ln': if (x <= 0) throw new Error('bad log'); return Math.log(x);
      case 'log': if (x <= 0) throw new Error('bad log'); return Math.log10(x);
      case 'abs': return Math.abs(x);
    }
  }

  function fmt(n) {
    if (!isFinite(n)) return Sky.t('calcErr');
    if (Math.abs(n) < 1e-12) n = 0;
    const s = Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0)
      ? n.toExponential(6)
      : parseFloat(n.toFixed(10)).toString();
    return s;
  }

  function evaluate(silent) {
    if (!expr.trim()) { valEl.textContent = '0'; return null; }
    try {
      const toks = tokenize(expr);
      const r = parse(toks);
      valEl.textContent = fmt(r);
      valEl.classList.remove('err');
      return r;
    } catch (e) {
      if (!silent) valEl.textContent = Sky.t('calcErr');
      return null;
    }
  }

  function render() {
    exprEl.textContent = expr || ' ';
    evaluate(true);
  }

  function loadHistory() { return Sky.get('calcHistory', []); }
  function saveHistoryEntry(e, r) {
    const h = loadHistory();
    h.unshift({ e, r: fmt(r) });
    Sky.set('calcHistory', h.slice(0, 40));
    renderHistory();
  }
  function renderHistory() {
    const h = loadHistory();
    if (!h.length) { histEl.innerHTML = `<div class="calc-hist-empty">${Sky.t('calcHistEmpty')}</div>`; return; }
    histEl.innerHTML = h.map(row =>
      `<div class="row" data-expr="${row.e.replace(/"/g,'&quot;')}"><div class="e">${row.e}</div><div class="r">= ${row.r}</div></div>`
    ).join('');
  }
  histEl.addEventListener('click', e => {
    const row = e.target.closest('.row'); if (!row) return;
    expr = row.dataset.expr; render();
  });
  document.getElementById('calcHistClear').addEventListener('click', () => {
    Sky.set('calcHistory', []); renderHistory();
  });

  const SIMPLE_BTNS = [
    ['C','ac'],['⌫','back'],['%','ins:%'],['÷','ins:/'],
    ['7','ins:7'],['8','ins:8'],['9','ins:9'],['×','ins:*'],
    ['4','ins:4'],['5','ins:5'],['6','ins:6'],['−','ins:-'],
    ['1','ins:1'],['2','ins:2'],['3','ins:3'],['+','ins:+'],
    ['±','neg'],['0','ins:0'],['.','ins:.'],['=','eq']
  ];
  const SCI_BTNS = [
    ['sin','ins:sin('],['cos','ins:cos('],['tan','ins:tan('],['(', 'ins:('],[')','ins:)'],
    ['√','ins:sqrt('],['x²','sq'],['x^y','ins:^'],['ln','ins:ln('],['log','ins:log('],
    ['π','ins:pi'],['e','ins:e'],['%','ins:%'],['÷','ins:/'],['C','ac'],
    ['7','ins:7'],['8','ins:8'],['9','ins:9'],['×','ins:*'],['⌫','back'],
    ['4','ins:4'],['5','ins:5'],['6','ins:6'],['−','ins:-'],['MC','mc'],
    ['1','ins:1'],['2','ins:2'],['3','ins:3'],['+','ins:+'],['MR','mr'],
    ['±','neg'],['0','ins:0'],['.','ins:.'],['=','eq'],['M+','madd']
  ];

  function buttonClass(label) {
    if (label === '=') return 'eq';
    if (['+','−','×','÷','%','^'].includes(label)) return 'op';
    if (label.length > 2) return 'fn';
    return '';
  }

  function buildGrid(sci) {
    const btns = sci ? SCI_BTNS : SIMPLE_BTNS;
    grid.className = 'calc-grid' + (sci ? ' sci' : '');
    grid.innerHTML = btns.map(([label, action]) =>
      `<button type="button" class="${buttonClass(label)}" data-action="${action}">${label}</button>`
    ).join('');
  }

  function doEquals() {
    const r = evaluate(false);
    if (r !== null) { saveHistoryEntry(expr, r); lastResult = r; expr = fmt(r); render(); }
  }

  grid.addEventListener('click', e => {
    const b = e.target.closest('button[data-action]'); if (!b) return;
    const a = b.dataset.action;
    if (a === 'ac') { expr = ''; render(); }
    else if (a === 'back') { expr = expr.slice(0, -1); render(); }
    else if (a === 'eq') { doEquals(); }
    else if (a === 'neg') { expr = expr ? `-(${expr})` : '-'; render(); }
    else if (a === 'sq') { expr = `(${expr || '0'})^2`; render(); }
    else if (a === 'mc') { memory = 0; }
    else if (a === 'mr') { expr += fmt(memory); render(); }
    else if (a === 'madd') { const r = evaluate(true); if (r !== null) memory += r; }
    else if (a.startsWith('ins:')) { expr += a.slice(4); render(); }
  });

  document.getElementById('calcMode').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]'); if (!b) return;
    document.querySelectorAll('#calcMode button').forEach(x => x.setAttribute('aria-pressed', x === b));
    buildGrid(b.dataset.mode === 'sci');
  });
  document.getElementById('calcAngle').addEventListener('click', e => {
    const b = e.target.closest('button[data-angle]'); if (!b) return;
    document.querySelectorAll('#calcAngle button').forEach(x => x.setAttribute('aria-pressed', x === b));
    angleMode = b.dataset.angle; render();
  });

  /* клавиатура — только пока открыта вкладка калькулятора */
  document.addEventListener('keydown', e => {
    if (document.getElementById('tab-calc').classList.contains('hidden')) return;
    if (document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (/[0-9.+\-*/^%()]/.test(e.key)) { expr += e.key; render(); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); doEquals(); }
    else if (e.key === 'Backspace') { expr = expr.slice(0, -1); render(); }
    else if (e.key === 'Escape') { expr = ''; render(); }
  });

  buildGrid(false);
  render();
  renderHistory();
})();

/* =================================================================
   БРАУЗЕР — встроенный просмотр справочных страниц через iframe.
================================================================= */
(function browserTool() {
  const urlInput = document.getElementById('browserUrl');
  const frameWrap = document.getElementById('browserFrameWrap');
  const openOut = document.getElementById('browserOpenOut');
  const CHIPS = [
    { label:'Википедия', url:'https://ru.wikipedia.org' },
    { label:'ФИПИ', url:'https://fipi.ru' },
    { label:'Грамота.ру', url:'https://gramota.ru' },
    { label:'MathWorld', url:'https://mathworld.wolfram.com' },
    { label:'Хронос (история)', url:'https://www.hrono.ru' }
  ];
  document.getElementById('browserChips').innerHTML = CHIPS.map(c =>
    `<button type="button" class="chip" data-url="${c.url}">${c.label}</button>`
  ).join('');

  function normalizeUrl(raw) {
    let u = (raw || '').trim();
    if (!u) return null;
    if (/^javascript:/i.test(u)) return null;
    if (!/^https?:\/\//i.test(u)) {
      u = /\s/.test(u) || !u.includes('.')
        ? 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(u)
        : 'https://' + u;
    }
    try { return new URL(u).href; } catch (e) { return null; }
  }

  function open(rawUrl) {
    const url = normalizeUrl(rawUrl);
    if (!url) { Sky.toast(Sky.t('calcErr')); return; }
    urlInput.value = url;
    frameWrap.innerHTML = `<iframe src="${url}" referrerpolicy="no-referrer" loading="lazy"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
    openOut.classList.remove('hidden');
    openOut.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${Sky.t('browserOpenOut').replace('%1', new URL(url).hostname)}</a>`;

    const hist = Sky.get('browserHistory', []);
    const clean = hist.filter(h => h !== url);
    clean.unshift(url);
    Sky.set('browserHistory', clean.slice(0, 12));
  }

  document.getElementById('browserGo').addEventListener('click', () => open(urlInput.value));
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') open(urlInput.value); });
  document.getElementById('browserChips').addEventListener('click', e => {
    const b = e.target.closest('button[data-url]'); if (!b) return;
    open(b.dataset.url);
  });
})();

/* =================================================================
   PYTHON — Pyodide (настоящий Python в браузере, без сервера).
   Загружается только когда пользователь реально открывает вкладку
   или жмёт «Выполнить» — это тяжёлая штука, качать её заранее незачем.
================================================================= */
(function pythonSandbox() {
  const editor = document.getElementById('pyEditor');
  const consoleEl = document.getElementById('pyConsole');
  const statusEl = document.getElementById('pyStatus');
  const statusText = document.getElementById('pyStatusText');
  const snippetSel = document.getElementById('pySnippet');

  const SNIPPETS = {
    loop: { key:'pySnipLoop', code:
`# цикл и вывод
for i in range(1, 6):
    print(i, i * i)
` },
    list: { key:'pySnipList', code:
`# список: сумма и среднее
nums = [4, 8, 15, 16, 23, 42]
print("сумма:", sum(nums))
print("среднее:", sum(nums) / len(nums))
print("максимум:", max(nums))
` },
    func: { key:'pySnipFunc', code:
`# функция: факториал рекурсией
def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

for n in range(1, 7):
    print(n, "! =", factorial(n))
` },
    sort: { key:'pySnipSort', code:
`# сортировка своими руками (пузырьком) и сверка со встроенной
data = [5, 3, 8, 1, 9, 2]
a = data[:]
for i in range(len(a)):
    for j in range(len(a) - 1 - i):
        if a[j] > a[j + 1]:
            a[j], a[j + 1] = a[j + 1], a[j]
print("вручную:", a)
print("sorted():", sorted(data))
` },
    set: { key:'pySnipSet', code:
`# множества: типичный вопрос ЕГЭ — что выведет код?
print(len({1, 2, 2, 3}))
a = {1, 2, 3, 4}
b = {3, 4, 5, 6}
print("пересечение:", a & b)
print("объединение:", a | b)
`}
  };
  snippetSel.innerHTML = `<option value="">${Sky.t('pySnipLoop')}</option>` +
    Object.entries(SNIPPETS).map(([k, s]) => `<option value="${k}">${Sky.t(s.key)}</option>`).join('');
  snippetSel.addEventListener('change', () => {
    if (SNIPPETS[snippetSel.value]) editor.value = SNIPPETS[snippetSel.value].code;
  });
  editor.value = SNIPPETS.loop.code;

  function setStatus(mode, text) {
    statusEl.className = 'py-status ' + mode;
    statusText.textContent = text;
  }
  setStatus('', Sky.t('pyIdle'));

  function logLine(text, cls) {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    consoleEl.appendChild(div);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  let pyodidePromise = null;
  function getPyodide() {
    if (pyodidePromise) return pyodidePromise;
    setStatus('busy', Sky.t('pyLoading'));
    pyodidePromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
      s.onload = () => {
        window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' })
          .then(py => {
            py.setStdout({ batched: s => logLine(s) });
            py.setStderr({ batched: s => logLine(s, 'err') });
            resolve(py);
          })
          .catch(reject);
      };
      s.onerror = () => reject(new Error('network'));
      document.head.appendChild(s);
    });
    return pyodidePromise;
  }

  document.getElementById('pyRun').addEventListener('click', async () => {
    logLine('>>> ' + (editor.value.split('\n')[0] || '') + (editor.value.includes('\n') ? ' …' : ''), 'muted');
    try {
      const py = await getPyodide();
      setStatus('busy', Sky.t('pyRunning'));
      await py.runPythonAsync(editor.value);
      setStatus('ready', Sky.t('pyReady'));
    } catch (err) {
      setStatus('err', err && err.message === 'network' ? Sky.t('pyNoNet') : Sky.t('pyReady'));
      logLine(String((err && err.message) || err), 'err');
    }
  });

  document.getElementById('pyClear').addEventListener('click', () => { consoleEl.innerHTML = ''; });
})();

/* переключение вкладок — общий для всех трёх инструментов */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['calc','browser','python'].forEach(n =>
    document.getElementById('tab-' + n).classList.toggle('hidden', n !== b.dataset.tab));
});
