<style>
/* ---------- стили, специфичные для страницы тестов ---------- */
.subj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:16px}
.subj-card{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;
  background:var(--panel);cursor:pointer;transition:.18s;font:inherit;color:inherit;width:100%}
.subj-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.subj-card .ic{font-size:26px;line-height:1}
.subj-card b{display:block;font-size:14.5px;font-weight:900;margin-top:10px}
.subj-card .lvl{display:inline-flex;align-items:center;margin-top:9px;font-size:11px;font-weight:800;
  padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.lvl.none{background:var(--panel-2);color:var(--muted)}
.lvl.start{background:var(--no-soft);color:var(--no)}
.lvl.mid{background:var(--warn-soft);color:var(--warn)}
.lvl.adv{background:var(--ok-soft);color:var(--ok)}
.timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800}
.timer.low{color:var(--no)}
.part-pill{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.part-mini{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.part-mini b{display:block;font-size:17px;font-weight:900}
.part-mini span{font-size:10.5px;color:var(--muted);font-weight:800}

/* ---------- результат IQ-теста (v2) ---------- */
.iq-score-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.count.xl{font-size:clamp(44px,9vw,72px);letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--m-learn),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.iq-score-percent{font-size:16px;font-weight:800;color:var(--m-learn);
  background:var(--m-learn-soft);border-radius:99px;padding:4px 13px;align-self:center}
.iq-level-badge{font-size:14px !important;font-weight:800;padding:8px 18px !important;
  gap:8px;letter-spacing:.01em;border-width:1.5px;border-style:solid}
.iq-level-badge.ok{border-color:var(--ok)}
.iq-level-badge.warn{border-color:var(--warn)}
.iq-level-badge.no{border-color:var(--no)}

.iq-compare-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.iq-compare-chip{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:99px;
  background:var(--panel-2);border:1px solid var(--line)}
.iq-compare-chip.top{background:var(--m-learn-soft);color:var(--m-learn);border-color:var(--m-learn)}

.iq-viz-grid{display:flex;flex-wrap:wrap;align-items:center;gap:28px;margin-top:22px}
.iq-rings-wrap{position:relative;width:220px;height:220px;flex:0 0 auto;margin:0 auto}
.iq-rings{width:100%;height:100%;transform:rotate(-90deg)}
.iq-ring-track{fill:none;stroke:var(--line);opacity:.5}
.iq-ring-progress{fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.iq-rings-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.iq-rings-percent{font-size:30px;font-weight:900}
.iq-legend{display:flex;flex-direction:column;gap:9px;min-width:190px;flex:1}
.iq-legend-row{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.iq-legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.iq-legend-row b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800}

.iq-history-block{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:18px}
.iq-history-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.iq-history-delta{color:var(--ok);font-weight:800}
.iq-history-svg{display:block;width:100%;height:64px;margin-top:6px}
.iq-history-line{fill:none;stroke:var(--m-learn);stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
.iq-history-area{fill:url(#iqHistGrad);opacity:.45}
.iq-history-dot{fill:var(--panel);stroke:var(--m-learn);stroke-width:2.25}
.iq-history-dot.last{fill:var(--m-learn)}

.iq-advice-block{display:flex;gap:13px;align-items:flex-start;background:var(--m-learn-soft);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-top:18px}
.iq-advice-icon{font-size:24px;line-height:1}
.iq-advice-title{font-weight:900;margin-bottom:3px;font-size:13.5px}
.iq-advice-text{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}

.iq-share-btn{margin-top:18px;background:linear-gradient(135deg,var(--m-learn),var(--accent))}

.iq-share-canvas{width:100%;height:auto;aspect-ratio:1/1;border-radius:var(--r);display:block;background:#3b5bdb}
.iq-share-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.iq-share-actions .btn{padding:10px 10px;font-size:12.5px}
.btn.tg{background:#2aabee;color:#fff}
.btn.vk{background:#0077ff;color:#fff}

@media (prefers-reduced-motion: reduce){
  .iq-ring-progress{transition:none}
}

/* ---------- честная пометка: тесты только на русском ----------
   Как и в тренажёре, содержание тестов (вопросы IQ-теста и банки
   ЕГЭ/ОГЭ) остаётся на русском — переводить логическую задачу или
   вопрос по русскому языку означало бы менять сам вопрос. */
function updateRuNote() {
  const note = document.querySelector('#iqRuNote');
  const show = Sky.lang === 'en';
  note.classList.toggle('hidden', !show);
  if (show) note.textContent = Sky.t('ruOnlyNote');
}
document.addEventListener('langchange', updateRuNote);

const $ = s => document.querySelector(s);

/* ============================================================
   ВСПОМОГАТЕЛЬНОЕ: перемешать варианты ответа, но помнить,
   какой из них правильный. В базах заданий верный вариант обычно
   стоит первым — так их удобно писать, но показывать в таком же
   порядке нельзя. */
function shuffledOrder(question) {
  if (!question._order) question._order = Sky.shuffle(question.options.map((_, i) => i));
  return question._order;
}
function renderOptions(container, question, picked, onPick) {
  const order = shuffledOrder(question);
  container.innerHTML = '';
  order.forEach((oi, shown) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.setAttribute('aria-pressed', String(picked === oi));
    b.innerHTML = `<span class="k">${'ABCDEF'[shown]}</span><span></span>`;
    b.lastChild.textContent = Sky.L(question.options[oi]);
    b.addEventListener('click', () => onPick(oi));
    container.appendChild(b);
  });
}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
function selectTab(tab) {
  $('#tabIq').classList.toggle('hidden', tab !== 'iq');
  $('#tabLevel').classList.toggle('hidden', tab !== 'level');
  $('#tabSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
}
$('#tabSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) selectTab(b.dataset.tab);
});

/* ============================================================
   IQ-ТЕСТ
   ============================================================ */
const IQ_STORE = 'iqResults';
function iqFlatQuestions() {
  const out = [];
  IQ_TEST.parts.forEach(part => {
    Sky.shuffle(part.questions).forEach(q => out.push(Object.assign({ partId: part.id, weight: part.weight }, q)));
  });
  return out;
}

let iq = null; /* состояние текущего прохождения */

function iqLastResult() {
  const list = Sky.get(IQ_STORE, []);
  return list.length ? list[list.length - 1] : null;
}
function renderIqIntro() {
  const last = iqLastResult();
  const box = $('#iqLastBox');
  box.classList.toggle('hidden', !last);
  if (last) {
    $('#iqLastScore').textContent = last.score + '/' + last.maxScore;
    $('#iqLastLevel').textContent = Sky.t('iqLevel' + last.level[0].toUpperCase() + last.level.slice(1));
    $('#iqLastDate').textContent = last.date;
  }
  updateRuNote();
}

$('#iqStartBtn').addEventListener('click', startIq);
$('#iqAgainBtn').addEventListener('click', startIq);
$('#iqToLevelBtn').addEventListener('click', () => selectTab('level'));
$('#iqShareBtn').addEventListener('click', () => {
  if (iqLastRenderedResult) openIqShareModal(iqLastRenderedResult);
});
/* Отдельной "тренировки по логике" в тренажёре сейчас нет (там банки
   по предметам), поэтому ведём в общий тренажёр с фильтром "слабые
   темы" — самый близкий по смыслу реальный раздел сайта. */
$('#iqWeakBtn').addEventListener('click', () => { location.href = 'trainer.html?mode=weak'; });

function startIq() {
  iq = {
    questions: iqFlatQuestions(),
    pos: 0,
    picked: null,
    answers: [],           /* { correct: bool, weight, partId } */
    remaining: IQ_TEST.timeLimitSec,
    timer: null
  };
  $('#iqIntro').classList.add('hidden');
  $('#iqResultBox').classList.add('hidden');
  $('#iqQuizBox').classList.remove('hidden');
  iq.timer = setInterval(iqTick, 1000);
  renderIqQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function iqTick() {
  iq.remaining--;
  renderIqTimer();
  if (iq.remaining <= 0) finishIq(true);
}
function renderIqTimer() {
  const m = Math.max(0, Math.floor(iq.remaining / 60));
  const s = Math.max(0, iq.remaining % 60);
  const el = $('#iqTimer');
  el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  el.classList.toggle('low', iq.remaining <= 60);
}

function renderIqQuestion() {
  const q = iq.questions[iq.pos];
  $('#iqPartTag').textContent = Sky.t('part' + q.partId[0].toUpperCase() + q.partId.slice(1));
  $('#iqCountTag').textContent = Sky.t('countOf', '%1 / %2').replace('%1', iq.pos + 1).replace('%2', iq.questions.length);
  $('#iqBar').style.width = Math.round(iq.pos / iq.questions.length * 100) + '%';
  $('#iqQText').textContent = Sky.L(q.text);
  /* renderOptions перерисовывается при каждом клике по варианту —
     picked запоминается в iq.picked, а не сбрасывается тут, иначе
     выбор пропадал бы сразу после клика (см. ту же логику в lv). */
  renderOptions($('#iqOptions'), q, iq.picked, oi => { iq.picked = oi; renderIqQuestion(); });
  $('#iqNextBtn').disabled = (iq.picked === null);
  renderIqTimer();
}

$('#iqNextBtn').addEventListener('click', () => {
  if (!iq || iq.picked === null) return;
  const q = iq.questions[iq.pos];
  iq.answers.push({ correct: iq.picked === q.answer, weight: q.weight, partId: q.partId });
  iq.pos++;
  iq.picked = null;
  if (iq.pos >= iq.questions.length) finishIq(false);
  else renderIqQuestion();
});

$('#iqStopBtn').addEventListener('click', () => {
  if (iq && iq.timer) clearInterval(iq.timer);
  iq = null;
  $('#iqQuizBox').classList.add('hidden');
  $('#iqIntro').classList.remove('hidden');
  renderIqIntro();
});

/* Псевдо-среднее для сравнения результата — реальной статистики по
   всем ученикам платформа пока не собирает, поэтому берём константу
   (см. ТЗ на редизайн результата). Как только появится агрегированная
   статистика — заменить на неё. */
const IQ_AVERAGE_PERCENT = 60;
/* Публичный адрес для QR-кода и ссылок в шаринге — реальный адрес
   GitHub Pages этого репозитория. Если у проекта появится домен
   skyschool.app, поменять здесь. */
const IQ_SHARE_URL = 'https://news92-tg.github.io/skyschool/';

let iqLastRenderedResult = null; /* нужен кнопке «Поделиться» после отрисовки результата */

function finishIq(timedOut) {
  clearInterval(iq.timer);
  const maxScore = IQ_TEST.parts.reduce((s, p) => s + p.questions.length * p.weight, 0);
  const score = iq.answers.reduce((s, a) => s + (a.correct ? a.weight : 0), 0);
  const percent = Math.round(score / maxScore * 100);
  const level = percent < 40 ? 'low' : percent < 75 ? 'mid' : 'high';

  const byPart = {};
  IQ_TEST.parts.forEach(p => { byPart[p.id] = { correct: 0, total: p.questions.length }; });
  iq.answers.forEach(a => { if (a.correct) byPart[a.partId].correct++; });

  const result = { date: Sky.dayKey(), score, maxScore, percent, level, parts: byPart };
  const list = Sky.get(IQ_STORE, []);
  list.push(result);
  Sky.set(IQ_STORE, list.slice(-10));
  iqLastRenderedResult = result;

  $('#iqQuizBox').classList.add('hidden');
  $('#iqResultBox').classList.remove('hidden');

  /* счёт анимированно считается от 0 к итоговому значению */
  animateIqCount($('#iqScoreOut'), 0, score, 900);
  $('#iqPercentOut').textContent = percent + '%';

  const badge = $('#iqLevelBadge');
  badge.className = 'tag iq-level-badge ' + (level === 'high' ? 'ok' : level === 'mid' ? 'warn' : 'no');
  badge.textContent = Sky.t('iqLevel' + level[0].toUpperCase() + level.slice(1));
  $('#iqLevelText').textContent = Sky.t(
    percent >= 80 ? 'iqTeacherHigh' : percent >= 50 ? 'iqTeacherMid' : 'iqTeacherLow'
  );

  renderIqCompare(percent);
  renderIqRings(percent, byPart);
  renderIqHistory(list);
  renderIqAdvice(byPart);

  if (timedOut) Sky.toast(Sky.t('timeUp'));
  iq = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function animateIqCount(el, from, to, duration) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; return; }
  const start = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(step);
  })(start);
}

/* ---------- сравнение с другими ---------- */
function renderIqCompare(percent) {
  const row = $('#iqCompareRow'); row.innerHTML = '';
  const chips = [];
  if (percent >= 80) chips.push({ cls: 'top', text: Sky.t('iqTopPercent') });
  const diff = percent - IQ_AVERAGE_PERCENT;
  let avgText;
  if (diff > 0) avgText = Sky.t('iqAboveAvg').replace('%1', IQ_AVERAGE_PERCENT).replace('%2', diff);
  else if (diff < 0) avgText = Sky.t('iqBelowAvg').replace('%1', IQ_AVERAGE_PERCENT).replace('%2', Math.abs(diff));
  else avgText = Sky.t('iqAtAvg').replace('%1', IQ_AVERAGE_PERCENT);
  chips.push({ cls: '', text: avgText });
  chips.forEach(c => {
    const span = document.createElement('span');
    span.className = 'iq-compare-chip' + (c.cls ? ' ' + c.cls : '');
    span.textContent = c.text;
    row.appendChild(span);
  });
}

/* ---------- кольцевая диаграмма (вместо трёх плоских карточек) ---------- */
const IQ_RING_DEFS = [
  { key: 'outer', r: 96, w: 13 },
  { key: 'easy', r: 76, w: 10 },
  { key: 'medium', r: 58, w: 10 },
  { key: 'hard', r: 40, w: 10 }
];
function iqRingColor(pct) {
  return pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--no)';
}
function renderIqRings(percent, byPart) {
  const svg = $('#iqRingsSvg');
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 110, CY = 110;

  const values = {
    outer: percent,
    easy: Sky.pct(byPart.easy.correct, byPart.easy.total),
    medium: Sky.pct(byPart.medium.correct, byPart.medium.total),
    hard: Sky.pct(byPart.hard.correct, byPart.hard.total)
  };
  const colors = {
    outer: 'var(--m-learn)',
    easy: iqRingColor(values.easy),
    medium: iqRingColor(values.medium),
    hard: iqRingColor(values.hard)
  };

  const items = [];
  IQ_RING_DEFS.forEach(def => {
    const c = 2 * Math.PI * def.r;
    const track = document.createElementNS(NS, 'circle');
    track.setAttribute('class', 'iq-ring-track');
    track.setAttribute('cx', CX); track.setAttribute('cy', CY); track.setAttribute('r', def.r);
    track.setAttribute('stroke-width', def.w);
    svg.appendChild(track);

    const prog = document.createElementNS(NS, 'circle');
    prog.setAttribute('class', 'iq-ring-progress');
    prog.setAttribute('cx', CX); prog.setAttribute('cy', CY); prog.setAttribute('r', def.r);
    prog.setAttribute('stroke-width', def.w);
    prog.setAttribute('stroke', colors[def.key]);
    prog.setAttribute('stroke-dasharray', c.toFixed(2));
    prog.setAttribute('stroke-dashoffset', c.toFixed(2));
    svg.appendChild(prog);
    items.push({ el: prog, c, v: values[def.key] });
  });

  $('#iqRingsPercent').textContent = percent + '%';

  const legend = $('#iqPartsGrid'); legend.innerHTML = '';
  [
    { label: Sky.t('iqTotalLabel'), frac: percent + '%', color: colors.outer },
    { label: Sky.t('partEasy'), frac: `${byPart.easy.correct}/${byPart.easy.total}`, color: colors.easy },
    { label: Sky.t('partMedium'), frac: `${byPart.medium.correct}/${byPart.medium.total}`, color: colors.medium },
    { label: Sky.t('partHard'), frac: `${byPart.hard.correct}/${byPart.hard.total}`, color: colors.hard }
  ].forEach(row => {
    const div = document.createElement('div');
    div.className = 'iq-legend-row';
    div.innerHTML = `<span class="iq-legend-dot" style="background:${row.color}"></span>${row.label}<b>${row.frac}</b>`;
    legend.appendChild(div);
  });

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const apply = () => items.forEach(it => {
    const off = it.c * (1 - Math.max(0, Math.min(100, it.v)) / 100);
    it.el.setAttribute('stroke-dashoffset', off.toFixed(2));
  });
  if (reduceMotion) apply();
  else requestAnimationFrame(() => requestAnimationFrame(apply));
}

/* ---------- история попыток (спарклайн по последним 5) ---------- */
function renderIqHistory(list) {
  const block = $('#iqHistoryBlock');
  const svg = $('#iqHistorySvg');
  const deltaEl = $('#iqHistoryDelta');
  svg.innerHTML = '';

  const hist = list.slice(-5).map(r => r.percent);
  if (hist.length < 2) { block.classList.add('hidden'); return; }
  block.classList.remove('hidden');

  const NS = 'http://www.w3.org/2000/svg';
  const W = 320, H = 64, PAD_X = 6, PAD_T = 8, PAD_B = 10;
  const pts = hist.map((v, i) => ({
    x: PAD_X + i * (W - PAD_X * 2) / (hist.length - 1),
    y: H - PAD_B - (Math.max(0, Math.min(100, v)) / 100) * (H - PAD_T - PAD_B)
  }));

  const defs = document.createElementNS(NS, 'defs');
  const grad = document.createElementNS(NS, 'linearGradient');
  grad.setAttribute('id', 'iqHistGrad');
  grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0'); grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
  const s1 = document.createElementNS(NS, 'stop');
  s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', 'var(--m-learn)'); s1.setAttribute('stop-opacity', '.35');
  const s2 = document.createElementNS(NS, 'stop');
  s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', 'var(--m-learn)'); s2.setAttribute('stop-opacity', '0');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);
  svg.appendChild(defs);

  const line = 'M' + pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
  const area = line + ` L${pts[pts.length - 1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;

  const areaPath = document.createElementNS(NS, 'path');
  areaPath.setAttribute('class', 'iq-history-area'); areaPath.setAttribute('d', area);
  svg.appendChild(areaPath);

  const linePath = document.createElementNS(NS, 'path');
  linePath.setAttribute('class', 'iq-history-line'); linePath.setAttribute('d', line);
  svg.appendChild(linePath);

  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('class', 'iq-history-dot' + (last ? ' last' : ''));
    dot.setAttribute('cx', p.x.toFixed(1)); dot.setAttribute('cy', p.y.toFixed(1));
    dot.setAttribute('r', last ? 4 : 3);
    svg.appendChild(dot);
  });

  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && linePath.getTotalLength) {
    const len = linePath.getTotalLength();
    linePath.style.strokeDasharray = String(len);
    linePath.style.strokeDashoffset = String(len);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      linePath.style.transition = 'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)';
      linePath.style.strokeDashoffset = '0';
    }));
  }

  const first = hist[0], last = hist[hist.length - 1], delta = last - first;
  if (delta > 0) {
    deltaEl.textContent = Sky.t('iqHistoryUp').replace('%1', delta).replace('%2', hist.length);
    deltaEl.style.color = 'var(--ok)';
  } else if (delta < 0) {
    deltaEl.textContent = Sky.t('iqHistoryDown').replace('%1', Math.abs(delta));
    deltaEl.style.color = 'var(--no)';
  } else {
    deltaEl.textContent = Sky.t('iqHistoryFlat');
    deltaEl.style.color = '';
  }
}

function iqRoundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function drawIqShareCard(canvas, result) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#2f5bea'); bg.addColorStop(1, '#7c3aed');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = .12; ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(W * .85, H * .12, 220, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W * .08, H * .9, 260, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '600 32px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(Sky.t('iqShareBrand'), W / 2, 110);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 190px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(`${result.score}/${result.maxScore}`, W / 2, 430);

  ctx.font = '700 64px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText(`${result.percent}%`, W / 2, 520);

  const levelLabel = Sky.t('iqLevel' + result.level[0].toUpperCase() + result.level.slice(1));
  ctx.font = '700 40px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const pillPadX = 40, textW = ctx.measureText(levelLabel).width;
  const pillW = textW + pillPadX * 2, pillH = 78, pillX = W / 2 - pillW / 2, pillY = 570;
  iqRoundRectPath(ctx, pillX, pillY, pillW, pillH, pillH / 2);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.fillText(levelLabel, W / 2, pillY + pillH / 2 + 14);

  const me = (window.Sky && Sky.db && Sky.db.me && Sky.db.me()) || null;
  const userName = (me && me.name) || Sky.t('student');
  const dateStr = new Intl.DateTimeFormat(Sky.lang === 'en' ? 'en-US' : 'ru-RU', {
    day: 'numeric', month: 'long', year: 'numeric'
  }).format(new Date());

  ctx.font = '600 38px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillText(userName, W / 2, 800);

  ctx.font = '400 28px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(dateStr, W / 2, 840);

  ctx.font = '700 44px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#ffffff'; ctx.fillText(Sky.t('iqShareSlogan'), W / 2, 940);

  await drawIqQrOrFallback(ctx, W, H);
}

function loadIqImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function drawIqQrOrFallback(ctx, W, H) {
  const size = 150, x = W - size - 60, y = H - size - 60;
  try {
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(IQ_SHARE_URL);
    const img = await loadIqImage(qrUrl);
    ctx.fillStyle = '#ffffff';
    iqRoundRectPath(ctx, x - 12, y - 12, size + 24, size + 24, 16); ctx.fill();
    ctx.drawImage(img, x, y, size, size);
    ctx.canvas.toDataURL(); /* проверка на "tainted canvas" из-за CORS — иначе узнали бы только при скачивании */
  } catch (e) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    iqRoundRectPath(ctx, x - 12, y - 12, size + 24, size + 24, 16); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('skyschool', x + size / 2, y + size / 2 - 4);
    ctx.restore();
  }
}

function downloadIqShareCanvas(canvas, result) {
  try {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `skyschool-iq-${result.percent}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  } catch (e) {
    Sky.toast(iqShareText(result));
  }
}

async function iqNativeShare(canvas, result) {
  try {
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], 'skyschool-result.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: iqShareText(result) });
      return;
    }
  } catch (e) { /* падаем в текстовый шаринг ниже */ }
  try { await navigator.share({ text: iqShareText(result), url: IQ_SHARE_URL }); } catch (e) { /* пользователь отменил — ничего не делаем */ }
}

function levelResults() { return Sky.get(LEVEL_STORE, {}); }

/* Берём 10 вопросов из готового банка предмета: стараемся взять
   3 простых + 4 средних + 3 сложных, а если в банке не хватает
   какой-то сложности — просто добираем остальными заданиями. */
function pickLevelQuestions(bank, n) {
  const byDiff = { easy: [], medium: [], hard: [] };
  bank.tasks.forEach(t => (byDiff[t.difficulty] || byDiff.medium).push(t));
  const targets = { easy: 3, medium: 4, hard: 3 };
  let picked = [];
  ['easy', 'medium', 'hard'].forEach(d => { picked = picked.concat(Sky.shuffle(byDiff[d]).slice(0, targets[d])); });
  if (picked.length < n) {
    const have = new Set(picked.map(t => t.id));
    const rest = Sky.shuffle(bank.tasks.filter(t => !have.has(t.id)));
    picked = picked.concat(rest.slice(0, n - picked.length));
  }
  return Sky.shuffle(picked.slice(0, n));
}

function levelBadgeClass(level) {
  return level === 'adv' ? 'adv' : level === 'mid' ? 'mid' : level === 'start' ? 'start' : 'none';
}
function levelLabel(level) {
  return Sky.t(level === 'adv' ? 'lvLevelAdv' : level === 'mid' ? 'lvLevelMid' : level === 'start' ? 'lvLevelStart' : 'lvLevelNone');
}

function renderSubjCards() {
  const results = levelResults();
  const box = $('#subjCards'); box.innerHTML = '';
  let anyDone = false;

  LEVEL_SUBJECTS.forEach(id => {
    const bank = window.BANKS && window.BANKS[id];
    if (!bank) return; /* банк почему-то не подключился — просто пропускаем карточку */
    const res = results[id];
    if (res) anyDone = true;

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'subj-card';
    card.innerHTML =
      `<span class="ic">${bank.icon}</span><b>${Sky.L(bank.name)}</b>` +
      `<span class="lvl ${levelBadgeClass(res ? res.level : null)}">${res ? levelLabel(res.level) + ' · ' + res.correct + '/10' : Sky.t('lvLevelNone')}</span>`;
    card.addEventListener('click', () => startLevelTest(id));
    box.appendChild(card);
  });

  $('#toPlanBtn').classList.toggle('hidden', !anyDone);
}

let lv = null;

function startLevelTest(subjectId) {
  const bank = window.BANKS[subjectId];
  lv = { subjectId, bank, questions: pickLevelQuestions(bank, 10), pos: 0, picked: null, correct: 0 };
  $('#levelIntro').classList.add('hidden');
  $('#levelResultBox').classList.add('hidden');
  $('#levelQuizBox').classList.remove('hidden');
  renderLevelQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderLevelQuestion() {
  const q = lv.questions[lv.pos];
  $('#lvSubjTag').textContent = Sky.L(lv.bank.name);
  $('#lvCountTag').textContent = Sky.t('countOf', '%1 / %2').replace('%1', lv.pos + 1).replace('%2', lv.questions.length);
  $('#lvBar').style.width = Math.round(lv.pos / lv.questions.length * 100) + '%';
  $('#lvQText').textContent = Sky.L(q.text);
  renderOptions($('#lvOptions'), q, lv.picked, oi => { lv.picked = oi; renderLevelQuestion(); });
  $('#lvNextBtn').disabled = (lv.picked === null);
}

$('#lvNextBtn').addEventListener('click', () => {
  if (!lv || lv.picked === null) return;
  const q = lv.questions[lv.pos];
  if (lv.picked === q.answer) lv.correct++;
  lv.pos++;
  lv.picked = null;
  if (lv.pos >= lv.questions.length) finishLevelTest();
  else renderLevelQuestion();
});

$('#lvStopBtn').addEventListener('click', () => {
  lv = null;
  $('#levelQuizBox').classList.add('hidden');
  $('#levelIntro').classList.remove('hidden');
  renderSubjCards();
});
$('#lvBackBtn').addEventListener('click', () => {
  $('#levelResultBox').classList.add('hidden');
  $('#levelIntro').classList.remove('hidden');
  renderSubjCards();
});

function finishLevelTest() {
  const level = lv.correct <= 3 ? 'start' : lv.correct <= 7 ? 'mid' : 'adv';
  const all = levelResults();
  all[lv.subjectId] = { date: Sky.dayKey(), correct: lv.correct, total: lv.questions.length, level };
  Sky.set(LEVEL_STORE, all);

  $('#levelQuizBox').classList.add('hidden');
  $('#levelResultBox').classList.remove('hidden');
  $('#lvResultSubj').textContent = Sky.L(lv.bank.name);
  $('#lvScoreOut').textContent = Sky.t('lvScoreOf').replace('%1', lv.correct).replace('%2', lv.questions.length);
  const badge = $('#lvLevelBadge');
  badge.className = 'tag ' + (level === 'adv' ? 'ok' : level === 'mid' ? 'warn' : 'no');
  badge.textContent = levelLabel(level);

  lv = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   СТАРТ
   ============================================================ */
document.addEventListener('langchange', () => { renderIqIntro(); renderSubjCards(); });
renderIqIntro();
renderSubjCards();

const startTab = ['iq', 'level'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'iq';
selectTab(startTab);
</script>
