<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Первые шаги — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<!-- Знакомство учителя: 4 шага, пока нет ни одной подборки.
     Логика — assets/onboarding.js, база — sql/schema-teacher-tools.sql. -->
<style>
  .ob-wrap{max-width:720px}
  .ob-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:22px 30px 30px}
  .ob-top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .ob-bar{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ob-bar span{height:6px;border-radius:99px;background:var(--line);transition:background .3s}
  .ob-bar span.done{background:var(--accent)}
  .ob-bar span.now{background:linear-gradient(90deg,var(--accent) 55%,var(--line) 55%)}
  .ob-count{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  .ob-skip{font:inherit;font-size:13px;font-weight:800;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 2px}
  .ob-skip:hover{color:var(--ink)}
  #obBody h1{font-size:clamp(26px,4vw,34px);margin:0 0 8px}
  #obBody h1:focus{outline:none}
  #obBody .lead{margin:0 0 20px}
  .ob-hero{display:flex;justify-content:flex-start;margin-bottom:14px}
  .ob-hero .logo{width:84px;height:auto}
  .ob-hero.done{font-size:56px;line-height:1}
  .ob-feats{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .ob-feats li{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);font-weight:800;font-size:13.5px}
  .ob-feats span{font-size:22px}
  .ob-acts{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
  [data-step="1"] .ob-acts{justify-content:flex-start}
  .ob-later{font:inherit;font-size:13.5px;font-weight:800;color:var(--muted);background:none;border:0;cursor:pointer;margin-right:auto;padding:8px 4px}
  .ob-later:hover{color:var(--ink)}
  .ob-err{margin:12px 0 0;padding:10px 12px;border-radius:11px;background:var(--no-soft);color:var(--no);font-size:13px;font-weight:800}

  .ob-subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .ob-subj{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;border:1.5px solid var(--line);border-radius:var(--r);
    background:var(--panel);font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;transition:.15s}
  .ob-subj .ico{font-size:26px;line-height:1}
  .ob-subj:hover{border-color:var(--line-2);transform:translateY(-1px)}
  .ob-subj[aria-pressed="true"]{border-color:var(--accent);background:var(--m-learn-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  .ob-subj .tick{position:absolute;top:7px;right:8px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
    background:var(--accent);color:#fff;opacity:0;transform:scale(.6);transition:.15s}
  .ob-subj[aria-pressed="true"] .tick{opacity:1;transform:none}

  .ob-form{display:grid;gap:14px}
  .ob-pair{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
  .ob-kind{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);justify-self:start}
  .ob-kind button{font:inherit;font-size:13px;font-weight:800;padding:8px 14px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
  .ob-kind button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
  .ob-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ob-opt{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:.15s}
  .ob-opt:has(input[type=radio]:checked){border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .ob-opt input[type=text]{flex:1;min-width:0;border:0;background:none;padding:9px 12px;font:inherit;font-size:14px;color:var(--ink);outline:none}
  .ob-right{flex:none;cursor:pointer}
  .ob-right input{position:absolute;opacity:0;pointer-events:none}
  .ob-right span{display:block;padding:6px 9px;border-radius:9px;font-size:11.5px;font-weight:900;color:var(--faint);background:var(--panel-2);white-space:nowrap}
  .ob-right input:checked + span{background:var(--ok);color:#fff}
  .ob-right input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

  .ob-share{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2)}
  .ob-share span{display:block;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .ob-code{font-family:'JetBrains Mono',monospace;font-size:28px;letter-spacing:.14em;color:var(--ink)}
  .ob-link{display:flex;gap:8px;min-width:0}
  .ob-link input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);font:inherit;font-size:13px}
  .ob-next{display:grid;gap:8px;margin-top:18px}
  .ob-next b{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .ob-next a{padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-weight:800;font-size:14px;transition:.15s}
  .ob-next a:hover{border-color:var(--accent);color:var(--accent)}

  @media (max-width:640px){
    .ob-card{padding:18px 18px 22px;border-radius:var(--r-lg)}
    .ob-subjects{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ob-feats{grid-template-columns:minmax(0,1fr)}
    .ob-feats li{flex-direction:row;align-items:center}
    .ob-pair,.ob-opts{grid-template-columns:minmax(0,1fr)}
    .ob-share{grid-template-columns:minmax(0,1fr)}
    .ob-acts .btn{flex:1}
    .ob-later{order:3;width:100%;margin:0}
    .ob-kind{justify-self:stretch}
    .ob-kind button{padding:8px 6px;white-space:nowrap}
  }
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap ob-wrap">
  <div id="obGate"></div>
  <section class="ob-card" id="obCard" hidden aria-live="polite">
    <div class="ob-top">
      <div class="ob-bar" id="obBar" aria-hidden="true"></div>
      <span class="ob-count" id="obCount"></span>
      <button type="button" class="ob-skip" id="obSkip" data-i18n="obSkip"></button>
    </div>
    <div id="obBody"></div>
  </section>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/collection-common.js"></script>
<script src="assets/onboarding.js"></script>
</body>
</html>
