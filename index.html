<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyySchool — учиться легко</title>
<meta name="description" content="Ученику — подготовка к ОГЭ и ЕГЭ с разбором, задания от учителя, шахматы и план. Учителю — подборки заданий по ссылке и быстрая проверка работ.">
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<style>
.hero{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center;
  padding:14px 0 6px;
}
.hero .cloud{width:150px;opacity:.95;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .cloud{display:none}}

/* две цели: ученик и учитель */
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}
@media(max-width:760px){.goals{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:18px}}
.goal{--g:var(--m-learn);--g-soft:var(--m-learn-soft);padding:20px;display:flex;flex-direction:column;gap:14px}
.goal.teacher{--g:var(--m-teach);--g-soft:var(--m-teach-soft)}
.goal.mine{border-color:var(--g);box-shadow:0 0 0 1px var(--g),var(--shadow-sm)}
.goal-head{display:flex;align-items:center;gap:14px}
.goal-head .ico{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--g-soft)}
.goal-head h2{font-size:22px}
.goal-head p{font-size:13px;color:var(--muted);margin-top:2px}
.goal-head .tag{margin-left:auto;align-self:flex-start;background:var(--g-soft);color:var(--g)}
.goal-links{display:flex;flex-direction:column;gap:8px}
.goal-links a{
  display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;
  min-height:58px;padding:9px 14px 9px 10px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel-2);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s,transform .15s;
}
.goal-links a:hover{border-color:var(--g);background:var(--panel);transform:translateX(2px)}
.goal-links a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.goal-links .gi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--g-soft)}
.goal-links b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.goal-links small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.goal-links .arr{color:var(--g);font-weight:900;font-size:18px}

/* что повторить: компактные строки вместо больших плиток */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
@media(max-width:560px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.subj{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-decoration:none;
  transition:border-color .15s,transform .15s}
.subj:hover{border-color:var(--m-learn);transform:translateY(-2px)}
.subj:focus-visible{outline:2px solid var(--m-learn);outline-offset:2px}
.subj .si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--m-learn-soft);color:var(--m-learn)}
.subj b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.subj small .due{color:var(--m-learn);font-weight:800}
.subj small .done{color:var(--ok);font-weight:800}
@media(max-width:560px){.subj{grid-template-columns:30px minmax(0,1fr);gap:8px;padding:9px 10px}.subj .si{width:30px;height:30px;font-size:15px}}
.today-card{
  background:linear-gradient(135deg,var(--sky-500),var(--sky-700));
  color:#fff;border:none;
}
:root[data-theme="dark"] .today-card{background:linear-gradient(135deg,#1a6fd8,#0d3a70)}
.today-card .eyebrow,.today-card .lead{color:rgba(255,255,255,.82)}
.today-card .ring .bg{stroke:rgba(255,255,255,.22)}
.today-card .ring .fg{stroke:#fff}
.today-card .ring .mid{color:#fff}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">

  <section class="hero rise">
    <div>
      <h1 data-i18n="h1"></h1>
      <p class="lead" style="margin-top:10px" data-i18n="lead"></p>
    </div>
    <div class="cloud" id="heroCloud"></div>
  </section>

  <!-- две цели -->
  <div class="goals rise">
    <section class="panel goal student" id="goalStudent" aria-labelledby="goalStudentT">
      <div class="goal-head">
        <span class="ico" aria-hidden="true">🎒</span>
        <div><h2 id="goalStudentT" data-i18n="gStudent"></h2><p data-i18n="gStudentD"></p></div>
        <span class="tag" hidden data-i18n="gMine"></span>
      </div>
      <div class="goal-links" id="studentLinks"></div>
    </section>
    <section class="panel goal teacher" id="goalTeacher" aria-labelledby="goalTeacherT">
      <div class="goal-head">
        <span class="ico" aria-hidden="true">🎓</span>
        <div><h2 id="goalTeacherT" data-i18n="gTeacher"></h2><p data-i18n="gTeacherD"></p></div>
        <span class="tag" hidden data-i18n="gMine"></span>
      </div>
      <div class="goal-links" id="teacherLinks"></div>
    </section>
  </div>

  <!-- сегодня -->
  <div class="grid g2 section">
    <div class="panel today-card rise" style="display:flex;gap:20px;align-items:center">
      <div class="ring" id="goalRing">
        <svg viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="40"/><circle class="fg" cx="48" cy="48" r="40"/></svg>
        <div class="mid" id="goalMid">0%</div>
      </div>
      <div style="min-width:0">
        <div class="eyebrow" data-i18n="todayGoal"></div>
        <div class="count" id="goalNow" style="margin:4px 0 4px">0</div>
        <p class="lead" style="font-size:13px" id="goalNote"></p>
      </div>
    </div>
    <div class="panel rise">
      <div class="eyebrow" data-i18n="untilExam"></div>
      <div class="count" id="examDays" style="margin:6px 0 4px">—</div>
      <p class="lead" style="font-size:13px" id="examNote"></p>
      <div id="examExtra" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="stats section rise">
    <div class="stat accent"><b id="stSolved">0</b><span data-i18n="solved"></span></div>
    <div class="stat"><b id="stAcc">0%</b><span data-i18n="accuracy"></span></div>
    <div class="stat ok"><b id="stStreak">0</b><span data-i18n="streak"></span></div>
    <div class="stat"><b id="stBest">0</b><span data-i18n="best"></span></div>
  </div>

  <!-- что повторить -->
  <div class="section">
    <div class="section-head">
      <h2 data-i18n="repeat"></h2>
      <span class="lead" style="font-size:12px" data-i18n="repeatNote"></span>
    </div>
    <div class="subjects" id="subjectCards"></div>
  </div>

  <!-- ошибки -->
  <div class="section" id="weakSection" hidden>
    <div class="section-head"><h2 data-i18n="weak"></h2></div>
    <div class="panel" id="weakPanel"><div class="list" id="weakList"></div></div>
  </div>

</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="data/bank-math.js"></script>
<script src="data/bank-informatics.js"></script>
<script src="data/bank-russian.js"></script>
<script src="data/bank-physics.js"></script>
<script src="data/bank-biology.js"></script>
<script src="data/bank-chemistry.js"></script>
<script src="data/bank-geography.js"></script>
<script src="data/bank-social.js"></script>
<script src="data/bank-history.js"></script>
<script src="data/bank-english.js"></script>
<script src="data/bank-polish.js"></script>
<script src="data/bank-spanish.js"></script>
<script src="data/bank-german.js"></script>
<script>
'use strict';
Sky.init({
  h1:{ru:'Готовиться к экзаменам и учить — в одном месте',en:'Prepare for exams and teach — in one place'},
  lead:{ru:'Ученику — тренажёр ОГЭ и ЕГЭ с разбором каждого решения, задания от учителя и шахматы. Учителю — подборки заданий по ссылке и проверка работ за минуты.',
        en:'For students: exam practice with a walkthrough for every problem, homework from the teacher and chess. For teachers: task sets shared by link and marking in minutes.'},

  gStudent:{ru:'Я ученик',en:'I’m a student'},
  gStudentD:{ru:'Готовлюсь к экзаменам и делаю задания',en:'Preparing for exams and doing homework'},
  gTeacher:{ru:'Я учитель',en:'I’m a teacher'},
  gTeacherD:{ru:'Даю задания и проверяю работы',en:'Setting tasks and marking work'},
  gMine:{ru:'Это вы',en:'That’s you'},
  sExam:{ru:'Готовиться к ОГЭ/ЕГЭ',en:'Prepare for exams'},
  sExamD:{ru:'Задания по предметам с подсказкой и полным разбором',en:'Problems by subject with a hint and a full walkthrough'},
  sHw:{ru:'Мои задания от учителя',en:'My homework from the teacher'},
  sHwD:{ru:'Откройте по коду от учителя или из своего класса',en:'Open by the teacher’s code or from your class'},
  sChess:{ru:'Играть в шахматы',en:'Play chess'},
  sChessD:{ru:'Уроки, задачи с разбором и партия против бота',en:'Lessons, puzzles with explanations and a game against the bot'},
  sPlan:{ru:'Мой план',en:'My plan'},
  sPlanD:{ru:'Дата экзамена, цель на день и список дел',en:'Exam date, a daily goal and a to-do list'},
  tCreate:{ru:'Создать задание',en:'Create a task set'},
  tCreateD:{ru:'Подборка по ссылке — ответы проверяются сами',en:'Shared by link — answers are checked automatically'},
  tCheck:{ru:'Проверить работы',en:'Mark work'},
  tCheckD:{ru:'Фото эталона и работ — оценки всего класса',en:'Photo of the key and the papers — marks for the whole class'},
  tStudents:{ru:'Мои ученики',en:'My students'},
  tStudentsD:{ru:'Успеваемость класса и у кого больше всего ошибок',en:'Class progress and who struggles most'},

  todayGoal:{ru:'Решено сегодня',en:'Solved today'},
  untilExam:{ru:'До экзамена',en:'Until the exam'},
  solved:{ru:'решено всего',en:'solved overall'},
  accuracy:{ru:'верных ответов',en:'correct answers'},
  streak:{ru:'подряд сейчас',en:'current streak'},
  best:{ru:'лучшая серия',en:'best streak'},

  noExam:{ru:'Дата не задана. Поставьте её на странице «План» — появится обратный отсчёт и посильный темп на каждый день.',
          en:'No date set. Add it on the Plan page and you get a countdown and a realistic daily pace.'},
  examPast:{ru:'Дата уже прошла. Поставьте новую на странице «План».',en:'That date has passed. Set a new one on the Plan page.'},
  setExam:{ru:'Поставить дату',en:'Set the date'},
  goalOf:{ru:'из %1 по плану на день',en:'of %1 planned for today'},
  goalDone:{ru:'Цель на сегодня выполнена. Дальше — по желанию.',en:'Today’s goal is done. Anything more is a bonus.'},
  goalStart:{ru:'Ещё ничего не решено сегодня. Начните с пяти минут.',en:'Nothing solved today yet. Five minutes is a fine start.'},

  repeat:{ru:'Что повторить',en:'What to review'},
  repeatNote:{ru:'по методу интервального повторения',en:'using spaced repetition'},
  due:{ru:'доступно сейчас',en:'available now'},
  allDone:{ru:'всё повторено',en:'all reviewed'},
  ofTotal:{ru:'%1 заданий',en:'%1 problems'},
  weak:{ru:'Работа над ошибками',en:'Your mistakes'},
  times:{ru:'ошибок: %1',en:'mistakes: %1'},
  practise:{ru:'Решать',en:'Practise'}
});

const BANKS = window.BANKS || {};
const $ = s => document.querySelector(s);

document.getElementById('heroCloud').innerHTML = Sky.logoSvg('');

/* Куда ведут кнопки целей. «Мои ученики» — пока аналитика класса: там
   успеваемость каждого ученика; отдельная страница учеников появится
   позже — тогда поменять ссылку здесь. */
const GOALS = {
  student: [
    { href:'trainer.html',  ico:'📚', t:'sExam',  d:'sExamD' },
    { href:'homework.html', ico:'📝', t:'sHw',    d:'sHwD' },
    { href:'chess.html',    ico:'♞',  t:'sChess', d:'sChessD' },
    { href:'plan.html',     ico:'🗓', t:'sPlan',  d:'sPlanD' }
  ],
  teacher: [
    { href:'collections.html', ico:'✏️', t:'tCreate',   d:'tCreateD' },
    { href:'fast-check.html',  ico:'✅', t:'tCheck',    d:'tCheckD' },
    { href:'analytics.html',   ico:'👥', t:'tStudents', d:'tStudentsD' }
  ]
};

function renderGoals() {
  const links = list => list.map(g =>
    `<a href="${g.href}"><span class="gi" aria-hidden="true">${g.ico}</span>
       <span><b>${Sky.t(g.t)}</b><small>${Sky.t(g.d)}</small></span>
       <span class="arr" aria-hidden="true">→</span></a>`).join('');
  $('#studentLinks').innerHTML = links(GOALS.student);
  $('#teacherLinks').innerHTML = links(GOALS.teacher);

  /* Вошли — отмечаем свою карточку; учителю она идёт первой и на телефоне. */
  const me = Sky.db && Sky.db.me && Sky.db.me();
  const role = me && me.role;
  const mine = role === 'teacher' ? 'teacher' : (role === 'student' ? 'student' : null);
  [['student', '#goalStudent'], ['teacher', '#goalTeacher']].forEach(([id, sel]) => {
    const el = $(sel);
    el.classList.toggle('mine', mine === id);
    el.querySelector('.tag').hidden = mine !== id;
  });
  $('#goalTeacher').style.order = mine === 'teacher' ? '-1' : '';
}

function renderToday() {
  const s = Sky.stats();
  $('#stSolved').textContent = s.solved;
  $('#stAcc').textContent = Sky.pct(s.right, s.solved) + '%';
  $('#stStreak').textContent = s.streak;
  $('#stBest').textContent = s.best;

  const plan = Sky.get('plan', {});
  const goal = plan.goal || 10;
  const done = Sky.todayCount();
  const share = Math.min(100, Math.round(done / goal * 100));

  $('#goalNow').textContent = done;
  $('#goalNote').textContent = done >= goal ? Sky.t('goalDone')
    : done === 0 ? Sky.t('goalStart')
    : Sky.t('goalOf').replace('%1', goal);
  $('#goalMid').textContent = share + '%';

  const r = 40, c = 2 * Math.PI * r;
  const fg = $('#goalRing .fg');
  fg.style.strokeDasharray = c;
  fg.style.strokeDashoffset = c * (1 - share / 100);

  const d = Sky.daysLeft(plan.exam);
  const extra = $('#examExtra');
  if (d === null) {
    $('#examDays').textContent = '—';
    $('#examNote').textContent = Sky.t('noExam');
    extra.innerHTML = `<a class="btn ghost small" href="plan.html">${Sky.t('setExam')}</a>`;
  } else if (d < 0) {
    $('#examDays').textContent = '—';
    $('#examNote').textContent = Sky.t('examPast');
    extra.innerHTML = `<a class="btn ghost small" href="plan.html">${Sky.t('setExam')}</a>`;
  } else {
    $('#examDays').textContent = d;
    $('#examNote').textContent = plan.examName ||
      (Sky.lang === 'ru' ? Sky.plural(d, 'день', 'дня', 'дней') + ' на подготовку' : 'days to prepare');
    extra.innerHTML = '';
  }
}

function renderSubjects() {
  const box = $('#subjectCards');
  box.innerHTML = '';
  for (const bank of Object.values(BANKS)) {
    const ids = bank.tasks.map(t => t.id);
    const due = Sky.dueIds(bank.id, ids).length;
    const st = Sky.stats().bySubject[bank.id];
    const a = document.createElement('a');
    a.className = 'subj';
    a.href = 'trainer.html?subject=' + bank.id;
    a.innerHTML = '<span class="si" aria-hidden="true"></span><span><b></b><small><span></span></small></span>';
    a.querySelector('.si').textContent = bank.icon;
    a.querySelector('b').textContent = Sky.L(bank.name);
    const mark = a.querySelector('small span');
    mark.className = due ? 'due' : 'done';
    mark.textContent = due ? due + ' ' + Sky.t('due') : Sky.t('allDone');
    if (st) mark.after(' · ' + Sky.pct(st.right, st.n) + '% ' + Sky.t('accuracy'));
    a.title = Sky.L(bank.name) + ' — ' + Sky.t('ofTotal').replace('%1', ids.length);
    box.appendChild(a);
  }
}

function renderWeak() {
  const srs = Sky.srs(), rows = [];
  for (const bank of Object.values(BANKS)) {
    for (const task of bank.tasks) {
      const rec = srs[bank.id + ':' + task.id];
      if (rec && rec.fails > 0) rows.push({ bank, task, fails: rec.fails });
    }
  }
  rows.sort((a, b) => b.fails - a.fails);

  /* Ошибок нет — блока нет: главная и так длинная. */
  const panel = $('#weakPanel');
  $('#weakSection').hidden = !rows.length;
  if (!rows.length) return;
  panel.innerHTML = '<div class="list" id="weakList"></div>';
  const box = $('#weakList');
  for (const r of rows.slice(0, 8)) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="tag no">${r.fails}</span>
      <div class="txt"><b></b><span></span></div>
      <a class="btn small ghost" href="trainer.html?subject=${r.bank.id}&mode=weak"></a>`;
    el.querySelector('b').textContent = Sky.L(r.task.topic);
    el.querySelector('span.txt span, .txt span').textContent =
      Sky.L(r.bank.name) + ' · ' + Sky.t('times').replace('%1', r.fails);
    el.querySelector('a').textContent = Sky.t('practise');
    box.appendChild(el);
  }
}

function renderAll() { renderGoals(); renderToday(); renderSubjects(); renderWeak(); }
document.addEventListener('langchange', renderAll);
document.addEventListener('authchange', renderGoals);
document.addEventListener('statschange', renderAll);
renderAll();
</script>
</body>
</html>
