<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход — SkyySchool</title>
<meta name="description" content="Вход и регистрация в SkyySchool: для учеников, учителей и родителей.">
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<!-- Вход, регистрация, восстановление пароля. Логика — assets/auth-ui.js,
     аккаунты — Supabase Auth через assets/db.js. -->
<style>
  .au-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:28px;align-items:stretch;max-width:980px;margin:8px auto 0}
  .au-aside{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:40px 36px;color:#fff;
    background:linear-gradient(150deg,var(--sky-500),var(--sky-700) 70%);display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:520px}
  .au-aside::after{content:'';position:absolute;right:-90px;bottom:-110px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.08)}
  .au-aside h2{font-size:30px;line-height:1.15;letter-spacing:-.02em;max-width:14ch;color:#fff}
  .au-perks{list-style:none;margin:0;padding:0;display:grid;gap:14px;position:relative;z-index:1}
  .au-perks li{display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:15px;line-height:1.45}
  .au-perks li::before{content:'✓';flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.18);font-weight:900;font-size:14px}
  .au-aside .logo{width:64px;height:auto}

  .au-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:30px 30px 26px;display:flex;flex-direction:column;gap:18px}
  .au-card h1{font-size:28px;margin:0}
  .au-card .lead{margin:4px 0 0;font-size:14.5px}
  .au-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
  .au-tabs button{font:inherit;font-size:14px;font-weight:800;padding:9px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;transition:.15s}
  .au-tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

  .au-form{display:grid;gap:14px}
  .au-input{position:relative;display:flex}
  .au-input input{flex:1;min-width:0}
  .au-input input[type=password],.au-input input:has(+ .au-eye){padding-right:46px}
  .au-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .au-eye:hover{background:var(--panel-2);color:var(--ink)}
  .au-field input[aria-invalid="true"]{border-color:var(--no);box-shadow:0 0 0 3px var(--no-soft)}
  .au-link{justify-self:start;font:inherit;font-size:13px;font-weight:800;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
  .au-link:hover{text-decoration:underline}
  .au-forgot{justify-self:end;margin-top:-6px}
  .au-err{margin:0;padding:10px 12px;border-radius:11px;background:var(--no-soft);color:var(--no);font-size:13px;font-weight:800;line-height:1.45}
  .au-fine{margin:0;font-size:11.5px;color:var(--faint);font-weight:600;text-align:center;line-height:1.5}

  .au-roles{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .au-roles legend{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0}
  .au-role{cursor:pointer}
  .au-role input{position:absolute;opacity:0;pointer-events:none}
  .au-role-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);text-align:center;transition:.15s;height:100%}
  .au-role-card .ico{font-size:22px;line-height:1.1}
  .au-role-card b{font-size:13.5px}
  .au-role-card small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.3}
  .au-role input:checked + .au-role-card{border-color:var(--accent);background:var(--m-learn-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .au-role input:focus-visible + .au-role-card{outline:2px solid var(--accent);outline-offset:2px}

  .au-alt{display:grid;gap:12px}
  .au-or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
  .au-or::before,.au-or::after{content:'';flex:1;height:1px;background:var(--line)}
  .au-google{gap:10px}
  .au-done{justify-items:center;text-align:center}
  .au-mail{font-size:46px;line-height:1}
  .au-me{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);text-align:left}
  .au-me b{display:block;font-size:15px}
  .au-me span{font-size:12.5px;color:var(--muted);font-weight:700;word-break:break-all}
  .au-local{margin:0;font-size:12.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-radius:11px;background:var(--panel-2);border:1px dashed var(--line-2)}

  @media (max-width:860px){
    .au-shell{grid-template-columns:minmax(0,1fr);max-width:460px}
    .au-aside{display:none}
  }
  @media (max-width:420px){
    .au-card{padding:22px 18px 20px;border-radius:var(--r-lg)}
    .au-card h1{font-size:24px}
    .au-roles{gap:6px}
    .au-role-card small{display:none}
  }
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">
  <div class="au-shell">
    <aside class="au-aside" aria-hidden="true">
      <div id="auLogo"></div>
      <h2 data-i18n="auAsideH"></h2>
      <ul class="au-perks">
        <li data-i18n="auPerk1"></li>
        <li data-i18n="auPerk2"></li>
        <li data-i18n="auPerk3"></li>
      </ul>
    </aside>

    <section class="au-card" aria-labelledby="auTitle">
      <div>
        <h1 id="auTitle"></h1>
        <p class="lead" id="auSub"></p>
      </div>
      <div class="au-tabs" id="auTabs" role="tablist">
        <button type="button" role="tab" data-go="in" data-i18n="auTabIn"></button>
        <button type="button" role="tab" data-go="up" data-i18n="auTabUp"></button>
      </div>
      <div id="auBody"></div>
      <div class="au-alt" id="auAlt" hidden>
        <div class="au-or" data-i18n="auOr"></div>
        <button type="button" class="btn ghost full au-google" id="auGoogle">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          <span data-i18n="auGoogle"></span>
        </button>
      </div>
      <p class="au-local" id="auLocal" hidden data-i18n="auLocal"></p>
    </section>
  </div>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/errors.js"></script>
<script src="assets/auth-ui.js"></script>
<script>document.getElementById('auLogo').innerHTML = Sky.logoSvg('logo');</script>
</body>
</html>
