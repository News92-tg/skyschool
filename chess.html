<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<style>
.piece.w{color:#fff;text-shadow:0 0 1px #10233c,0 0 2px rgba(0,0,0,.8),0 1px 1px rgba(0,0,0,.4)}
.piece.b{color:#141820;text-shadow:0 0 1px rgba(255,255,255,.35)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow:auto}
.tabs button{padding:12px 15px;font-size:13.5px;font-weight:900;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--m-chess);border-bottom-color:var(--m-chess)}
.lesson{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden;box-shadow:var(--shadow-sm)}
.lesson > button{width:100%;text-align:left;padding:16px 19px;font-weight:800;font-size:14.5px;display:flex;gap:10px;align-items:center}
.lesson > button .arrow{margin-left:auto;color:var(--muted);transition:.2s;font-size:19px}
.lesson.open > button .arrow{transform:rotate(90deg);color:var(--m-chess)}
.lesson .body{padding:0 19px 19px;font-size:14px;white-space:pre-wrap;line-height:1.78;color:var(--ink-2)}
.lesson .board{width:min(290px,100%);margin-top:16px}
.promo{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.promo button{width:46px;height:46px;font-size:27px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.promo button:hover{border-color:var(--m-chess)}
.gameinfo{font-size:13.5px;font-weight:800;min-height:22px}
.code{
  font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;letter-spacing:.18em;
  text-align:center;padding:14px;background:var(--m-chess-soft);
  border:2px dashed var(--m-chess);border-radius:var(--r);color:var(--m-chess);
}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>

    <button type="button" data-tab="teacher" aria-selected="false" data-i18n="tabTeacher"></button>
    <button type="button" data-tab="live"    aria-selected="false" data-i18n="tabLive"></button>
  </div>

  <!-- УРОКИ -->

  <!-- ЗАДАЧИ -->

      <div class="side">
        <div class="meta">
          <span class="tag chess" id="pType"></span>
          <span class="tag gray" id="pCount"></span>
          <span class="tag gray" id="pTurn"></span>
        </div>
        <h2 id="pTitle" style="margin-top:10px"></h2>
        <p class="lead" style="font-size:13px;margin-top:4px" id="pTask"></p>
        <div class="note hidden" id="pIdea"></div>
        <div class="gameinfo" id="pMsg" style="margin-top:12px"></div>
        <div class="promo hidden" id="pPromo"></div>
        <div class="actions">

        </div>

    </div>

  <!-- ИГРА С БОТОМ -->

const $ = s => document.querySelector(s);
const esc = Sky.auth.esc;
const GLYPH = { 1:'♟', 2:'♞', 3:'♝', 4:'♜', 5:'♛', 6:'♚' };

/* ============ доска ============ */
function makeBoard(el, opts) {
  const api = { flipped:false, state:null, selected:-1, lastMove:null, onMove:opts.onMove, interactive:true, canMove:() => true };

  function squares() {
    const list = [];
    for (let r = 7; r >= 0; r--) for (let f = 0; f < 8; f++) list.push(E.sq(f, r));
    return api.flipped ? list.reverse() : list;
  }

  api.render = function () {
    const st = api.state; if (!st) return;
    el.innerHTML = '';
    const legal = (api.selected >= 0) ? E.generate(st, { square: api.selected }) : [];
    const targets = new Map(legal.map(m => [m.to, m]));
    const kingSq = E.inCheck(st) ? st.kings[st.turn] : -1;

    for (const s of squares()) {
      const f = E.fileOf(s), r = E.rankOf(s);
      const d = document.createElement('div');
      d.className = 'sqr ' + ((f + r) % 2 ? 'light' : 'dark');
      d.dataset.sq = s;
      if (s === api.selected) d.classList.add('sel');
      else if (api.lastMove && (s === api.lastMove.from || s === api.lastMove.to)) d.classList.add('last');
      if (s === kingSq) d.classList.add('check');

      const p = st.board[s];
      if (p) {
        const sp = document.createElement('span');
        sp.className = 'piece ' + ((p & 8) ? 'b' : 'w');
        sp.textContent = GLYPH[p & 7];
        d.appendChild(sp);
      }
      if (targets.has(s)) {
        if (p) d.classList.add('cap');
        const dot = document.createElement('span'); dot.className = 'dot';
        d.appendChild(dot);
      }
      const edgeFile = api.flipped ? (r === 7) : (r === 0);
      const edgeRank = api.flipped ? (f === 7) : (f === 0);
      if (edgeFile) { const c = document.createElement('span'); c.className = 'co f'; c.textContent = 'abcdefgh'[f]; d.appendChild(c); }
      if (edgeRank) { const c = document.createElement('span'); c.className = 'co r'; c.textContent = r + 1; d.appendChild(c); }
      el.appendChild(d);
    }
  };

  el.addEventListener('click', e => {
    if (!api.interactive || !api.state || !api.canMove()) return;
    const cell = e.target.closest('.sqr'); if (!cell) return;
    const s = +cell.dataset.sq, st = api.state;
    if (api.selected >= 0) {
      const moves = E.generate(st, { square: api.selected }).filter(m => m.to === s);
      if (moves.length) { api.selected = -1; api.onMove(moves); return; }
    }
    const p = st.board[s];
    api.selected = (p && (p & 8) === st.turn) ? s : -1;
    api.render();
  });

  const ANIM_MS = 200;

  api.animateMove = function (move, done) {
    const finish = (() => {
      let called = false;
      return () => { if (!called) { called = true; done(); } };
    })();

    if (prefersReduced()) return finish();

    const fromCell = el.querySelector(`[data-sq="${move.from}"]`);
    const toCell   = el.querySelector(`[data-sq="${move.to}"]`);
    const piece    = fromCell && fromCell.querySelector('.piece');
    if (!fromCell || !toCell || !piece) return finish();

    const a = fromCell.getBoundingClientRect();
    const b = toCell.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if (!dx && !dy) return finish();

    let victimSq = move.to;
    if (String(move.flags || '').includes('e')) {
      victimSq = (move.piece & 8) ? move.to + 16 : move.to - 16;
    }
    const victim = el.querySelector(`[data-sq="${victimSq}"] .piece`);
    if (move.captured && victim && victim !== piece) victim.classList.add('taken');

    piece.style.transition = 'none';
    piece.style.transform = '';
    fromCell.classList.add('flying');
    piece.classList.add('moving');

    requestAnimationFrame(() => {
      piece.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.2,.85,.3,1)`;
      piece.style.transform = `translate(${dx}px, ${dy}px)`;
    });

    let timer = setTimeout(finish, ANIM_MS + 80);
    piece.addEventListener('transitionend', function onEnd() {
      clearTimeout(timer);
      piece.style.transition = '';
      piece.style.transform = '';
      piece.classList.remove('moving');
      fromCell.classList.remove('flying');
      finish();
    }, { once: true });
  };

  return api;
}

function prefersReduced() {
  return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function askPromotion(host, cb) {
  host.classList.remove('hidden');
  host.innerHTML = '';
  const label = document.createElement('div');

  }
}

const PUZZLES = window.CHESS_PUZZLES;
let pIndex = 0, pState = null, pSolved = Sky.get('puzzlesSolved', []);
const puzzleBoard = makeBoard($('#pBoard'), { onMove: onPuzzleMove });

function loadPuzzle(i) {
  pIndex = (i + PUZZLES.length) % PUZZLES.length;
  const p = PUZZLES[pIndex];
  pState = E.create(p.fen);
  Object.assign(puzzleBoard, { state:pState, selected:-1, lastMove:null, interactive:true, flipped:pState.turn === E.BLACK });
  puzzleBoard.render();

  const typeKey = p.type === 'mate1' ? 'tMate1' : p.type === 'defence' ? 'tDefence' : 'tTactic';
  $('#pType').textContent = Sky.t(typeKey);
  $('#pCount').textContent = Sky.t('pCountOf').replace('%1', pIndex + 1).replace('%2', PUZZLES.length);
  $('#pTurn').textContent = Sky.t(pState.turn === E.WHITE ? 'whiteMove' : 'blackMove');
  $('#pTitle').textContent = Sky.L(p.title);
  $('#pTask').textContent = Sky.t('findMove').replace('%1', Sky.t(pState.turn === E.WHITE ? 'white' : 'black'));
  $('#pIdea').textContent = Sky.L(p.idea);
  $('#pIdea').classList.add('hidden');
  $('#pMsg').textContent = '';
  $('#pMsg').className = 'gameinfo';
  $('#pPromo').classList.add('hidden');
  $('#pSolved').textContent = pSolved.length;
  $('#pTotal').textContent = PUZZLES.length;
}

function onPuzzleMove(moves) {
  const apply = m => {
    const san = E.toSAN(pState, m);
    const p = PUZZLES[pIndex];
    const clean = s => s.replace(/[+#]/g, '');
    const ok = p.solutions.some(s => clean(s) === clean(san));
    const msg = $('#pMsg');
    if (ok) {
      puzzleBoard.interactive = false;
      puzzleBoard.animateMove(m, () => {
        E.make(pState, m);
        puzzleBoard.lastMove = m;
        puzzleBoard.render();
      });
      msg.textContent = '✓ ' + Sky.t('right') + '  ' + san;
      msg.className = 'gameinfo verdict ok';
      $('#pIdea').classList.remove('hidden');
      if (!pSolved.includes(p.id)) { pSolved.push(p.id); Sky.set('puzzlesSolved', pSolved); }
      $('#pSolved').textContent = pSolved.length;
    } else {
      msg.textContent = '✕ ' + Sky.t('wrongMove') + '  (' + san + ')';
      msg.className = 'gameinfo verdict no';
      puzzleBoard.render();
    }
  };
  if (moves.length > 1 && moves[0].promotion)
    askPromotion($('#pPromo'), t => apply(moves.find(m => m.promotion === t)));
  else apply(moves[0]);
}
$('#pHint').addEventListener('click', () => $('#pIdea').classList.remove('hidden'));
$('#pRetry').addEventListener('click', () => loadPuzzle(pIndex));
$('#pNext').addEventListener('click', () => loadPuzzle(pIndex + 1));

/* ============ игра с ботом ============ */
let gState = null, gHuman = E.WHITE, gLevel = 2, gBusy = false, gSans = [], gCap = { w:[], b:[] }, gKeys = [];
const gameBoard = makeBoard($('#gBoard'), { onMove: onHumanMove });

function positionKey(st) {
  if (E.positionKey) return E.positionKey(st);
  return E.fen(st).split(' ').slice(0, 4).join(' ');
}

function newGame() {
  gState = E.create();
  gHuman = ($('#gSide').value === 'b') ? E.BLACK : E.WHITE;
  gLevel = +$('#gLevel').value;
  gSans = []; gCap = { w:[], b:[] }; gBusy = false;
  gKeys = [positionKey(gState)];
  Object.assign(gameBoard, { state:gState, selected:-1, lastMove:null, flipped:gHuman === E.BLACK, interactive:true });
  $('#gPromo').classList.add('hidden');
  renderGame();
  if (gState.turn !== gHuman) setTimeout(botMove, 250);
}

function renderGame() {
  gameBoard.render();
  const rows = [];
  for (let i = 0; i < gSans.length; i += 2)
    rows.push(`<b>${i / 2 + 1}.</b> <span>${gSans[i]}</span>` + (gSans[i + 1] ? `<span>${gSans[i + 1]}</span>` : ''));
  const ml = $('#gMoves');
  ml.innerHTML = rows.join('<br>');
  ml.scrollTop = ml.scrollHeight;

  $('#gCapTop').textContent = (gHuman === E.WHITE ? gCap.w : gCap.b).join(' ');
  $('#gCapBottom').textContent = (gHuman === E.WHITE ? gCap.b : gCap.w).join(' ');

  const st = E.status(gState);
  const info = $('#gStatus');
  info.className = 'gameinfo';
  if (st === 'checkmate') {
    const won = (gState.turn !== gHuman);
    info.textContent = won ? Sky.t('youWin') : Sky.t('youLose');
    info.className = 'gameinfo verdict ' + (won ? 'ok' : 'no');
    gameBoard.interactive = false;
  } else if (st === 'stalemate') { info.textContent = Sky.t('stalemate'); gameBoard.interactive = false; }
  else if (st === 'material')    { info.textContent = Sky.t('drawMat'); gameBoard.interactive = false; }
  else if (st === 'fifty')       { info.textContent = Sky.t('drawFifty'); gameBoard.interactive = false; }
  else if (gBusy)                { info.innerHTML = `<span class="spin"></span> ${Sky.t('botThinks')}`; }
  else info.textContent = (st === 'check' ? Sky.t('checkMsg') + ' ' : '') +
        (gState.turn === gHuman ? Sky.t('yourMove') : Sky.t('botThinks'));
}

function checkRepetition() {
  const last = gKeys[gKeys.length - 1];
  let count = 0;
  for (const k of gKeys) if (k === last) count++;
  return count >= 3;
}

function pushMove(m) {
  const san = E.toSAN(gState, m);
  if (m.captured) gCap[(m.captured & 8) ? 'b' : 'w'].push(GLYPH[m.captured & 7]);
  E.make(gState, m);
  gSans.push(san);
  gKeys.push(positionKey(gState));
  gameBoard.lastMove = m;
}

function onHumanMove(moves) {
  if (gBusy || gState.turn !== gHuman) return;
  const go = m => {
    gBusy = true;
    const fenBefore = E.fen(gState);
    const sanPlayed = E.toSAN(gState, m);
    gameBoard.animateMove(m, () => {
      pushMove(m);
      gBusy = false;
      renderGame();
      reviewMove(fenBefore, sanPlayed, gSans.length - 1);
      const st = E.status(gState);
      if (checkRepetition()) { finishGame('repetition'); return; }
      if (st === 'play' || st === 'check') { gBusy = true; renderGame(); setTimeout(botMove, 90); }
      else finishGame(st);
    });
  };
  if (moves.length > 1 && moves[0].promotion)
    askPromotion($('#gPromo'), t => go(moves.find(m => m.promotion === t)));
  else go(moves[0]);
}

/* ---------- разбор хода ученика ---------- */
const gReviews = {};

function reviewMove(fenBefore, san, ply) {
  if (!window.ChessReview) return;
  setTimeout(async () => {
    let r;
    try { r = ChessReview.review(fenBefore, san); } catch (e) { r = null; }
    if (!r) return;
    gReviews[ply] = r;
    renderReview(r, null);

    const words = await ChessReview.explainWords(r, { lang: Sky.lang });
    if (words && gReviews[ply] && ply === gSans.length - (gState.turn === gHuman ? 2 : 1)) {
      renderReview(r, words);
    }
  }, 0);
}

function renderReview(r, words) {
  const box = $('#gReview');
  const mark = ChessReview.MARKS[r.quality] || ChessReview.MARKS.good;
  const title = Sky.t('q' + r.quality[0].toUpperCase() + r.quality.slice(1));
  const note = ChessReview.shortNote(r, Sky.lang);
  const clean = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  const teacherHtml = window.ChessTeacherUI ? ChessTeacherUI.renderFor(r.quality) : '';

  box.className = 'review ' + mark.cls;
  box.innerHTML =
    teacherHtml +
    '<div class="rv-head"><span class="rv-icon">' + mark.icon + '</span>' +
      '<b>' + r.move + ' — ' + title + '</b></div>' +
    '<div class="rv-note">' + clean(note) + '</div>' +
    (words ? '<div class="rv-words">' + clean(words) + '</div>' : '') +
    '<div class="rv-by">' + Sky.t('revEngine') + '</div>';
  box.classList.remove('hidden');
}

function botMove() {
  const res = AI.bestMove(gState, gLevel);
  if (!res) { gBusy = false; renderGame(); return; }
  gameBoard.animateMove(res.move, () => {
    pushMove(res.move);
    gBusy = false;
    renderGame();
    const st = E.status(gState);
    if (checkRepetition()) { finishGame('repetition'); return; }
    if (st !== 'play' && st !== 'check') finishGame(st);
  });
}

function finishGame(status) {
  const humanWon = status === 'checkmate' && gState.turn !== gHuman;
  const humanLost = status === 'checkmate' && gState.turn === gHuman;

  const kind = humanWon ? 'win' : humanLost ? 'lose' : 'draw';
  const mark = humanWon ? '✓' : humanLost ? '✕' : '=';
  const title = Sky.t(humanWon ? 'ovWin' : humanLost ? 'ovLose' : 'ovDraw');
  const whyKey = {
    checkmate: humanWon ? 'whyMateWin' : 'whyMateLose',
    stalemate: 'whyStale', material: 'whyMaterial', fifty: 'whyFifty', repetition: 'whyRepeat'
  }[status] || 'whyStale';
  const why = Sky.t(whyKey);

  const moves = Math.ceil(gSans.length / 2);
  const movesWord = Sky.lang === 'ru'
    ? Sky.plural(moves, 'ход', 'хода', 'ходов').replace(moves + ' ', '')
    : Sky.t('ovMoves');
  const taken = gCap[gHuman === E.WHITE ? 'b' : 'w'].length;
  const lost  = gCap[gHuman === E.WHITE ? 'w' : 'b'].length;

  setTimeout(() => {
    Sky.modal(
      `<div class="gameover">
         <div class="mark ${kind}">${mark}</div>
         <h2>${title}</h2>
         <p class="why">${why}</p>
         <div class="facts">
           <div><b>${moves}</b><span>${movesWord}</span></div>
           <div><b>${taken}</b><span>${Sky.t('ovTaken')}</span></div>
           <div><b>${lost}</b><span>${Sky.t('ovLost')}</span></div>
         </div>
       </div>
       <button class="btn chess full big" id="ovNew" style="margin-top:18px">${Sky.t('newGame')}</button>
       <button class="btn ghost full" id="ovClose" style="margin-top:9px">${Sky.t('ovLook')}</button>`,
      (box, close) => {
        box.querySelector('#ovNew').addEventListener('click', () => { close(); newGame(); });
        box.querySelector('#ovClose').addEventListener('click', close);
      }
    );
  }, 380);
}

$('#gNew').addEventListener('click', newGame);
$('#gUndo').addEventListener('click', () => {
  if (gBusy) return;
  for (let i = 0; i < 2 && gState.history.length; i++) {
    const m = E.unmake(gState);
    gSans.pop();
    if (gKeys.length > 1) gKeys.pop();
    if (m && m.captured) gCap[(m.captured & 8) ? 'b' : 'w'].pop();
  }
  Object.assign(gameBoard, { lastMove:null, selected:-1, interactive:true });
  renderGame();
});
$('#gFlip').addEventListener('click', () => { gameBoard.flipped = !gameBoard.flipped; gameBoard.render(); });

let tTasks = [], tPeople = [], tLinks = [];

async function loadTeacherTasks() {
  const me = Sky.db.me();
  const gate = $('#tGate'), body = $('#tBody');
  if (!me) {
    body.classList.add('hidden');
    gate.innerHTML = `<div class="panel"><div class="empty"><div class="big">🔐</div>
      <b>${Sky.t('tSignIn')}</b><p>${Sky.t('tSignInD')}</p>
      <div class="actions" style="justify-content:center"><button class="btn chess" id="tIn">${Sky.t('signIn')}</button></div>
      </div></div>`;
    $('#tIn').addEventListener('click', () => Sky.auth.openAuth());
    return;
  }
  gate.innerHTML = '';
  body.classList.remove('hidden');

  const isT = me.role === 'teacher';
  tPeople = await Sky.db.list('profiles');
  tLinks = await Sky.db.list('links');
  tTasks = await Sky.db.list('chess_tasks', isT ? { teacher_id: me.id } : { student_id: me.id });

  $('#tTitle').textContent = Sky.t(isT ? 'tTitleT' : 'tTitleS');
  $('#tNew').classList.toggle('hidden', !isT);

  const list = $('#tList');
  if (!tTasks.length) {
    list.innerHTML = `<div class="panel"><div class="empty"><div class="big">♟</div>
      <p>${Sky.t(isT ? 'tNoneT' : 'tNoneS')}</p></div></div>`;
    return;
  }

  list.innerHTML = '';
  tTasks.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).forEach(task => {
    const other = tPeople.find(p => p.id === (isT ? task.student_id : task.teacher_id)) || { name:'—' };
    const tag = task.result === 'ok' ? `<span class="tag ok">${Sky.t('tSolved')}</span>`
      : task.result === 'fail' ? `<span class="tag no">${Sky.t('tFailed')}</span>`
      : `<span class="tag gray">${Sky.t('tWaiting')}</span>`;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `${Sky.avatar(other.name, 'sm', other.emoji)}
      <div class="txt"><b>${esc(task.note || Sky.t('tYourMove'))}</b>
        <span>${esc(other.name)}${task.answer ? ' · ' + esc(task.answer) : ''}</span></div>
      ${tag}`;
    const b = document.createElement('button');
    b.className = 'btn small ghost';
    b.textContent = Sky.t('tOpen');
    b.addEventListener('click', () => openChessTask(task, isT));
    el.appendChild(b);
    list.appendChild(el);
  });
}

$('#tNew').addEventListener('click', () => {
  const me = Sky.db.me();
  const students = tLinks.filter(l => l.teacher_id === me.id);
  if (!students.length) {
    Sky.toast(Sky.lang === 'ru' ? 'Сначала нужен хотя бы один ученик' : 'You need at least one student first');
    return;
  }
  Sky.modal(
    `<h2>${Sky.t('newChessTask')}</h2>
     <div class="field" style="margin:16px 0 12px">
       <label>${Sky.t('tTo')}</label>
       <select id="cTo">${students.map(l => {

       }).join('')}</select>
     </div>
     <div class="field" style="margin-bottom:12px">

       <input type="text" id="cFen" value="${E.START_FEN}" style="font-family:'JetBrains Mono',monospace;font-size:12px">
       <span class="help">${Sky.t('tFenHelp')}</span>
     </div>
     <div class="field" style="margin-bottom:12px">

          return Sky.toast(Sky.t('tBadFen'));

          note: box.querySelector('#cNote').value.trim(),

function openChessTask(task, isTeacher) {
  Sky.modal(
    `<h2>${esc(task.note || Sky.t('tYourMove'))}</h2>
     <div class="board" id="ctBoard" style="margin:16px 0"></div>
     <div class="gameinfo" id="ctMsg"></div>
     <div class="promo hidden" id="ctPromo"></div>`,
    (box) => {
      const st = E.create(task.fen);
      const api = makeBoard(box.querySelector('#ctBoard'), { onMove });
      api.state = st;
      api.flipped = st.turn === E.BLACK;
      api.interactive = !isTeacher && !task.result;
      api.render();

      const msg = box.querySelector('#ctMsg');
      if (task.result === 'ok') { msg.className = 'gameinfo verdict ok'; msg.textContent = Sky.t('tCorrect').replace('%1', task.answer || ''); }
      else if (task.result === 'fail') { msg.className = 'gameinfo verdict no'; msg.textContent = Sky.t('tWrong').replace('%1', task.answer || ''); }
      else if (isTeacher) msg.textContent = Sky.t('tWaiting');

      function onMove(moves) {
        const apply = async m => {
          const san = E.toSAN(st, m);
          const clean = s => s.replace(/[+#]/g, '');
          const ok = (task.solutions || []).some(s => clean(s) === clean(san));
          api.interactive = false;
          api.animateMove(m, () => { E.make(st, m); api.lastMove = m; api.render(); });
          msg.className = 'gameinfo verdict ' + (ok ? 'ok' : 'no');
          msg.textContent = ok ? Sky.t('tCorrect').replace('%1', san) : Sky.t('tWrong').replace('%1', san);
          await Sky.db.update('chess_tasks', task.id, { result: ok ? 'ok' : 'fail', answer: san });
          loadTeacherTasks();
        };
        if (moves.length > 1 && moves[0].promotion)
          askPromotion(box.querySelector('#ctPromo'), t => apply(moves.find(m => m.promotion === t)));
        else apply(moves[0]);
      }
    }
  );
}

function makeCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += abc[Math.floor(Math.random() * abc.length)];
  return s;
}

  const game = await Sky.db.insert('chess_games', {
    code: makeCode(), white_id: me.id, black_id: null,
    fen: E.START_FEN, moves: [], status: 'play'
  });
  enterLive(game, E.WHITE);
});

$('#lvJoin').addEventListener('click', async () => {
  const me = Sky.db.me();
  if (!me) return Sky.auth.openAuth();
  const code = $('#lvCode').value.trim().toUpperCase();
  if (!code) return;
  const rows = await Sky.db.list('chess_games', { code });
  const game = rows[0];
  if (!game) return Sky.toast(Sky.t('noGame'));

  if (!game.black_id && (game.white_id !== me.id || !Sky.db.isCloud())) {
    const updated = await Sky.db.update('chess_games', game.id, { black_id: me.id });
    return enterLive(updated || Object.assign(game, { black_id: me.id }), E.BLACK);
  }
  if (game.white_id === me.id) return enterLive(game, E.WHITE);
  if (game.black_id === me.id) return enterLive(game, E.BLACK);
  Sky.toast(Sky.t('gameFull'));
});

function enterLive(game, side) {
  liveGame = game;
  liveSide = side;
  liveState = E.create(game.fen);
  liveBoard.state = liveState;
  liveBoard.selected = -1;
  liveBoard.lastMove = null;
  liveBoard.flipped = (side === E.BLACK);
  liveBoard.interactive = true;
  $('#liveSetup').classList.add('hidden');
  $('#liveGame').classList.remove('hidden');
  $('#lvCodeShow').textContent = game.code;
  renderLive();

  if (liveUnsub) liveUnsub();
  liveUnsub = Sky.db.subscribe('chess_games', async () => {
    const rows = await Sky.db.list('chess_games', { code: liveGame.code });
    const fresh = rows[0];
    if (!fresh) return;
    if (fresh.fen === liveGame.fen && fresh.black_id === liveGame.black_id) return;
    liveGame = fresh;
    liveState = E.create(fresh.fen);
    liveBoard.state = liveState;
    liveBoard.selected = -1;
    renderLive();
  });
}

function renderLive() {
  liveBoard.render();
  const info = $('#lvStatus');
  info.className = 'gameinfo';
  const mySide = liveSide;
  const sideText = Sky.t(mySide === E.WHITE ? 'youWhite' : 'youBlack');

  const rows = [];
  const sans = liveGame.moves || [];
  for (let i = 0; i < sans.length; i += 2)
    rows.push(`<b>${i / 2 + 1}.</b> <span>${sans[i]}</span>` + (sans[i + 1] ? `<span>${sans[i + 1]}</span>` : ''));
  $('#lvMoves').innerHTML = rows.join('<br>');

  if (!liveGame.black_id) { info.textContent = Sky.t('waitJoin'); return; }

  const st = E.status(liveState);
  if (st === 'checkmate') {
    const won = liveState.turn !== mySide;
    info.textContent = won ? Sky.t('youWin') : Sky.t('youLose');
    info.className = 'gameinfo verdict ' + (won ? 'ok' : 'no');
  } else if (st === 'stalemate') info.textContent = Sky.t('stalemate');
  else if (st === 'material')    info.textContent = Sky.t('drawMat');
  else if (st === 'fifty')       info.textContent = Sky.t('drawFifty');
  else info.textContent = sideText + ' · ' + (st === 'check' ? Sky.t('checkMsg') + ' ' : '') +
        (liveState.turn === mySide ? Sky.t('yourMove') : Sky.t('waitOpp'));
}

function onLiveMove(moves) {
  const apply = m => liveBoard.animateMove(m, async () => {
    const san = E.toSAN(liveState, m);
    E.make(liveState, m);
    liveBoard.lastMove = m;
    const moveList = (liveGame.moves || []).concat([san]);
    const fen = E.fen(liveState);
    liveGame = Object.assign({}, liveGame, { fen, moves: moveList });
    renderLive();
    await Sky.db.update('chess_games', liveGame.id, {
      fen, moves: moveList, status: E.status(liveState), updated_at: new Date().toISOString()
    });
  });
  if (moves.length > 1 && moves[0].promotion)
    askPromotion($('#lvPromo'), t => apply(moves.find(m => m.promotion === t)));
  else apply(moves[0]);
}

$('#lvFlip').addEventListener('click', () => { liveBoard.flipped = !liveBoard.flipped; liveBoard.render(); });
$('#lvLeave').addEventListener('click', () => {
  if (liveUnsub) { liveUnsub(); liveUnsub = null; }
  liveGame = null; liveState = null;
  $('#liveGame').classList.add('hidden');
  $('#liveSetup').classList.remove('hidden');
});

/* ============ старт ============ */
function renderTeacherPicker() {
  if (window.ChessTeacherUI) ChessTeacherUI.renderPicker('#chessTeacherPicker');
}

document.addEventListener('langchange', () => {
  renderLessons();
  if (pState) loadPuzzle(pIndex);
  if (gState) renderGame();
  renderLiveNote();
  loadTeacherTasks();
  renderTeacherPicker();
});
document.addEventListener('authchange', () => { loadTeacherTasks(); });

renderLessons();
loadPuzzle(0);
newGame();
renderLiveNote();
renderTeacherPicker();
Sky.db.ready.then(loadTeacherTasks);
</script>
