<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Учителя — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<style>
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

.tcard{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:17px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;
}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tcard.picked{border-color:var(--accent);box-shadow:0 0 0 3px var(--m-learn-soft)}

.tcard .top{display:flex;gap:12px;align-items:flex-start}
.tcard .ava{
  width:50px;height:50px;border-radius:15px;flex:none;display:grid;place-items:center;
  font-size:25px;background:var(--m-learn-soft);
}
.tcard h3{font-size:16px;font-weight:900;line-height:1.25}
.tcard .role{font-size:11.5px;color:var(--muted);font-weight:800;margin-top:2px}
.tcard .style{font-size:13px;line-height:1.55;color:var(--ink);flex:1}

.tmeta{display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--muted);font-weight:700}
.tmeta .line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.strict{font-family:'JetBrains Mono',monospace;letter-spacing:1px;color:var(--accent)}
.stars{color:var(--warn);letter-spacing:1px}
.stars .none{color:var(--muted);letter-spacing:0;font-family:inherit}

.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag-goal{
  font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
}

.tcard .actions{display:flex;gap:8px;margin-top:2px}
.tcard .actions .btn{flex:1}

.current{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.current .ava{
  width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;
  font-size:28px;background:var(--m-learn-soft);
}
.current .who{flex:1;min-width:190px}
.current .who b{font-size:17px;display:block}
.current .who span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.5}

.rate-row{display:flex;gap:6px;justify-content:center;margin:8px 0 14px}
.rate-row button{
  font-size:29px;line-height:1;background:none;border:none;cursor:pointer;
  color:var(--line);transition:color .12s,transform .12s;padding:2px;
}
.rate-row button:hover,.rate-row button.on{color:var(--warn);transform:scale(1.12)}

.empty-filter{
  text-align:center;padding:34px 16px;color:var(--muted);font-size:13.5px;
  border:1.5px dashed var(--line);border-radius:var(--r);
}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>

  <!-- выбранный сейчас -->
  <div class="section">
    <div class="panel current" id="currentBlock"></div>
  </div>

  <!-- топ-3 по рейтингу -->
  <div class="section hidden" id="topSection">
    <div class="section-head">
      <h2 data-i18n="topTitle"></h2>
      <span class="lead" style="font-size:12px" data-i18n="topNote"></span>
    </div>
    <div class="top3" id="topList"></div>
  </div>

  <!-- доступ к премиум-учителям -->
  <div class="section hidden" id="premiumSection">
    <div class="panel premium-box" id="premiumBox"></div>
  </div>

  <!-- каталог -->
  <div class="section">
    <div class="section-head">
      <h2 data-i18n="catalog"></h2>
      <span class="lead" style="font-size:12px" id="foundNote"></span>
    </div>

    <div class="filters">
      <div class="field" id="subjField" hidden>
        <label data-i18n="fSubject"></label>
        <select id="fSubj"></select>
      </div>
      <div class="field">
        <label data-i18n="fGoal"></label>
        <select id="fGoal"></select>
      </div>
      <div class="field">
        <label data-i18n="fStyle"></label>
        <select id="fStyle"></select>
      </div>
      <div class="field">
        <label data-i18n="fLang"></label>
        <select id="fLang"></select>
      </div>
    </div>

    <div class="tgrid" id="tList"></div>
  </div>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="data/ai-teachers.js"></script>
<script src="assets/ai-teachers.js"></script>
<script>
'use strict';
Sky.init({
  h1:{ru:'Учителя',en:'Teachers'},
  lead:{ru:'Учитель задаёт не то, ЧТО вам объяснят, а КАК. Один и тот же разбор Сократ выстроит вопросами, а Строгий Пётр — списком того, за что снимут балл. Выбирайте под задачу и меняйте когда угодно.',
        en:'A teacher decides not WHAT you are told but HOW. Socrates builds the same explanation out of questions; Strict Peter turns it into a list of what would cost you marks. Pick one for the job and change it whenever you like.'},
  catalog:{ru:'Кого выбрать',en:'Who to pick'},

  fSubject:{ru:'Предмет',en:'Subject'},
  fGoal:{ru:'Цель',en:'Goal'},
  fStyle:{ru:'Стиль',en:'Style'},
  fLang:{ru:'Язык ответа',en:'Answer language'},
  fAny:{ru:'Любая',en:'Any'},
  fAnyM:{ru:'Любой',en:'Any'},

  goalEge:{ru:'ЕГЭ',en:'Final exam'},
  goalOge:{ru:'ОГЭ',en:'Mid exam'},
  goalImprove:{ru:'Подтянуть',en:'Catch up'},
  goalSelf:{ru:'Для себя',en:'For myself'},
  goalOlympiad:{ru:'Олимпиады',en:'Olympiads'},

  rolePhilosopher:{ru:'Философ',en:'Philosopher'},
  roleExaminer:{ru:'Экзаменатор',en:'Examiner'},
  roleFriend:{ru:'Друг',en:'Friend'},
  roleScientist:{ru:'Учёный',en:'Scientist'},
  roleCoach:{ru:'Коуч',en:'Coach'},
  roleKid:{ru:'Для малышей',en:'For little ones'},

  universal:{ru:'все предметы',en:'all subjects'},
  strictL:{ru:'Строгость',en:'Strictness'},
  ratingL:{ru:'Оценка',en:'Rating'},
  noRating:{ru:'пока нет оценок',en:'no ratings yet'},
  ratingN:{ru:'%1 (%2)',en:'%1 (%2)'},

  pick:{ru:'Выбрать',en:'Choose'},
  picked:{ru:'Ваш учитель',en:'Your teacher'},
  rateBtn:{ru:'Оценить',en:'Rate'},
  yourTeacher:{ru:'Сейчас с вами',en:'Working with you'},
  changeHint:{ru:'Разборы в тренажёре пишет он. Поменять можно в любой момент — прогресс не пострадает.',
              en:'Explanations in the trainer come from them. Change any time — your progress is unaffected.'},

  rateTitle:{ru:'Как вам %1?',en:'How is %1?'},
  rateComment:{ru:'Что понравилось или нет (необязательно)',en:'What worked or did not (optional)'},
  rateSave:{ru:'Отправить',en:'Send'},
  rateThanks:{ru:'Спасибо, оценка учтена',en:'Thanks, your rating counted'},
  teachRateLocal:{ru:'Оценки учителей хранятся в общей базе — работает только при подключённом Supabase.',
                  en:'Teacher ratings live in the shared database — this needs Supabase connected.'},
  teachRateAuth:{ru:'Чтобы оценить учителя, войдите в аккаунт.',en:'Sign in to rate a teacher.'},

  topTitle:{ru:'Топ-3 по оценкам',en:'Top 3 by rating'},
  topNote:{ru:'в топ попадают учителя от 3 отзывов — по одному судить рано',
           en:'teachers enter the top from 3 reviews — one is too few to judge'},
  topPlace:{ru:'%1 место',en:'#%1'},
  topStars:{ru:'%1 из 5 · %2',en:'%1 out of 5 · %2'},
  reviewsPl:{ru:'отзыв',en:'review'},
  reviewsPl2:{ru:'отзыва',en:'reviews'},
  reviewsPl5:{ru:'отзывов',en:'reviews'},

  premTitle:{ru:'Премиум-учителя',en:'Premium teachers'},
  premLockedText:{ru:'Откроются, когда ты решишь %1 и оставишь %2. Отзывы нужны не для галочки: без них рейтингу учителей не на чем держаться.',
                  en:'They unlock once you solve %1 and leave %2. Reviews are not a formality: without them the teacher ratings have nothing to stand on.'},
  premOpenText:{ru:'Открыты. Спасибо за отзывы — именно на них держится рейтинг, который видят остальные.',
                en:'Unlocked. Thank you for the reviews — they are what the rating everyone sees is built on.'},
  premSolvedN:{ru:'%1 заданий',en:'%1 problems'},
  premReviewsN:{ru:'%1 отзыва',en:'%1 reviews'},
  premLeft:{ru:'решено %1 из %2 · отзывов %3 из %4',en:'solved %1 of %2 · reviews %3 of %4'},
  premLockedBtn:{ru:'Ещё закрыт',en:'Locked'},
  premBadge:{ru:'премиум',en:'premium'},

  rateLesson:{ru:'Оценка за конкретный разбор, а не «вообще». Если этот учитель уже объяснял тебе что-то ещё — оценивай каждый разбор отдельно.',
              en:'This rates one specific explanation, not the teacher "in general". If they have explained something else to you, rate each explanation separately.'},
  rateOffline:{ru:'Отзыв сохранён на этом устройстве. Когда войдёшь в аккаунт, он уйдёт в общий рейтинг.',
               en:'Your review is saved on this device. It will join the shared rating once you sign in.'},

  foundN:{ru:'подходит: %1',en:'matching: %1'},
  emptyFilter:{ru:'Под такие условия никто не подходит. Снимите часть фильтров.',
               en:'Nobody matches these filters. Try removing some.'}
});

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GOALS = ['ege','oge','improve','self','olympiad'];
const ROLES = ['philosopher','examiner','friend','scientist','coach','kid'];
const goalLabel = g => Sky.t('goal' + g[0].toUpperCase() + g.slice(1));
const roleLabel = r => Sky.t('role' + r[0].toUpperCase() + r.slice(1));

let TEACHERS = [];
let RATINGS = {};

/* ---------- фильтры ----------
   Предмет заполняется из самих учителей, а не из списка предметов
   платформы: все шесть базовых универсальны, и выпадающий список с
   одним пунктом «любой» — это элемент управления, который ничего не
   делает. Поэтому пока среди учителей нет ни одного предметного,
   фильтр просто скрыт; он появится, как только появится предметный. */
function fillFilters() {
  const subjects = [...new Set(TEACHERS.map(t => t.subject).filter(Boolean))];
  $('#subjField').hidden = subjects.length === 0;
  fillSelect($('#fSubj'), [['all', Sky.t('fAnyM')]].concat(subjects.map(s => [s, s])));

  fillSelect($('#fGoal'),  [['all', Sky.t('fAny')]].concat(GOALS.map(g => [g, goalLabel(g)])));
  fillSelect($('#fStyle'), [['all', Sky.t('fAnyM')]].concat(ROLES.map(r => [r, roleLabel(r)])));

  const langs = [...new Set(TEACHERS.flatMap(t => t.languages || []))];
  fillSelect($('#fLang'), [['all', Sky.t('fAnyM')]].concat(langs.map(l => [l, l.toUpperCase()])));
}

function fillSelect(sel, pairs) {
  const keep = sel.value;
  sel.innerHTML = '';
  for (const [v, label] of pairs) {
    const o = document.createElement('option');
    o.value = v; o.textContent = label;
    sel.appendChild(o);
  }
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function matches(t) {
  const subj = $('#fSubj').value, goal = $('#fGoal').value;
  const style = $('#fStyle').value, lang = $('#fLang').value;

  /* Универсальный учитель подходит под любой предмет — он и правда
     объясняет что угодно, прятать его при выборе предмета неверно. */
  if (subj !== 'all' && t.subject && t.subject !== subj) return false;
  if (goal !== 'all' && !(t.goals || []).includes(goal)) return false;
  if (style !== 'all' && t.role !== style) return false;
  if (lang !== 'all' && !(t.languages || []).includes(lang)) return false;
  return true;
}

/* ---------- карточка ---------- */
function starsHtml(id) {
  const r = RATINGS[id];
  if (!r || !r.count) return `<span class="stars"><span class="none">${Sky.t('noRating')}</span></span>`;
  const full = Math.round(r.avg);
  return `<span class="stars">${'★'.repeat(full)}${'☆'.repeat(5 - full)}` +
         ` <span class="none">${Sky.t('ratingN').replace('%1', r.avg.toFixed(1)).replace('%2', r.count)}</span></span>`;
}

function card(t) {
  const mine = t.id === SkyTeachers.selectedId();
  const locked = !SkyTeachers.canUse(t);
  const el = document.createElement('div');
  el.className = 'tcard' + (mine ? ' picked' : '') + (locked ? ' locked' : '');
  el.innerHTML =
    `<div class="top">
       <div class="ava">${esc(t.emoji)}</div>
       <div>
         <h3>${esc(Sky.L(t.name))}</h3>
         <div class="role">${esc(roleLabel(t.role))} · ${esc(t.subject || Sky.t('universal'))}${
           SkyTeachers.isPremium(t) ? ` <span class="prem-badge">${esc(Sky.t('premBadge'))}</span>` : ''}</div>
       </div>
     </div>
     <p class="style">${esc(Sky.L(t.style))}</p>
     <div class="tags">${(t.goals || []).map(g => `<span class="tag-goal">${esc(goalLabel(g))}</span>`).join('')}</div>
     <div class="tmeta">
       <div class="line"><span>${Sky.t('strictL')}</span>
            <span class="strict">${SkyTeachers.strictnessLabel(t.strictness)}</span></div>
       <div class="line"><span>${Sky.t('ratingL')}</span>${starsHtml(t.id)}</div>
     </div>
     <div class="actions">
       <button class="btn${mine || locked ? ' ghost' : ''}" data-pick="${esc(t.id)}"${mine || locked ? ' disabled' : ''}>
         ${mine ? Sky.t('picked') : locked ? Sky.t('premLockedBtn') : Sky.t('pick')}</button>
       <button class="btn ghost" data-rate="${esc(t.id)}">${Sky.t('rateBtn')}</button>
     </div>`;
  return el;
}

/* ---------- топ-3 ----------
   Считает SkyTeachers.top(): там взвешенная оценка, поэтому учитель
   с единственной пятёркой не встанет над учителем с 4,8 по полусотне
   отзывов. Блок прячется целиком, пока оценок нет вообще: пустой
   «топ» выглядит как сломанная страница. */
function renderTop() {
  const list = SkyTeachers.top(RATINGS, 3);
  $('#topSection').classList.toggle('hidden', !list.length);
  if (!list.length) return;

  const box = $('#topList');
  box.innerHTML = '';
  list.forEach((row, i) => {
    const t = row.teacher;
    const el = document.createElement('div');
    el.className = 'top-card' + (i === 0 ? ' first' : '');
    el.innerHTML =
      `<div class="place">${['🥇','🥈','🥉'][i] || (i + 1)}</div>
       <div class="ava">${esc(t.emoji)}</div>
       <div class="who">
         <b>${esc(Sky.L(t.name))}</b>
         <span>${esc(Sky.t('topStars')
            .replace('%1', row.avg.toFixed(1))
            .replace('%2', Sky.plural(row.count, Sky.t('reviewsPl'), Sky.t('reviewsPl2'), Sky.t('reviewsPl5'))))}</span>
       </div>
       <div class="stars-top">${'★'.repeat(Math.round(row.avg))}${'☆'.repeat(5 - Math.round(row.avg))}</div>`;
    box.appendChild(el);
  });
}

/* ---------- плашка доступа к премиум-учителям ----------
   Показываем только если премиум-учителя в каталоге вообще есть:
   иначе это реклама того, чего нет. */
function renderPremium() {
  const hasPremium = TEACHERS.some(t => SkyTeachers.isPremium(t));
  $('#premiumSection').classList.toggle('hidden', !hasPremium);
  if (!hasPremium) return;

  const st = SkyTeachers.premiumState();
  $('#premiumBox').innerHTML =
    `<div class="spread">
       <h3>${esc(Sky.t('premTitle'))} ${st.unlocked ? '🔓' : '🔒'}</h3>
       <span class="pct">${st.pct}%</span>
     </div>
     <p>${st.unlocked ? esc(Sky.t('premOpenText')) : esc(Sky.t('premLockedText')
        .replace('%1', Sky.t('premSolvedN').replace('%1', st.solvedNeed))
        .replace('%2', Sky.t('premReviewsN').replace('%1', st.reviewsNeed)))}</p>
     <div class="progress"><i style="width:${st.pct}%"></i></div>
     <span class="left">${esc(Sky.t('premLeft')
        .replace('%1', st.solved).replace('%2', st.solvedNeed)
        .replace('%3', st.reviews).replace('%4', st.reviewsNeed))}</span>`;
}

function renderList() {
  const list = $('#tList');
  list.innerHTML = '';
  const shown = TEACHERS.filter(matches);
  $('#foundNote').textContent = Sky.t('foundN').replace('%1', shown.length);

  if (!shown.length) {
    list.innerHTML = `<div class="empty-filter">${Sky.t('emptyFilter')}</div>`;
    return;
  }
  for (const t of shown) list.appendChild(card(t));
}

function renderCurrent() {
  const t = SkyTeachers.selected();
  if (!t) { $('#currentBlock').innerHTML = ''; return; }
  $('#currentBlock').innerHTML =
    `<div class="ava">${esc(t.emoji)}</div>
     <div class="who">
       <b>${esc(Sky.L(t.name))} — ${esc(Sky.t('yourTeacher').toLowerCase())}</b>
       <span>${esc(Sky.t('changeHint'))}</span>
     </div>`;
}

/* ---------- оценка учителя ---------- */
/* lesson — необязательный объект {id, kind, subject, title}.
   С каталога учителей его нет (оценивают учителя вообще), а из
   тренажёра и разбора по фото передаётся конкретный урок — тогда
   отзыв привязывается именно к нему. */
function openRate(t, lesson) {
  lesson = lesson || {};
  const prev = SkyTeachers.myReview(t.id, lesson.id);
  let stars = prev ? prev.stars : 0;

  Sky.modal(
    `<h2 style="margin-bottom:6px">${esc(Sky.t('rateTitle').replace('%1', Sky.L(t.name)))}</h2>
     ${lesson.title ? `<p class="lead" style="font-size:12.5px;margin-bottom:12px">${esc(lesson.title)}</p>` : ''}
     <p class="lead" style="font-size:12px;margin-bottom:14px">${esc(Sky.t('rateLesson'))}</p>
     <div class="rate-row" id="rateRow">
       ${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}"${n <= stars ? ' class="on"' : ''}>★</button>`).join('')}
     </div>
     <div class="field"><label>${Sky.t('rateComment')}</label>
       <textarea id="rateComment" rows="3">${esc(prev && prev.comment ? prev.comment : '')}</textarea></div>
     <button class="btn full big" id="rateSave"${stars ? '' : ' disabled'}>${Sky.t('rateSave')}</button>`,
    (box, close) => {
      const row = box.querySelector('#rateRow');
      row.addEventListener('click', e => {
        const b = e.target.closest('button[data-n]');
        if (!b) return;
        stars = +b.dataset.n;
        [...row.children].forEach(x => x.classList.toggle('on', +x.dataset.n <= stars));
        box.querySelector('#rateSave').disabled = false;
      });
      box.querySelector('#rateSave').addEventListener('click', async () => {
        const btn = box.querySelector('#rateSave');
        btn.disabled = true;
        const res = await SkyTeachers.rate(t.id, stars, box.querySelector('#rateComment').value.trim(), lesson);
        if (res && res.error) { Sky.toast(res.error, 4200); btn.disabled = false; return; }
        RATINGS = await SkyTeachers.ratings();
        renderList();
        renderTop();
        renderPremium();   /* отзыв мог открыть премиум-учителей */
        /* Офлайн отзыв всё равно сохранён — говорим об этом честно,
           вместо прежнего отказа «нужна база». */
        const offline = !(Sky.db && Sky.db.isCloud && Sky.db.isCloud() && Sky.db.me && Sky.db.me());
        Sky.toast(offline ? Sky.t('rateOffline') : Sky.t('rateThanks'), offline ? 4200 : 3200);
        close();
      });
    }
  );
}

/* ---------- события ---------- */
$('#tList').addEventListener('click', async e => {
  const pick = e.target.closest('button[data-pick]');
  if (pick) {
    const ok = await SkyTeachers.select(pick.dataset.pick);
    if (!ok) { Sky.toast(Sky.t('premLockedBtn'), 3600); return; }
    renderCurrent();
    renderList();
    Sky.toast(Sky.t('picked') + ': ' + Sky.L(SkyTeachers.selected().name));
    return;
  }
  const rate = e.target.closest('button[data-rate]');
  if (rate) {
    const t = SkyTeachers.get(rate.dataset.rate);
    if (t) openRate(t);
  }
});

['#fSubj','#fGoal','#fStyle','#fLang'].forEach(sel =>
  $(sel).addEventListener('change', renderList));

document.addEventListener('langchange', () => {
  fillFilters();
  renderCurrent();
  renderList();
  renderTop();
  renderPremium();
});

/* Решённые задания влияют на доступ к премиум-учителям — значит,
   полосу прогресса надо обновлять и когда статистика меняется в
   другой вкладке. */
document.addEventListener('statschange', renderPremium);

/* ---------- запуск ---------- */
(async function start() {
  TEACHERS = await SkyTeachers.all();
  RATINGS = await SkyTeachers.ratings();
  await SkyTeachers.syncFromProfile();
