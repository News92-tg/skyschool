<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подборка заданий — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<!-- Подборка заданий для ученика: collection.html?code=A3K7MN.
     Открывается и без входа (если учитель так разрешил). Логика —
     assets/collection.js; ответы проверяет база (submit_collection). -->
<style>
  .cn-head{display:grid;gap:6px}
  .cn-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);font-weight:700}
  .cn-desc{white-space:pre-wrap;font-size:14px;line-height:1.6}
  .cn-task{display:grid;gap:10px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .cn-task.answered{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
  .cn-q{display:flex;gap:10px;font-size:15px;font-weight:700;line-height:1.55}
  .cn-q b{flex:none;min-width:24px;color:var(--muted)}
  .cn-q span{white-space:pre-wrap;word-break:break-word}
  .cn-opts{display:grid;gap:7px}
  .cn-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel-2);cursor:pointer;font-size:14px;line-height:1.45}
  .cn-opt:hover{border-color:var(--line-2)}
  .cn-opt:has(input:checked){border-color:var(--accent);background:var(--m-learn-soft)}
  .cn-opt input{width:18px;height:18px;accent-color:var(--accent);margin:1px 0 0;flex:none}
  .cn-task textarea{width:100%;min-height:74px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel-2);color:var(--ink);font:inherit;font-size:14px;line-height:1.5;resize:vertical}
  /* имя и класс — в одну строку: класс короткий */
  .cn-who{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:end}
  .cn-who .field{margin:0}
  .cn-who .as{font-size:13.5px;font-weight:700;align-self:center}
  .cn-bottom{display:grid;gap:12px}
  .cn-progress{font-size:13px;font-weight:800;color:var(--muted)}
  .cn-done{text-align:center;padding:30px 20px;display:grid;gap:10px;justify-items:center}
  .cn-done .big{font-size:46px}
  .cn-done .score{font-size:30px;font-weight:900;color:var(--accent)}
  .cl-code-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  .cl-code-form input{width:150px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);
    font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap" style="max-width:820px">
  <div id="view"><div class="panel"><span class="spin"></span></div></div>
</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/collection-common.js"></script>
<script src="assets/collection.js"></script>
</body>
</html>
