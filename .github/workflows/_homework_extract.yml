name: homework staging import

on:
  push:
    branches: [main]
    paths:
      - "_homework_bz2_part*.txt"
      - ".github/workflows/_homework_extract.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and apply archive patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, pathlib
          parts=sorted(pathlib.Path('.').glob('_homework_bz2_part*.txt'))
          data=b''.join(p.read_text().encode() for p in parts)
          expected='74f341ed9a5a7731560b747334ddc5d635a3285910d06812a48e4b8731450f49'
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('staged patch checksum mismatch')
          diff=bz2.decompress(base64.b64decode(data))
          expected_diff='7db886e4b62aad6ea4e2c00f0ca004b8ebf639e6a156c37e8b6b74c4a3683f36'
          if hashlib.sha256(diff).hexdigest()!=expected_diff:
              raise SystemExit('decoded diff checksum mismatch')
          pathlib.Path('/tmp/homework.diff').write_bytes(diff)
          print('PATCH_OK', len(diff))
          PY

          git apply --check --exclude=assets/db.js /tmp/homework.diff
          git apply --exclude=assets/db.js /tmp/homework.diff

          rm -f _homework_bz2_part*.txt
          rm -f _homework_upload_part*.txt _homework_diff.gz.b64 _homework_diff_part*.txt _homework_diff_part*.txt
          rm -f ".github/workflows/_homework_extract.yml"
          rm -f "домашка-по-фото.zip"

          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Homework check sessions: several photos, local midnight, paywall"
          git push
