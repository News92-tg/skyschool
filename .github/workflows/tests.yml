name: Tests

# Всё, что проверяется без сервера: шахматы, банки заданий, офлайн-кэш
# и каждая страница в настоящем браузере. Сайт статический, поэтому
# «собрать» тут нечего — только открыть и проверить.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Chess, language banks, offline cache
        run: npm run test:fast

      - name: Every page in a real browser
        run: npm run test:browser

      - name: Task banks structure
        run: python scripts/validate-banks.py
