<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<link rel="stylesheet" href="assets/photo-ai.css">
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">

  <section id="setup">
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>

    <div class="panel section">
      <div class="row">
        <div class="field">
          <label data-i18n="subject"></label>
          <select id="subject"><option value="all" data-i18n="allSubjects"></option></select>
        </div>
        <div class="field">
          <label data-i18n="exam"></label>
          <select id="exam">
            <option value="all" data-i18n="anyExam"></option>
            <option value="oge">ОГЭ</option>
            <option value="ege">ЕГЭ</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="level"></label>
          <select id="difficulty">
            <option value="all" data-i18n="anyLevel"></option>
            <option value="easy" data-i18n="easy"></option>
            <option value="medium" data-i18n="medium"></option>
            <option value="hard" data-i18n="hard"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="mode"></label>
          <select id="mode">
            <option value="due" data-i18n="modeDue"></option>
            <option value="all" data-i18n="modeAll"></option>
            <option value="weak" data-i18n="modeWeak"></option>
          </select>
        </div>
      </div>
      <p class="note" id="modeNote"></p>

      <div class="spread teacher-bar" style="margin-top:14px">
        <span class="who"><span class="ava" id="tchAva"></span><span id="tchName"></span></span>
        <a class="btn ghost small" href="teachers.html" data-i18n="tchChange"></a>
      </div>

      <div class="spread" style="margin-top:14px">
        <span class="tag gray" id="aiState"></span>
        <button class="btn ghost small" id="aiSetupBtn"></button>
      </div>
      <p class="note hidden" id="ruNote" style="border-left-color:var(--warn)"></p>
      <button class="btn full big" id="startBtn" style="margin-top:16px" data-i18n="start"></button>
    </div>

    <div class="stats section">
      <div class="stat accent"><b id="stSolved">0</b><span data-i18n="solvedL"></span></div>
      <div class="stat"><b id="stAcc">0%</b><span data-i18n="accuracyL"></span></div>
      <div class="stat ok"><b id="stToday">0</b><span data-i18n="todayL"></span></div>
      <div class="stat"><b id="stAvail">0</b><span data-i18n="availL"></span></div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="progress" style="margin-bottom:20px"><i id="bar"></i></div>
    <div class="panel">
      <div class="meta">
        <span class="tag" id="qTopic"></span>
        <span class="tag gray" id="qExam"></span>
        <span class="tag gray" id="qLevel"></span>
        <span class="tag gray hidden" id="qCefr"></span>
        <span class="tag gray hidden" id="qCat"></span>
        <span class="tag gray" id="qCount"></span>
        <span class="tag warn" id="qBox"></span>
      </div>
      <div class="question" id="qText"></div>

      <!-- Аудирование: фразу произносит сам браузер (Web Speech API),
           никаких внешних сервисов и файлов. -->
      <div class="hidden" id="qAudioBox" style="margin:0 0 16px">
        <button class="btn ghost" id="qPlay" type="button"></button>
        <p class="note hidden" id="qAudioNote" style="border-left-color:var(--warn)"></p>
      </div>

      <div class="options" id="qOptions"></div>

      <div class="note hidden" id="qHint"></div>
      <div class="verdict hidden" id="qVerdict"></div>
      <div class="solution hidden" id="qSolution"></div>
      <!-- Перевод разобранной фразы на русский и польский: показываем
           только после ответа, иначе это подсказка. -->
      <div class="solution hidden" id="qTr"></div>
      <div class="ai hidden" id="qAi"></div>

      <div class="pye-wrap hidden" id="pythonEditor">
        <div class="pye-head">
          <b data-i18n="pyeTitle"></b>
          <span class="pye-status" id="pyeStatus"><span class="dot"></span><span id="pyeStatusText" data-i18n="pyeIdle"></span></span>
        </div>
        <textarea class="pye-editor" id="pyeCode" spellcheck="false"></textarea>
        <button class="btn pye-run" id="pyeRunBtn" data-i18n="pyeRun"></button>
        <div class="pye-console hidden" id="pyeOutput"></div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="hintBtn" data-i18n="hint"></button>
        <button class="btn" id="checkBtn" disabled data-i18n="check"></button>
        <button class="btn hidden" id="aiBtn" data-i18n="aiTitle"></button>
        <button class="btn hidden" id="nextBtn" data-i18n="next"></button>
        <button class="btn ghost" id="stopBtn" data-i18n="finish"></button>
      </div>

      <!-- ==================== ФОТО ЗАДАНИЯ ====================
           Ученик застрял на задании из банка, а рядом лежит учебник со
           своим — сфотографировал, получил разбор, вернулся к заданию.
           Текущее задание уходит на сервер как контекст: модель видит,
           над чем ученик сейчас работает. -->
      <div class="pa-wrap" id="paWrap">
        <div class="pa-head">
          <b data-i18n="paTitle"></b>
        </div>
        <p class="pa-hint" data-i18n="paHint"></p>

        <div class="pa-actions">
          <!-- capture="environment" открывает на телефоне камеру сразу
               с задней стороны; на компьютере это обычный выбор файла -->
          <input type="file" id="paFile" accept="image/*" capture="environment" hidden>
          <button class="btn" id="paShootBtn" type="button" data-i18n="paShoot"></button>
          <button class="btn ghost hidden" id="paRunBtn" type="button" data-i18n="paRun"></button>
        </div>

        <div class="pa-shot hidden" id="paShot">
          <img id="paPreview" alt="">
          <button class="pa-drop" id="paDrop" type="button" title="×">×</button>
        </div>

        <div class="pa-working hidden" id="paWorking">
          <span class="pa-dot"></span><span id="paWorkingText"></span>
        </div>

        <div class="pa-fail hidden" id="paFail"></div>

        <div class="hidden" id="paResult">
          <div class="pa-label">
            <span data-i18n="paTextL"></span>
            <button type="button" id="paSaveText" data-i18n="paSaveText"></button>
          </div>
          <textarea class="pa-text" id="paText" spellcheck="false"></textarea>

          <div class="hidden" id="paSolutionBox">
            <div class="pa-label">
              <span data-i18n="paStepsL"></span>
              <button type="button" id="paMore" data-i18n="paMore"></button>
            </div>
            <ol class="pa-steps" id="paSteps"></ol>
          </div>

          <div class="hidden" id="paErrorsBox">
            <div class="pa-label"><span data-i18n="paErrorsL"></span></div>
            <div id="paErrors"></div>
          </div>

          <div class="pa-feedback hidden" id="paFeedback"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer id="appFooter"></footer>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/db.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/python-editor.js"></script>
<script src="assets/speech.js"></script>
<script src="assets/photo-ai.js"></script>
<script src="data/ai-teachers.js"></script>
<script src="assets/ai-teachers.js"></script>
<script src="data/bank-math.js"></script>
<script src="data/bank-informatics.js"></script>
<script src="data/bank-russian.js"></script>
<script src="data/bank-physics.js"></script>
<script src="data/bank-biology.js"></script>
<script src="data/bank-chemistry.js"></script>
<script src="data/bank-geography.js"></script>
<script src="data/bank-social.js"></script>
<script src="data/bank-history.js"></script>
<script src="data/bank-english.js"></script>
<script src="data/bank-polish.js"></script>
<script src="data/bank-spanish.js"></script>
<script src="data/bank-german.js"></script>
<script src="data/oge-bank.js"></script>
<script>

Sky.init({

        en:'Get one wrong and it comes back tomorrow. Get it right several times running and it appears less and less often. That way your time goes to what you barely remember, not to what you already know.'},

  allSubjects:{ru:'Все предметы',en:'All subjects'},

  solvedL:{ru:'решено всего',en:'solved overall'},
  accuracyL:{ru:'верных',en:'accuracy'},
  todayL:{ru:'сегодня',en:'today'},
  availL:{ru:'доступно сейчас',en:'available now'},
  countOf:{ru:'%1 из %2',en:'%1 of %2'},
  empty:{ru:'По этим фильтрам заданий нет. Смените предмет, экзамен или режим.',

  doneT:{ru:'На сегодня всё',en:'That is everything for now'},

  off:{ru:'не подключён',en:'not connected'},
  change:{ru:'Изменить',en:'Change'},
  pyeTitle:{ru:'Решение кодом',en:'Solve with code'},
  pyeRun:{ru:'Запустить',en:'Run'},
  pyeIdle:{ru:'не запущен',en:'not started'},
  pyeLoading:{ru:'загрузка…',en:'loading…'},
  pyeReady:{ru:'готов',en:'ready'},
  pyeRunning:{ru:'выполняется…',en:'running…'},

  tchChange:{ru:'Сменить',en:'Change'},

  /* ---------- аудирование и языковые банки ---------- */

  playAgain:{ru:'🔊 Ещё раз',en:'🔊 Play again'},
  audioNoVoice:{ru:'В этом браузере нет голоса нужного языка, поэтому фраза показана текстом — задание решаемо, но на слух его не отработать. Голоса есть в Chrome и Edge.',
                en:'This browser has no voice for that language, so the phrase is shown as text — the problem is still solvable, just not by ear. Chrome and Edge ship the voices.'},
  audioNoApi:{ru:'Этот браузер не умеет озвучивать текст, поэтому фраза показана текстом.',
              en:'This browser cannot speak text, so the phrase is shown as text instead.'},
  /* ---------- фото задания ---------- */

          en:'Photograph a task from a textbook or your own work. We will read the text, solve it step by step, and if the photo already has a solution, go through the mistakes. The photo is compressed to 1024 px in the browser; keys stay on the server.'},
  paShoot:{ru:'📷 Загрузить фото задания',en:'📷 Upload a photo of the task'},
  paRun:{ru:'Разобрать фото',en:'Analyse the photo'},

  paSaveText:{ru:'Сохранить исправления',en:'Save corrections'},

  paWork2:{ru:'Gemini читает фото и решает задание…',en:'Gemini is reading the photo and solving the task…'},
  paTextSaved:{ru:'Исправленный текст сохранён',en:'The corrected text is saved'},
  paNotSaved:{ru:'Разбор показан, но в историю не записан: для этого нужно войти в аккаунт.',
              en:'The analysis is shown but not saved to your history — that needs you to be signed in.'},

  catGrammar:{ru:'грамматика',en:'grammar'},
  catVocabulary:{ru:'лексика',en:'vocabulary'},
  catReading:{ru:'чтение',en:'reading'},
  catListening:{ru:'аудирование',en:'listening'},
  trLine:{ru:'Перевод — RU: %1 · PL: %2',en:'Translation — RU: %1 · PL: %2'}
});

/* ---------- выбранный AI-учитель ----------
   Он не украшение шапки: его промпт уходит в разбор (см. aiPrompt
   в assets/core.js), поэтому важно видеть, кто именно сейчас
   объясняет. */
function renderTeacher() {
  if (!window.SkyTeachers) return;
  const t = SkyTeachers.selected();
  if (!t) return;
  const ava = document.querySelector('#tchAva');
  const name = document.querySelector('#tchName');
  if (ava) ava.textContent = t.emoji;
  if (name) name.textContent = Sky.t('tchWith').replace('%1', Sky.L(t.name));
}
document.addEventListener('teacherchange', renderTeacher);
document.addEventListener('langchange', renderTeacher);
renderTeacher();

const BANKS = window.BANKS || {};
const $ = s => document.querySelector(s);
const EXAM_LABEL = { oge:'ОГЭ', ege:'ЕГЭ', both:'ЕГЭ/ОГЭ' };

/* список предметов */
const subjSel = $('#subject');
for (const b of Object.values(BANKS)) {
  const o = document.createElement('option');
  o.value = b.id; o.dataset.bank = b.id;
  subjSel.appendChild(o);
}
function fillSubjectNames() {
  for (const o of subjSel.options) {
    if (o.dataset.bank) {
      const b = BANKS[o.dataset.bank];
      o.textContent = b.icon + '  ' + Sky.L(b.name);
    }
  }
}

const qs = new URLSearchParams(location.search);
if (qs.get('subject') && BANKS[qs.get('subject')]) subjSel.value = qs.get('subject');
if (['due','all','weak'].includes(qs.get('mode'))) $('#mode').value = qs.get('mode');
if (['all','oge','ege'].includes(qs.get('exam'))) $('#exam').value = qs.get('exam');

let queue = [], pos = 0, current = null, bank = null, picked = null, answered = false, order = [];

function noteText() {
  const m = $('#mode').value;
  $('#modeNote').textContent = Sky.t(m === 'due' ? 'noteDue' : m === 'all' ? 'noteAll' : 'noteWeak');

  /* Честная пометка вместо смешанного языка: предметы российской
     школьной программы остаются по-русски, и об этом надо сказать
     прямо, а не показывать английский интерфейс поверх русского
     задания без объяснений. */
  const ru = $('#ruNote');
  const sub = subjSel.value;
  const showsRuOnly = Sky.lang === 'en' &&
    (sub === 'all' ? Object.values(BANKS).some(b => b.ruOnly) : (BANKS[sub] && BANKS[sub].ruOnly));
  ru.classList.toggle('hidden', !showsRuOnly);
  if (showsRuOnly) ru.textContent = Sky.t('ruOnlyNote');
}
$('#mode').addEventListener('change', noteText);
subjSel.addEventListener('change', () => { noteText(); renderStats(); });
$('#exam').addEventListener('change', renderStats);
$('#difficulty').addEventListener('change', renderStats);

function renderStats() {
  const s = Sky.stats();
  $('#stSolved').textContent = s.solved;
  $('#stAcc').textContent = Sky.pct(s.right, s.solved) + '%';
  $('#stToday').textContent = Sky.todayCount();
  $('#stAvail').textContent = collect().length;
}

function collect() {
  const sub = subjSel.value, ex = $('#exam').value, dif = $('#difficulty').value, mode = $('#mode').value;
  const out = [];
  for (const b of Object.values(BANKS)) {
    if (sub !== 'all' && b.id !== sub) continue;
    let list = b.tasks.filter(t =>
      (ex === 'all' || t.exam === ex || t.exam === 'both') &&
      (dif === 'all' || t.difficulty === dif));
    if (mode === 'due')  { const ok = new Set(Sky.dueIds(b.id, list.map(t => t.id)));  list = list.filter(t => ok.has(t.id)); }
    if (mode === 'weak') { const ok = new Set(Sky.weakIds(b.id, list.map(t => t.id))); list = list.filter(t => ok.has(t.id)); }
    for (const t of list) out.push({ bank: b, task: t });
  }
  return Sky.shuffle(out);
}

$('#startBtn').addEventListener('click', () => {
  queue = collect();
  if (!queue.length) { Sky.toast(Sky.t('empty')); return; }
  pos = 0;
  $('#setup').classList.add('hidden');
  $('#quiz').classList.remove('hidden');
  nextTask();
});

$('#stopBtn').addEventListener('click', () => {
  Speech.stop();
  $('#qAudioBox').classList.add('hidden');
  current = null;
  $('#quiz').classList.add('hidden');
  $('#setup').classList.remove('hidden');
  renderStats();
  window.scrollTo({ top:0, behavior:'smooth' });
});

function hideExtras() {
  ['qHint','qVerdict','qSolution','qTr','qAi'].forEach(id => $('#' + id).classList.add('hidden'));
}

function nextTask() {
  hideExtras();
  Speech.stop();                       /* предыдущая фраза не должна звучать поверх новой */
  paReset(false);                      /* разбор чужого фото над новым заданием только путает */
  if (pos >= queue.length) {
    current = null;
    document.querySelectorAll('.meta .tag').forEach(s => s.classList.add('hidden'));
    $('#qAudioBox').classList.add('hidden');
    $('#qText').textContent = '';
    $('#qOptions').innerHTML = `<div class="empty"><div class="big">🌤</div>
      <b>${Sky.t('doneT')}</b><p>${Sky.t('doneD')}</p></div>`;
    ['hintBtn','checkBtn','aiBtn','nextBtn'].forEach(id => $('#' + id).classList.add('hidden'));
    $('#bar').style.width = '100%';
    return;
  }
  const item = queue[pos];
  bank = item.bank; current = item.task; picked = null; answered = false;
  /* Порядок вариантов перемешиваем при показе: в файлах базы верный
     ответ стоит первым — так их удобно писать и проверять, но показывать
     в том же порядке нельзя, иначе можно жать «A», не читая условие.
     Фиксируем один раз на задание, чтобы не прыгал при перерисовке. */
  if (!item.order) item.order = Sky.shuffle(current.options.map((_, i) => i));
  order = item.order;
  document.querySelectorAll('.meta .tag').forEach(s => s.classList.remove('hidden'));
  renderTask();
}

function renderTask() {
  if (!current) return;
  $('#qTopic').textContent = Sky.L(current.topic);
  $('#qExam').textContent  = EXAM_LABEL[current.exam];
  $('#qLevel').textContent = Sky.t(current.difficulty);
  $('#qCount').textContent = Sky.t('countOf').replace('%1', pos + 1).replace('%2', queue.length);

  /* Уровень по шкале CEFR (A1/A2/B1) и категория — только у языковых
     банков. У остальных предметов этих полей нет, и теги скрыты. */
  const cefr = $('#qCefr');
  cefr.textContent = current.level || '';
  cefr.classList.toggle('hidden', !current.level);
  const cat = $('#qCat');
  cat.textContent = current.cat ? Sky.t('cat' + current.cat[0].toUpperCase() + current.cat.slice(1)) : '';
  cat.classList.toggle('hidden', !current.cat);

  const box = Sky.boxOf(bank.id, current.id);
  $('#qBox').textContent = box < 0 ? Sky.t('boxNew') : Sky.t('boxN').replace('%1', box);

  $('#qText').textContent = Sky.L(current.text);
  $('#bar').style.width = Math.round(pos / queue.length * 100) + '%';

  const list = $('#qOptions'); list.innerHTML = '';
  order.forEach((oi, shown) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.setAttribute('aria-pressed', String(picked === oi));
    b.innerHTML = `<span class="k">${'ABCDEF'[shown]}</span><span></span>`;
    b.lastChild.textContent = Sky.L(current.options[oi]);
    if (answered) {
      b.disabled = true;
      if (oi === current.answer) b.classList.add('right');
      else if (oi === picked) b.classList.add('wrong');
    } else {
      b.addEventListener('click', () => { picked = oi; renderTask(); });
    }
    list.appendChild(b);
  });

  $('#checkBtn').disabled = (picked === null);
  $('#hintBtn').classList.toggle('hidden', answered);
  $('#checkBtn').classList.toggle('hidden', answered);
  $('#nextBtn').classList.toggle('hidden', !answered);
  $('#aiBtn').classList.toggle('hidden', !answered);

  if (!$('#qHint').classList.contains('hidden')) $('#qHint').textContent = Sky.L(current.hint);
  if (answered) {
    const ok = picked === current.answer;
    const v = $('#qVerdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'no');
    v.textContent = ok ? '✓ ' + Sky.t('right')
      : '✕ ' + Sky.t('wrong') + ' — ' + Sky.t('correctIs') + Sky.L(current.options[current.answer]);
    $('#qSolution').textContent = Sky.L(current.solution);

    /* Перевод разобранной фразы — после ответа, иначе подсказка.
       Русский и польский рядом: половина наших учеников учит оба, и
       увидеть одну фразу в трёх языках полезнее, чем в двух. */
    const tr = $('#qTr');
    if (current.tr && (current.tr.ru || current.tr.pl)) {
      tr.textContent = Sky.t('trLine')
        .replace('%1', current.tr.ru || '—')
        .replace('%2', current.tr.pl || '—');
      tr.classList.remove('hidden');
    } else {
      tr.classList.add('hidden');
    }
  }

  syncAudio();
  syncPythonEditor();
}

/* ---------- аудирование ----------
   Задание со звуком не показывает фразу текстом: иначе это чтение, а
   не аудирование. Но если голоса нужного языка в браузере нет,
   слушать нечего — и тогда честнее показать текст с пояснением, чем
   оставить ученика с неразрешимым заданием. */
let audioPlayedFor = null;
function syncAudio() {
  const box = $('#qAudioBox'), btn = $('#qPlay'), note = $('#qAudioNote');
  const a = current && current.audio;
  if (!a) { box.classList.add('hidden'); return; }

  box.classList.remove('hidden');
  const canApi = Speech.canSpeak();
  const canVoice = canApi && Speech.hasVoice(a.lang);

  btn.textContent = Sky.t('playAudio');
  btn.classList.toggle('hidden', !canVoice);
  btn.onclick = () => {
    const r = Speech.speak(a.text, a.lang);
    if (r.ok) btn.textContent = Sky.t('playAgain');
    else syncAudio();
  };

  note.textContent = canVoice ? ''
    : (canApi ? Sky.t('audioNoVoice') : Sky.t('audioNoApi')) + ' — “' + a.text + '”';
  note.classList.toggle('hidden', canVoice);

  /* Первое проигрывание — сразу, в цепочке клика «Начать»/«Дальше»,
     поэтому автозапуск браузером не блокируется. Но ровно один раз на
     задание: renderTask() вызывается и при выборе варианта, и фраза
     перебивала бы сама себя на каждом клике. */
  if (canVoice && !answered && audioPlayedFor !== current.id) {
    audioPlayedFor = current.id;
    const r = Speech.speak(a.text, a.lang);
    if (r.ok) btn.textContent = Sky.t('playAgain');
  }
}

/* Список голосов приезжает асинхронно — когда приедет, перерисуем
   блок озвучки: до этого момента мы могли честно, но напрасно
   сказать «голоса нет». */
Speech.onReady(() => { if (current) syncAudio(); });

/* ---------- встроенный Python-редактор ----------
   Показывается только для информатики и только у заданий с
   needsCode:true — так задания с одним верным вариантом (их
   большинство) не обрастают лишним UI. Сейчас таких заданий в базе
   нет: механизм готов, включается добавлением needsCode:true задаче
   в data/bank-informatics.js. */
let pyeTaskId = null;
function syncPythonEditor() {
  const wrap = $('#pythonEditor');
  const show = bank && bank.id === 'informatics' && current && current.needsCode === true;
  wrap.classList.toggle('hidden', !show);
  if (!show) return;

  if (pyeTaskId !== current.id) {
    pyeTaskId = current.id;
    $('#pyeCode').value = current.starterCode || '# ваш код здесь\n';
    const out = $('#pyeOutput'); out.textContent = ''; out.classList.add('hidden');
    setPyeStatus('idle');
  }
}

function setPyeStatus(state, text) {
  const el = $('#pyeStatus');
  el.className = 'pye-status' + (state === 'idle' ? '' : ' ' + state);
  $('#pyeStatusText').textContent = text || Sky.t('pye' + state[0].toUpperCase() + state.slice(1));
}

$('#pyeRunBtn').addEventListener('click', async () => {
  const code = $('#pyeCode').value;
  const out = $('#pyeOutput');
  const firstRun = !window.PythonEditor.isReady();
  if (firstRun) Sky.toast(Sky.t('pyeFirstRun'), 4000);

  setPyeStatus('running');
  out.classList.remove('hidden');
  out.textContent = firstRun ? Sky.t('pyeLoading') : '';

  const r = await window.PythonEditor.runPython(code, (msg) => {
    if (firstRun) out.textContent = msg;
  });

  if (r.error) {
    setPyeStatus('err', Sky.t('pyeIdle'));
    out.innerHTML = '';
    const errLine = document.createElement('div');
    errLine.className = 'err';
    errLine.textContent = r.error;
    out.appendChild(errLine);
    if (r.output) {
      const pre = document.createElement('div');
      pre.textContent = r.output;
      out.appendChild(pre);
    }
  } else {
    setPyeStatus('ready');
    const text = [r.output, r.result].filter(s => s).join('\n');
    out.textContent = text || Sky.t('pyeNoOutput');
  }
});

$('#hintBtn').addEventListener('click', () => {
  const h = $('#qHint'); h.textContent = Sky.L(current.hint); h.classList.remove('hidden');
});

$('#checkBtn').addEventListener('click', () => {
  if (picked === null || !current) return;
  answered = true;
  const ok = picked === current.answer;
  const res = Sky.record(bank.id, current.id, ok);
  $('#qVerdict').classList.remove('hidden');
  $('#qSolution').classList.remove('hidden');
  renderTask();
  const days = Math.max(1, Math.round((res.due - Date.now()) / 864e5));
  Sky.toast(days <= 1 ? Sky.t('nextTomorrow') : Sky.t('nextIn').replace('%1', days));
});

$('#nextBtn').addEventListener('click', () => {
  pos++; nextTask(); window.scrollTo({ top:0, behavior:'smooth' });
});

$('#aiBtn').addEventListener('click', async () => {
  const box = $('#qAi');
  box.classList.remove('hidden');
  box.innerHTML = `<h4>${Sky.t('aiTitle')}</h4>`;

  /* ИИ не подключён — вместо «не удалось» сразу предлагаем подключить */
  if (Sky.aiMode() === 'off') {
    const p = document.createElement('p');
    p.textContent = Sky.t('aiOff');
    box.appendChild(p);
    const b = document.createElement('button');
    b.className = 'btn small';
    b.style.marginTop = '12px';
    b.textContent = Sky.t('aiSetup');
    b.addEventListener('click', openAiSetup);
    box.appendChild(b);
    return;
  }

  const line = document.createElement('div');
  line.innerHTML = `<span class="spin"></span> ${Sky.t('aiLoading')}`;
  box.appendChild(line);
  $('#aiBtn').disabled = true;

  const res = await Sky.explain({
    task: Sky.L(current.text),
    options: current.options.map(o => Sky.L(o)),
    userAnswer: Sky.L(current.options[picked]),
    correctAnswer: Sky.L(current.options[current.answer]),
    subject: Sky.L(bank.name),
    topic: Sky.L(current.topic)
  });

  line.remove();
  if (res.text) {
    box.append(res.text);
  } else {
    box.append(res.error);
    const b = document.createElement('button');
    b.className = 'btn ghost small';
    b.style.marginTop = '12px';
    b.textContent = Sky.t('aiSetup');
    b.addEventListener('click', openAiSetup);
    box.appendChild(b);
  }
  $('#aiBtn').disabled = false;
});

/* ---------- окно подключения ИИ ----------
   Ключ вводит сам пользователь, и он остаётся в его браузере. В файлы
   сайта ключ не попадает никогда: иначе его увидит любой посетитель. */
function openAiSetup() {
  Sky.modal(
    `<h2>${Sky.t('aiKeyTitle')}</h2>
     <p class="lead" style="font-size:13px;margin-top:8px">${Sky.t('aiKeyWhy')}</p>
     <div class="note" style="border-left-color:var(--warn)">${Sky.t('aiKeyPublic')}</div>
     <div class="field" style="margin-top:16px">
       <label>DeepSeek API key</label>
       <input type="password" id="akKey" placeholder="${Sky.t('aiKeyPh')}"
              style="font-family:'JetBrains Mono',monospace;font-size:12.5px" autocomplete="off">
       <span class="help">platform.deepseek.com → API keys</span>
     </div>
     <button class="btn full big" id="akSave" style="margin-top:16px">${Sky.t('aiKeySave')}</button>
     <button class="btn ghost full" id="akDrop" style="margin-top:9px">${Sky.t('aiKeyForget')}</button>`,
    (box, close) => {
      const input = box.querySelector('#akKey');
      if (Sky.aiKey()) input.value = Sky.aiKey();
      box.querySelector('#akDrop').style.display = Sky.aiKey() ? '' : 'none';

      box.querySelector('#akSave').addEventListener('click', () => {
        const v = input.value.trim();
        if (!v) return;
        if (!v.startsWith('sk-')) return Sky.toast(Sky.t('aiKeyOdd'));
        Sky.setAiKey(v);
        Sky.toast(Sky.t('aiKeySaved'));
        close();
        renderAiState();
      });
      box.querySelector('#akDrop').addEventListener('click', () => {
        Sky.setAiKey('');
        Sky.toast(Sky.t('aiKeyGone'));
        close();
        renderAiState();
      });
    }
  );
}

/* Смена языка: перерисовать подписи и, если идёт тренировка, само
   задание.

   Тут был склеенный кусок: внутрь этого обработчика попала копия
   всего блока инициализации — вместе с $('#aiSetupBtn')
   .addEventListener и document.addEventListener('langchange', …).
   Каждое переключение языка навешивало ещё один обработчик на кнопку
   и ещё один слушатель смены языка: после двух переключений «Подключить
   разбор» открывал окно три раза подряд. Оставлено только то, что и
   должно происходить при смене языка. */
document.addEventListener('langchange', () => {
  fillSubjectNames(); noteText(); renderStats(); renderAiState();
  if (current) renderTask();
});

function renderAiState() {
  const mode = Sky.aiMode();
  const tag = $('#aiState'), btn = $('#aiSetupBtn');
  tag.textContent = mode === 'key' ? Sky.t('aiOnKey')
    : mode === 'worker' ? Sky.t('aiOnWorker') : Sky.t('aiTitle') + ' — ' + Sky.t('off');
  tag.className = 'tag ' + (mode === 'off' ? 'gray' : 'ok');
  btn.textContent = Sky.t(mode === 'off' ? 'aiSetup' : 'change');
}
$('#aiSetupBtn').addEventListener('click', openAiSetup);
document.addEventListener('langchange', renderAiState);

fillSubjectNames(); noteText(); renderStats(); renderAiState();

/* ============================================================
   ФОТО ЗАДАНИЯ

   Что здесь делает тренажёр и чего не делает. Вся работа — сжатие,
   запрос, бакет, строка в photo_checks — лежит в assets/photo-ai.js,
   общем с photo.html. Здесь только разметка и порядок показа.

   Разбор запускается ОТДЕЛЬНОЙ кнопкой, а не сразу после выбора фото.
   Причина простая: между разборами тридцать секунд паузы, и смазанный
   снимок, ушедший автоматически, стоит ученику этих тридцати секунд
   ожидания. Сначала он видит, что снял, потом решает отправлять.
   ============================================================ */
let paShot = null;      /* data:image/jpeg;base64,… текущего снимка */
let paData = null;      /* ответ Worker */
let paRow = null;       /* строка photo_checks, если сохранилась */
let paStepsShown = 0;

function paReset(keepShot) {
  if (!keepShot) {
    paShot = null;
    $('#paShot').classList.add('hidden');
    $('#paPreview').removeAttribute('src');
    $('#paRunBtn').classList.add('hidden');
    $('#paFile').value = '';
  }
  paData = null; paRow = null; paStepsShown = 0;
  ['paResult','paWorking','paFail','paSolutionBox','paErrorsBox','paFeedback']
    .forEach(id => $('#' + id).classList.add('hidden'));
}

function paFail(message, kind) {
  const box = $('#paFail');
  box.textContent = message;
  box.className = 'pa-fail' + (kind === 'warn' ? ' warn' : '');
  box.classList.remove('hidden');
}

$('#paShootBtn').addEventListener('click', () => $('#paFile').click());
$('#paDrop').addEventListener('click', () => paReset(false));

$('#paFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  paReset(false);
  try {
    paShot = await PhotoAI.compressFile(file);
  } catch (err) {
    const code = err && err.message;
    paFail(Sky.t(code === 'toobig' ? 'paTooBig' : code === 'notimage' ? 'paNotImage' : 'paUnreadable'));
    return;
  }
  $('#paPreview').src = paShot;
  $('#paShot').classList.remove('hidden');
  $('#paRunBtn').classList.remove('hidden');
});

$('#paRunBtn').addEventListener('click', async () => {
  if (!paShot) return;
  paReset(true);

  $('#paRunBtn').disabled = true;
  $('#paWorking').classList.remove('hidden');
  $('#paWorkingText').textContent = Sky.t('paWork1');
  /* Отдельного сигнала «распознавание пошло» с сервера нет, поэтому
     вторую надпись показываем по времени — чтобы ожидание не
     выглядело зависанием. */
  const swap = setTimeout(() => { $('#paWorkingText').textContent = Sky.t('paWork2'); }, 2500);

  /* Текущее задание уходит как контекст: если ученик снимает свою
     работу по нему, модель видит, что именно требовалось. */
  const res = await PhotoAI.analyze({
    dataUrl: paShot,
    subject: bank ? Sky.L(bank.name) : subjSel.value,
    taskText: current ? Sky.L(current.text) : ''
  });

  clearTimeout(swap);
  $('#paWorking').classList.add('hidden');
  $('#paRunBtn').disabled = false;

  if (!res.ok) { paFail(res.message, res.code === 'cooldown' ? 'warn' : ''); return; }
  paData = res.data;
  if (res.warning) paFail(res.warning, 'warn');
  paRender();
  paSave();
});

function paRender() {
  $('#paResult').classList.remove('hidden');
  $('#paText').value = paData.text || '';

  /* Шаги открываются по одному. Решение, вывалившееся целиком,
     читают глазами и закрывают; по одному шагу — думают. */
  const steps = paData.solution || [];
  $('#paSolutionBox').classList.toggle('hidden', !steps.length);
  paStepsShown = steps.length ? 1 : 0;
  paSteps();

  const errs = paData.errors || [];
  const box = $('#paErrors');
  box.innerHTML = '';
  /* Пустой список ошибок у проверки работы — это хорошая новость, и
     сказать её надо словами, а не пустым местом. */
  if (paData.kind === 'homework') {
    $('#paErrorsBox').classList.remove('hidden');
    if (!errs.length) {
      const ok = document.createElement('div');
      ok.className = 'pa-ok';
      ok.textContent = Sky.t('paNoErrors');
      box.appendChild(ok);
    }
  } else {
    $('#paErrorsBox').classList.toggle('hidden', !errs.length);
  }
  errs.forEach(e => {
    const d = document.createElement('div');
    d.className = 'pa-err';
    const b = document.createElement('b');
    b.textContent = e.fragment || '';
    const why = document.createElement('span');
    why.textContent = e.why || '';
    d.append(b, why);
    if (e.fix) {
      const fix = document.createElement('span');
      fix.className = 'pa-fix';
      fix.textContent = '→ ' + e.fix;
      d.appendChild(fix);
    }
    box.appendChild(d);
  });

  const fb = $('#paFeedback');
  fb.textContent = paData.feedback || '';
  fb.classList.toggle('hidden', !paData.feedback);
}

function paSteps() {
  const steps = (paData && paData.solution) || [];
  const list = $('#paSteps');
  list.innerHTML = '';
  steps.slice(0, paStepsShown).forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    list.appendChild(li);
  });
  const all = paStepsShown >= steps.length;
  $('#paMore').textContent = Sky.t(all ? 'paAllShown' : 'paMore');
  $('#paMore').disabled = all;
}

$('#paMore').addEventListener('click', () => {
  const steps = (paData && paData.solution) || [];
  if (paStepsShown < steps.length) paStepsShown++;
  paSteps();
});

/* Сохранение: снимок в закрытый бакет, разбор — строкой в photo_checks.
   Ни то, ни другое не обязательно для показа: без входа в аккаунт
   разбор всё равно виден, просто не попадает в историю — и об этом
   говорим прямо, а не прячем. */
async function paSave() {
  const me = Sky.db && Sky.db.me && Sky.db.me();
  let path = null;
  const up = await PhotoAI.uploadShot(paShot, me ? me.id : null);
  if (up && up.path) path = up.path;

  paRow = await PhotoAI.saveCheck({
    kind: paData.kind,
    subject: bank ? bank.id : subjSel.value,
    task_text: current ? Sky.L(current.text).slice(0, 800) : null,
    recognized_text: paData.text || null,
    errors: paData.errors || [],
    feedback: paData.feedback || null,
    image_path: path
  });

  if (!paRow && Sky.db && Sky.db.isCloud && Sky.db.isCloud() && !me) {
    paFail(Sky.t('paNotSaved'), 'warn');
  }
}

/* Исправленный руками текст — это то, что ученик считает написанным
   на самом деле. В историю должен попасть он, а не то, что померещилось
   распознаванию. */
$('#paSaveText').addEventListener('click', async () => {
  const text = $('#paText').value.trim();
  if (paData) paData.text = text;
  if (paRow && Sky.db) {
    await Sky.db.update('photo_checks', paRow.id, { recognized_text: text, ocr_flagged: true });
  }
  Sky.toast(Sky.t('paTextSaved'));
});

/* Переход по ссылке вида trainer.html?subject=math&mode=due&autostart=1
   (например, из плана подготовки) сразу запускает тренировку, а не
   просто выставляет фильтры — так клик по заданию в плане ведёт прямо
   к вопросам, без лишнего «Начать». */
if (qs.get('autostart') === '1') $('#startBtn').click();
</script>
</body>
</html>
