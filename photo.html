<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Домашка по фото — SkyySchool</title>
<meta name="theme-color" content="#f6faff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sky.css">
<style>
.shot{display:grid;grid-template-columns:1fr;gap:14px}
.shot-frame{
  position:relative;background:var(--panel-2);border:1.5px dashed var(--line);
  border-radius:var(--r);min-height:200px;display:grid;place-items:center;overflow:hidden;
}
.shot-frame video,.shot-frame img{width:100%;max-height:420px;object-fit:contain;display:block}
.shot-frame .hint{color:var(--muted);font-size:13px;text-align:center;padding:34px 18px;line-height:1.6}
.shot-actions{display:flex;gap:9px;flex-wrap:wrap}
.shot-actions .btn{flex:1;min-width:130px}

.gradebox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.grade{
  width:74px;height:74px;border-radius:20px;flex:none;display:grid;place-items:center;
  font-size:37px;font-weight:900;color:#fff;
}
.grade.g5{background:var(--ok)} .grade.g4{background:#4c9f4c}
.grade.g3{background:var(--warn)} .grade.g2{background:#e07a3f} .grade.g1{background:var(--no)}
.grade.gx{background:var(--faint)}
/* .g2–.g4 в sky.css — утилиты сетки на 2–4 колонки, а здесь те же
   классы — цвет оценки. Без сброса цифра 2, 3 или 4 съезжала влево. */
.grade,.gr,.hist-row .g{grid-template-columns:none}
.gradebox .said{flex:1;min-width:200px;font-size:13.5px;line-height:1.6}

.recog{
  background:var(--ink,#0e2540);color:#d7e6fa;border-radius:var(--r);padding:14px;
  font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;
}
.recog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}

.err-item{
  border-left:3px solid var(--no);background:var(--panel-2);border-radius:0 var(--r) var(--r) 0;
  padding:11px 14px;margin-bottom:9px;
}
.err-item .frag{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--no);font-weight:700}
.err-item .why{font-size:13px;line-height:1.6;margin-top:5px}
.err-item .fix{font-size:13px;line-height:1.6;margin-top:5px;color:var(--ok);font-weight:700}

.good-item{
  border-left:3px solid var(--ok);background:var(--panel-2);border-radius:0 var(--r) var(--r) 0;
  padding:9px 14px;margin-bottom:7px;font-size:13px;line-height:1.55;
}

.hist-row{
  display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);
}
.hist-row:last-child{border-bottom:none}
.hist-row .g{
  width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-weight:900;color:#fff;font-size:16px;
}
.hist-row .g{background:var(--faint)}
.hist-row .g.g5{background:var(--ok)} .hist-row .g.g4{background:#4c9f4c} .hist-row .g.g3{background:var(--warn)}
.hist-row .g.g2{background:#e07a3f} .hist-row .g.g1{background:var(--no)}
.hist-row .txt{flex:1;min-width:0}
.hist-row .txt b{font-size:13px;display:block}
.hist-row .txt span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .flagged{font-size:11px;color:var(--warn);font-weight:800;flex:none}

.working{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--muted);font-weight:700}
.working .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);animation:phPulse 1s infinite;flex:none}
@keyframes phPulse{0%,100%{opacity:1}50%{opacity:.3}}
  .subj-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .subj-btn{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
    font-family:inherit;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s}
  .subj-btn:hover{border-color:var(--line-2)}
  .subj-btn.active{border-color:var(--m-photo,var(--accent));background:var(--m-photo-soft,var(--panel));color:var(--ink)}
  .task-from-teacher{margin:12px 0;border-left:3px solid var(--accent)}
  .tft-head{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tft-text{margin-top:6px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .hw-text{font-size:14.5px;line-height:1.65}
  .hw-left{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12px;font-weight:800;color:var(--muted)}
  .thumbs-head{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
    font-size:12.5px;font-weight:800;color:var(--muted)}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
  .thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--panel-2);
    border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb b{position:absolute;left:5px;top:5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
    background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:grid;place-items:center}
  .thumb button{position:absolute;right:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer}
  .cap-note{margin-top:8px;font-size:12px;color:var(--muted)}
  .used-note{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--panel-2);
    font-size:12.5px;line-height:1.5;color:var(--ink-2)}
  /* В sky.css .progress — это сама полоска в 9px с overflow:hidden. Здесь
     .progress — блок «текст + полоска», и без сброса текст срезался. */
  .progress{margin-top:12px;height:auto;overflow:visible;background:none;border:0;border-radius:0}
  .progress-text{font-size:13px;font-weight:800;margin-bottom:6px}
  .progress-bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .progress-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
  .progress-bar.indef i{width:35%;animation:pgrun 1.2s ease-in-out infinite}
  @keyframes pgrun{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
  @media (prefers-reduced-motion:reduce){.progress-bar.indef i{animation:none;width:100%;opacity:.5}}
  /* Ширину не навязываем через min-width по окну браузера: у модалки
     свои отступы, и на телефоне содержимое вылезало за край — были
     обрезаны карточки и кнопка «Оформить VIP». А на компьютере сама
     модалка уже 480px, и любой min-width шире неё вылезает там. Поэтому
     содержимое просто занимает ширину окна, какой бы она ни была. */
  .pw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pw-card{border:1px solid var(--line);border-radius:14px;padding:14px}
  .pw-card.vip{border-color:var(--accent);background:var(--panel-2)}
  .pw-card h3{margin:0 0 8px;font-size:15px}
  .pw-card ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6}
  .pw-price{margin-top:10px;font-weight:900;font-size:18px}
  @media (max-width:560px){.pw-grid{grid-template-columns:1fr}}
  .limit-note{margin-top:10px;padding:11px 13px;border-radius:12px;background:var(--warn-soft);
    color:var(--warn);font-size:13px;font-weight:700;line-height:1.5}

  /* ---------- ученик / учитель, тариф ---------- */
  .mode-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
  .seg.seg-lg{display:inline-flex;flex-wrap:wrap}
  .seg.seg-lg button{padding:9px 16px;font-size:13px;letter-spacing:.01em}
  /* вкладки учителя на телефоне — три равные кнопки, подпись в две строки */
  @media (max-width:520px){
    .t-tabs{display:flex;width:100%;flex-wrap:nowrap}
    .t-tabs button{flex:1 1 0;min-width:0;padding:9px 6px;font-size:12.5px;line-height:1.25;white-space:normal}
  }
  .plan-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}

  .opts{display:grid;gap:8px;margin-top:6px}
  /* критерии оценивания (assets/grading-criteria.js) */
  .crit-box{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;gap:9px}
  .crit-hint{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
  .crit-rows{display:grid;gap:7px}
  .crit-row{display:grid;grid-template-columns:minmax(0,1fr) 74px 34px;gap:7px;align-items:center}
  .crit-row input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:inherit;font-size:13.5px}
  .crit-row .crit-del{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--muted);font-size:18px;cursor:pointer}
  .crit-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .crit-tools select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px}
  .crit-result{display:grid;gap:12px;margin-bottom:16px}
  .crit-total{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .crit-big{display:flex;align-items:baseline;gap:2px}
  .crit-big b{font-size:40px;font-weight:900;line-height:1;color:var(--accent)}
  .crit-big span{font-size:18px;font-weight:800;color:var(--muted)}
  .crit-grade{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted)}
  .crit-grade .grade{width:46px;height:46px;border-radius:14px;font-size:24px}
  .crit-label{flex:1;min-width:180px;font-size:13.5px;line-height:1.5}
  .crit-label small{color:var(--muted);font-size:12px}
  .crit-table{width:100%;border-collapse:collapse;font-size:13px}
  .crit-table td:last-child{min-width:120px;overflow-wrap:anywhere}
  .crit-table th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line)}
  .crit-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
  .crit-table .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .crit-sc{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#fff;background:var(--faint)}
  .crit-sc.s5{background:var(--ok)} .crit-sc.s4{background:#4c9f4c} .crit-sc.s3{background:var(--warn)} .crit-sc.s2{background:#e07a3f} .crit-sc.s1{background:var(--no)}
  .opt-check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:12px;background:var(--panel-2);font-size:13.5px;font-weight:700;cursor:pointer;line-height:1.35}
  /* .field label в sky.css — мелкая заглавная подпись поля; пункты-галочки внутри .field — не подписи */
  .field .opt-check{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
  .opt-check input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
  .opt-check .tag{margin-left:auto;flex:none}
  .opt-check:has(input:checked){border-color:var(--accent)}

  .token-line{margin-top:30px;font-size:12.5px;color:var(--muted);font-weight:700;text-align:center}

  /* ---------- разбор ---------- */
  .res-block{margin-top:18px}
  .res-block h3{margin:0 0 9px;font-size:14px}
  .res-text{font-size:13.5px;line-height:1.65;white-space:pre-line}
  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .flag{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.5}
  .flag.warn{background:var(--warn-soft);color:var(--warn)}
  .flag.ok{background:var(--ok-soft);color:var(--ok)}
  details.res-more{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--panel-2)}
  details.res-more summary{cursor:pointer;font-weight:800;font-size:13.5px}
  details.res-more[open] summary{margin-bottom:10px}
  .err-item .kind{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .tok-note{margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
  .res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .part-h{margin:22px 0 10px;font-size:15px;padding-top:14px;border-top:1px solid var(--line)}
  .part-h:first-child{margin-top:0;padding-top:0;border-top:0}

  /* окно тарифов и счётчик лимита — в assets/sky.css */
  /* ?to=<учитель>: только «Отправить работу учителю» — без вкладок,
     тарифов учителя и проверки по ссылкам (assets/photo-teacher.js) */
  .photo-send-to .mode-bar,
  #teacherMode.send-to #tTabs, #teacherMode.send-to #tLock, #teacherMode.send-to .js-wait,
  #teacherMode.send-to #tab-links > .panel ~ .panel, #teacherMode.send-to #lResultSec{display:none !important}
  .send-to-note{margin:0 0 14px;padding:11px 13px;border-radius:12px;background:var(--m-learn-soft);color:var(--ink-2);font-size:13.5px;font-weight:700;line-height:1.5}

  /* ---------- режим учителя ---------- */
  .roster{display:grid;gap:8px}
  .roster:empty{display:none}
  .roster-row{display:grid;grid-template-columns:48px minmax(0,1fr) 84px 32px;gap:8px;align-items:center}
  .roster-row.ref{grid-template-columns:48px minmax(0,1fr) 32px}
  .roster-row img{width:48px;height:48px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
  .roster-row input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);font:inherit;font-size:13px}
  .roster-row .rm{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
    color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
  .roster-row .who-line{font-size:13px;font-weight:700;min-width:0}
  .roster-row .who-line span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  @media (max-width:480px){.roster-row{grid-template-columns:44px minmax(0,1fr) 64px 30px}}

  .table-wrap{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
  .rtable{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  .rtable th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .rtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
  .rtable tr.failed td{color:var(--muted)}
  .rtable details summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:700}
  .rtable details ul{margin:6px 0 0;padding-left:16px;font-size:12px}
  .gr{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;color:#fff;font-weight:900}
  .gr.g5{background:var(--ok)} .gr.g4{background:#4c9f4c} .gr.g3{background:var(--warn)}
  .gr.g2{background:#e07a3f} .gr.g1{background:var(--no)} .gr.gx{background:var(--faint)}
  .link-out{display:flex;gap:8px;flex-wrap:wrap}
  .link-out input{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px}

  /* ---------- вкладка «Текст» (логика — assets/photo-text.js) ---------- */
  .kind-bar{margin-top:18px}
  .field textarea.x-text{min-height:220px}
  .x-count{margin-top:6px;font-size:12px;color:var(--muted);font-weight:700;text-align:right}
  .x-count.full{color:var(--warn)}
  #textTab .opt-check:has(input:disabled){opacity:.55;cursor:default}
  .crit{width:100%;border-collapse:collapse;font-size:13.5px}
  .crit th{text-align:left;font-weight:700;padding:7px 10px 7px 0;border-bottom:1px solid var(--line)}
  .crit td{padding:7px 0;border-bottom:1px solid var(--line)}
  .crit tr:last-child th,.crit tr:last-child td{border-bottom:none}
  .crit td.crit-bar{width:34%;padding-right:10px}
  .crit-bar span{display:block;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .crit-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .crit td.crit-v{width:46px;text-align:right;font-weight:900;white-space:nowrap}
  .crit .crit-c{display:block;font-weight:600;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
</style>
</head>
<body>
<header id="appHeader"></header>

<main class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>

  <p class="note hidden" id="needWorker" style="border-left-color:var(--warn)"></p>

  <!-- Ученик / учитель и тариф. Тариф и лимит — из Worker (/api/limits);
       у прежнего Worker его нет, тогда строку собирает assets/photo-api.js. -->
  <div class="mode-bar">
    <div class="seg seg-lg" id="roleSeg" role="group">
      <button type="button" data-role="student" aria-pressed="true" data-i18n="roleStudent"></button>
      <button type="button" data-role="teacher" aria-pressed="false" data-i18n="roleTeacher"></button>
    </div>
    <div class="plan-bar hidden" id="planBar">
      <span class="tag" id="planChip"></span>
      <span id="planLimit"></span>
      <span data-limit-meter hidden></span>
      <button type="button" class="btn ghost small" id="planBtn" data-i18n="tariffsBtn"></button>
    </div>
  </div>

  <div id="studentMode">
  <!-- Фото или текст (логика — assets/photo-text.js) -->
  <div class="kind-bar">
    <div class="seg seg-lg" id="kindSeg" role="tablist">
      <button type="button" role="tab" data-kind="photo" aria-pressed="true" data-i18n="kindPhoto"></button>
      <button type="button" role="tab" data-kind="text" aria-pressed="false" data-i18n="kindText"></button>
    </div>
  </div>

  <!-- кто проверяет -->
  <div class="section">
    <div class="panel">
      <div class="spread teacher-bar">
        <span class="who"><span class="ava" id="tchAva"></span><span id="tchName"></span></span>
        <a class="btn ghost small" href="teachers.html" data-i18n="tchChange"></a>
      </div>
    </div>
  </div>

  <div id="photoTab">
  <!-- съёмка -->
  <div class="section">
    <div class="panel shot">
      <div class="shot-frame" id="frame">
        <div class="hint" id="frameHint"></div>
        <video id="video" playsinline autoplay muted hidden></video>
      </div>

      <div class="shot-actions">
        <button class="btn" id="camBtn"></button>
        <button class="btn ghost" id="fileBtn"></button>
        <button class="btn hidden" id="shotBtn"></button>
        <button class="btn ghost hidden" id="camOffBtn"></button>
      </div>

      <!-- Выбранные фото. Сжимаются и загружаются только при отправке,
           по одному: двадцать декодированных снимков с телефона разом —
           это больше гигабайта памяти, и вкладка падает. -->
      <div class="thumbs-head hidden" id="thumbsHead">
        <span id="thumbsCount"></span>
        <button type="button" class="btn ghost small" id="clearBtn"></button>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="cap-note hidden" id="capNote"></div>
      <!-- ПОЧЕМУ УБРАН capture="environment"

           Именно из-за него «Выбор файла не работает». На телефоне

           файлов добраться нечем — кнопка «Выбрать файл» открывала
           камеру. На компьютере атрибут игнорируется, поэтому там
           баг не воспроизводился.

           Снимок с камеры делается отдельной кнопкой и отдельным
           кодом, так что capture здесь не нужен вовсе.

           accept сужен до конкретных типов: image/* пропускает heic
           и tiff, которые canvas в браузере не прочитает, и ученик
           получал пустой экран вместо понятного отказа. -->

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const capNow = () => SkyCheck.photoCap();

/* ---------- камера ---------- */
async function openCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
  } catch (e) {
    /* Раньше на любой сбой выводилось одно общее сообщение, и человек
       не понимал, что делать. Причины разные, и действия тоже разные:
       отказ в доступе снимается в настройках сайта, занятую камеру
       надо освободить, а отсутствующую не починить вовсе. */
    const byName = {
      NotAllowedError:   'camDenied',
      PermissionDeniedError: 'camDenied',
      NotFoundError:     'camNone',
      DevicesNotFoundError: 'camNone',
      NotReadableError:  'camBusy',
      TrackStartError:   'camBusy'
    };
    Sky.toast(Sky.t(byName[e && e.name] || 'camFail'), 5000);
    return;
  }
  $('#frame').style.display = '';
  const v = $('#video');
  v.srcObject = stream;
  v.hidden = false;
  $('#frameHint').hidden = true;
  $('#shotBtn').classList.remove('hidden');
  $('#camOffBtn').classList.remove('hidden');
  $('#camBtn').classList.add('hidden');
}

/* ВЫКЛЮЧЕНИЕ КАМЕРЫ

   Код здесь был правильный и раньше: track.stop() на каждой дорожке
   есть. Не было КНОПКИ — closeCamera вызывался только при уходе со
   страницы и по «Переснять», которая появляется уже после снимка.
   То есть включив камеру, выключить её было нечем, и зелёный огонёк
   горел до закрытия вкладки.

   Добавлено и обнуление srcObject: без него видеоэлемент держит
   ссылку на остановленный поток, и в части браузеров индикатор
   камеры гаснет не сразу. */
function closeCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $('#video');
  v.srcObject = null;
  v.hidden = true;
  $('#shotBtn').classList.add('hidden');
  $('#camOffBtn').classList.add('hidden');
  $('#camBtn').classList.remove('hidden');
  $('#frameHint').hidden = false;
  renderThumbs(false);
}

/* ---------- список фото ---------- */
function addPhotos(blobs) {
  let dropped = 0;
  for (const blob of blobs) {
    if (photos.length >= capNow()) { dropped++; continue; }
    photos.push({ blob, url: URL.createObjectURL(blob) });
  }
  renderThumbs(dropped > 0);
}

function removePhoto(i) {
  const [p] = photos.splice(i, 1);
  if (p) URL.revokeObjectURL(p.url);
  renderThumbs(false);
}

function clearPhotos() {
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  renderThumbs(false);
}

function renderThumbs(overflow) {
  const cap = capNow();
  $('#thumbs').innerHTML = photos.map((p, i) =>
    `<div class="thumb"><img src="${p.url}" alt=""><b>${i + 1}</b>` +
    `<button type="button" data-rm="${i}" aria-label="${esc(Sky.t('rmPhoto'))}">×</button></div>`).join('');
  $('#thumbsHead').classList.toggle('hidden', !photos.length);
  $('#thumbsCount').textContent = Sky.t('thumbsCount').replace('%1', photos.length).replace('%2', cap);
  $('#frameHint').hidden = !!stream || photos.length > 0;
  /* Пустая рамка нужна, пока ничего не выбрано (в ней подсказка) и
     пока идёт съёмка (в ней видео). Когда фото уже выбраны, а камера
     выключена, она только отодвигает список вниз. Прячем через style:
     у .shot-frame свой display, и атрибут hidden он перебивает. */
  $('#frame').style.display = (!stream && photos.length > 0) ? 'none' : '';

  /* Подсказку про потолок показываем, когда в него упёрлись: не раньше,
     чтобы не пугать, и не молча — иначе лишние фото просто исчезнут. */
  const full = photos.length >= cap;
  const note = $('#capNote');
  note.classList.toggle('hidden', !(full || overflow));
  const lim = SkyCheck.limits;
  note.textContent = lim
    ? Sky.t('capPlan').replace('%1', SkyCheck.planName(lim.plan)).replace('%2', cap)
    : Sky.t('capFree');
  $('#shotBtn').disabled = full;
  $('#fileBtn').disabled = full || busy;
  updateCheckBtn();
}

function updateCheckBtn() {
  $('#checkBtn').disabled = busy || !photos.length || !hasWorker || !SkyCheck.canRequest();
}

/* ---------- прогресс ---------- */
function progress(text, share) {
  const box = $('#progress');
  box.classList.remove('hidden');
  $('#progressText').textContent = text;
  const bar = box.querySelector('.progress-bar');
  /* share === null — «ждём, сколько — неизвестно»: полоса бежит. */
  bar.classList.toggle('indef', share === null);
  $('#progressFill').style.width = share === null ? '' : Math.round(share * 100) + '%';
}
function progressDone() { $('#progress').classList.add('hidden'); }

function setBusy(on) {
  busy = on;
  $('#camBtn').disabled = on;
  $('#subjRow').querySelectorAll('button').forEach(b => { b.disabled = on; });
  $('#thumbs').querySelectorAll('button').forEach(b => { b.disabled = on; });
  $('#clearBtn').disabled = on;
  $('#checkBtn').innerHTML = on ? `<span class="spin"></span> ${esc(Sky.t('checking'))}` : esc(Sky.t('checkBtn'));
  renderThumbs(false);
}

/* ---------- тариф и лимит ----------

   Приходят из Worker (/api/limits) через assets/photo-api.js и

   Прежнее окно VIP заменено общим окном «Тарифы» (photo-api.js).

/* ---------- что сделать с работой ---------- */
let lengthNow = 'long';

/* Критерии: список [{name, weight}] или null, если галочка снята. */
const critEditor = SkyCriteria.editor($('#critBox'), $('#optCriteria'));

function readOptions() {

    mode: $('#optCompare').checked ? 'compare' : 'check',

  };

}

  $('#optCompare').checked = !!o.compare;
  $('#optGrade').checked = !!o.grade;
  $('#optGradeText').checked = !!o.gradeText;

function renderLength() {
  $('#lengthSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.len === lengthNow)));
}

/* ---------- проверка ----------

   Как именно — зависит от того, какой Worker стоит (SkyCheck.mode()):
   новый (worker/news92-orders.js) — checkOrders() ниже, прежний
   (worker/worker.js) — check().

   Прежний Worker, порядок:
   1. Если лимит ещё не открылся или фото больше, чем можно, — сразу
      говорим, без работы впустую.
   2. Фото сжимаются ПО ОДНОМУ, await в цикле. Не Promise.all: двадцать
      снимков, разжатых разом, — больше гигабайта памяти, и вкладка на
      телефоне падает. Потолок — SkyCheck.PHOTO_MAX_BYTES: Worker
      принимает фото до 1200 КБ.
   3. Каждое фото — отдельный POST /check-photo с фото в base64
      (SkyCheck.checkPhoto). Хранилище не нужно: Worker берёт само фото.
      Без входа он пускает одно фото раз в 30 с — между фото checkPhoto
      сам ждёт и показывает отсчёт. */
const CHECK_TIMEOUT_MS = 60000;           /* распознавание + разбор одного фото */

async function check() {
  if (!photos.length || busy) return;
  if (await SkyCheck.mode() === 'orders') return checkOrders();
  if (!SkyCheck.canRequest()) {
    Sky.toast(Sky.t('waitNext').replace('%1', SkyCheck.clock(SkyCheck.waitLeft())), 4000);
    return;
  }
  if (photos.length > capNow()) { openPaywall('photos'); return; }
  const opt = readOptions();
  if (opt.criteria && !opt.criteria.length) { Sky.toast(Sky.t('critNeed'), 4000); return; }

  setBusy(true);
  $('#resultSection').classList.add('hidden');

  const n = photos.length;
  const blobs = [];
  for (let i = 0; i < n; i++) {
    progress(Sky.t('pgPrepare').replace('%1', i + 1).replace('%2', n), i / n);
    try { blobs.push(await compress(photos[i].blob, SkyCheck.PHOTO_MAX_BYTES)); }
    catch (e) {
      progressDone(); setBusy(false);
      Sky.toast(Sky.t('tooBigAfter').replace('%1', i + 1), 6000);
      return;
    }
  }

  const res = await SkyCheck.checkPhoto({
    blobs, subject, task: $('#taskText').value.trim().slice(0, 800), timeout: CHECK_TIMEOUT_MS,
    onProgress: ev => ev.phase === 'wait'
      ? progress(Sky.t('pgWait').replace('%1', ev.index + 1).replace('%2', n).replace('%3', ev.wait), null)
      : progress(n > 1 ? Sky.t('pgCheckN').replace('%1', ev.index + 1).replace('%2', n) : Sky.t('pgCheck'), null)
  });

  progressDone(); setBusy(false);

  if (!res.ok) {
    const d = res.data || {};
    if (d.reason === 'rate' && d.waitSec) SkyCheck.setWait(d.waitSec);
    /* фото остаются в списке: можно сразу нажать «Проверить работу» ещё раз */
    renderHomeworkResult(null, SkyCheck.errorText(res), opt);
    return;
  }

  /* Прежний Worker критериев при проверке фото не знает: распознанный
     текст всех фото уходит в его /grade-essay со списком критериев,
     итог и оценку считает SkyCriteria по формуле. */
  if (opt.criteria) {
    setBusy(true);
    progress(Sky.t('critPg'), null);
    const text = (res.data.parts || []).map(d => d && d.recognized_text || '').filter(Boolean).join('\n\n');
    res.data.crit = await SkyCriteria.scoreLegacy(text, opt.criteria,
      { task: $('#taskText').value.trim().slice(0, 300), subjectName: SkyCheck.subjName(subject) });
    progressDone(); setBusy(false);
  }

  /* Следующее фото Worker примет не раньше чем через 30 с. */
  SkyCheck.setWait(SkyCheck.PHOTO_INTERVAL_S);
  renderHomeworkResult(res.data, res.data.failedText || null, opt);
  clearPhotos();
  renderUsage();
  await renderHistory();
}

/* Новый Worker (worker/news92-orders.js), порядок:
   1. Лимит тарифа ещё не открылся или фото больше, чем можно, — сразу
      говорим, без загрузки впустую.
   2. Фото сжимаются и загружаются в хранилище ПО ОДНОМУ.
   3. Все фото работы уходят в Worker ОДНИМ запросом:
      GET /api/check-photo?img=…&img=…&mode=…&subject=… — с временными
      ссылками на файлы и с входом ученика (его тариф выдают и в
      админке). Один запрос — одна единица лимита тарифа. После
      проверки файлы стираем.
   4. Если загрузка оборвалась посередине — уже загруженное стираем. */
const ORDERS_TIMEOUT_MS = 30000;

async function checkOrders() {
  if (!SkyCheck.canRequest()) {
    Sky.toast(Sky.t('waitNext').replace('%1', SkyCheck.clock(SkyCheck.waitLeft())), 4000);
    return;
  }

  const jwt = await Sky.db.token();
  const me = Sky.db.me();
  if (!jwt || !me) { Sky.toast(Sky.t('needLogin'), 6000); return; }

  if (photos.length > capNow()) { openPaywall('photos'); return; }
  const opt = readOptions();
  if (opt.criteria && !opt.criteria.length) { Sky.toast(Sky.t('critNeed'), 4000); return; }

  setBusy(true);
  $('#resultSection').classList.add('hidden');

  const n = photos.length;
  const session = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const uploaded = [];

  try {
    for (let i = 0; i < n; i++) {
      progress(Sky.t('pgUpload').replace('%1', i + 1).replace('%2', n), i / n);
      let small;
      try { small = await compress(photos[i].blob); }
      catch (e) { throw new Error(Sky.t('tooBigAfter').replace('%1', i + 1)); }
      const path = `${me.id}/${session}/${i + 1}.jpg`;
      await Sky.db.upload('homework', path, small, 'image/jpeg');
      uploaded.push(path);
    }
  } catch (e) {
    await Sky.db.removeFiles('homework', uploaded);
    progressDone(); setBusy(false);
    Sky.toast(e && e.message && !/^(offline|Failed|Network)/i.test(e.message) ? e.message : Sky.t('upFail'), 6000);
    return;
  }

  progress(n > 1 ? Sky.t('pgCheckMany').replace('%1', n) : Sky.t('pgCheck'), null);

  let res;
  const imgs = [];
  try {
    for (const path of uploaded) imgs.push(await Sky.db.signedUrl('homework', path, 600));
  } catch (e) {
    res = { ok: false, status: 0, data: null, failText: Sky.t('upFail') };
  }
  if (!res) {
    /* Больше фото и сверка с решением ИИ — дольше ответ модели. */
    const timeout = ORDERS_TIMEOUT_MS + (n - 1) * 10000 + (opt.mode === 'compare' ? 15000 : 0);
    res = await SkyCheck.checkPhotoOrders(Object.assign({ imgs, subject, task: $('#taskText').value.trim().slice(0, 800), timeout }, opt));
  }

  /* Worker файлы не удаляет, а картинку модель уже забрала — убираем сами. */
  await Sky.db.removeFiles('homework', uploaded);
  progressDone(); setBusy(false);

  if (!res.ok) {
    const d = res.data || {};
    if (d.code === 'rate_limit' && d.retry_after) SkyCheck.setWait(d.retry_after);
    if (res.status === 402 && d.code === 'tariff') SkyCheck.openTariffs(d.need);
    /* фото остаются в списке: можно сразу нажать «Проверить работу» ещё раз */
    renderOrdersResult(null, res.failText || SkyCheck.errorText(res));
    return;
  }

  SkyCheck.applyRate(res.data.rate);
  SkyCheck.addTokens(res.data.tokens_used);
  renderOrdersResult(res.data, null);
  clearPhotos();
  renderUsage();
  await renderHistory();
}

/* Текст модели бывает с markdown. Превращаем только заголовки,
   **жирный** и маркеры списков, остальное показываем как есть. */
function mdLite(text) {
  return esc(text).split('\n').map(l => {
    const h = l.match(/^\s*#{1,6}\s+(.*)$/);
    if (h) return `<b style="font-size:15px">${h[1].replace(/\*\*/g, '')}</b>`;
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) return '';
    return l.replace(/^(\s*)[-*•]\s+/, '$1• ').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }).join('\n').replace(/\n{3,}/g, '\n\n');
}

/* Разбор от прежнего Worker. data.parts — ответы /check-photo по каждому фото:
     { recognized_text, grade, correct_parts, errors:[{fragment,
       explanation, fix}], overall_feedback, next_step }
   fail — текст ошибки (разбора нет или не всех фото). */
function renderHomeworkResult(data, fail, opt) {
  opt = opt || readOptions();
  const block = (key, inner) => `<div class="res-block"><h3>${esc(Sky.t(key))}</h3>${inner}</div>`;
  const parts = (data && Array.isArray(data.parts)) ? data.parts : [];
  let html = '';
  if (data && data.crit) {
    html += data.crit.ok
      ? SkyCriteria.table(data.crit.criteria, data.crit.score, data.crit.grade)
      : `<div class="limit-note">${esc(Sky.t('critLegacyFail').replace('%1', data.crit.error || ''))}</div>`;
  }

  parts.forEach((d, i) => {
    if (parts.length > 1) html += `<h3 class="part-h">${esc(Sky.t('photoN').replace('%1', i + 1))}</h3>`;
    const g = Number(d.grade);
    if ((opt.grade || opt.gradeText) && g >= 1 && g <= 5) {
      html += `<div class="gradebox"><div class="grade g${g}">${g}</div>
        <div class="said"><b>${esc(Sky.t('gradeL'))}</b></div></div>`;
    }
    const good = Array.isArray(d.correct_parts) ? d.correct_parts : [];
    if (good.length) html += block('goodH', good.map(x => `<div class="good-item">${esc(typeof x === 'string' ? x : JSON.stringify(x))}</div>`).join(''));
    const errs = Array.isArray(d.errors) ? d.errors.filter(e => e && typeof e === 'object') : [];
    html += block('errH', errs.length
      ? errs.map(e => `<div class="err-item">
          ${e.fragment ? `<div class="frag">${esc(e.fragment)}</div>` : ''}
          ${e.explanation ? `<div class="why">${esc(e.explanation)}</div>` : ''}
          ${e.fix ? `<div class="fix">${esc(Sky.t('fixL'))}${esc(e.fix)}</div>` : ''}
        </div>`).join('')
      : `<p class="lead" style="font-size:13px">${esc(Sky.t('noErrors'))}</p>`);
    if (d.overall_feedback) html += block('resComment', `<div class="res-text">${mdLite(d.overall_feedback)}</div>`);
    if (d.next_step) html += block('nextH', `<div class="res-text">${mdLite(d.next_step)}</div>`);
    if (d.recognized_text) {
      html += `<details class="res-more"><summary>${esc(Sky.t('recogH'))}</summary><div class="recog">${esc(d.recognized_text)}</div></details>`;
    }
  });

  showHomeworkResult(html, fail, null);
}

/* Разбор от нового Worker: только те поля, что просили (оценка,
   тест, списывание, ошибки, сверка, комментарий…). */
function renderOrdersResult(data, fail) {
  const block = (key, inner) => `<div class="res-block"><h3>${esc(Sky.t(key))}</h3>${inner}</div>`;
  let html = '';
  if (data) {
    /* оценка */
    /* с критериями оценка — в их таблице ниже, отдельный квадрат не нужен */
    if (!Array.isArray(data.criteria) && (data.assessment != null || data.assessment_text)) {
      const m = String(data.assessment_text || '').match(/\b([1-5])\b/);
      const g = typeof data.assessment === 'number' ? data.assessment : (m ? Number(m[1]) : null);
      html += `<div class="gradebox"><div class="grade g${g || 'x'}">${g || '—'}</div>
        <div class="said"><b>${esc(data.assessment_text || Sky.t('gradeL'))}</b>` +
        (data.assessment_reason ? `<br>${esc(data.assessment_reason)}` : '') + `</div></div>`;
    }
    /* критерии учителя: таблица, итог 4.2/5 и оценка из него */
    if (Array.isArray(data.criteria)) html += SkyCriteria.table(data.criteria, data.score, data.assessment);
    /* тест */
    if (data.test) {
      const t = data.test;
      const wrong = (t.answers || []).filter(a => !a.ok);
      html += block('resTest',
        `<div class="meters"><div class="stat accent"><b>${t.correct}/${t.total}</b><span>${esc(Sky.t('resRight'))}</span></div>
           <div class="stat"><b>${t.percent}%</b><span>${esc(Sky.t('resRight'))}</span></div></div>` +
        (wrong.length ? `<ul class="res-text" style="margin:10px 0 0;padding-left:18px">${wrong.map(a =>
          `<li>${esc(Sky.t('resWrongQ').replace('%1', a.n).replace('%2', a.student).replace('%3', a.correct))}</li>`).join('')}</ul>` : ''));
    }
    /* списывание */
    if ('plagiarism_flag' in data) {
      const pct = v => v == null ? '—' : v + '%';
      html += block('resAccuracy',
        `<div class="meters"><div class="stat"><b>${pct(data.confidence)}</b><span>${esc(Sky.t('resConfidence'))}</span></div>
           <div class="stat"><b>${pct(data.ai_match)}</b><span>${esc(Sky.t('resMatch'))}</span></div></div>` +
        `<div class="flag ${data.plagiarism_flag ? 'warn' : 'ok'}">${esc(Sky.t(data.plagiarism_flag ? 'resFlagYes' : 'resFlagNo'))}` +
        (data.plagiarism_flag && data.plagiarism_reason ? `: ${esc(data.plagiarism_reason)}` : '') + `</div>` +
        `<p class="tok-note">${esc(Sky.t('resFlagNote'))}</p>`);
    }
    /* ошибки */
    const errs = Array.isArray(data.errors) ? data.errors : [];
    html += block('errH', errs.length
      ? errs.map(e => `<div class="err-item">
          ${e.type ? `<div class="kind">${esc(e.type)}</div>` : ''}
          ${e.fragment ? `<div class="frag">${esc(e.fragment)}</div>` : ''}
          ${e.correction ? `<div class="fix">${esc(Sky.t('fixL'))}${esc(e.correction)}</div>` : ''}
        </div>`).join('')
      : `<p class="lead" style="font-size:13px">${esc(Sky.t('noErrors'))}</p>`);
    if (data.discrepancies) html += block('resDiscr', `<div class="res-text">${mdLite(data.discrepancies)}</div>`);
    if (data.comment) html += block('resComment', `<div class="res-text">${mdLite(data.comment)}</div>`);
    if (data.ai_solution) {
      html += `<details class="res-more"><summary>${esc(Sky.t('resAiSol'))}</summary><div class="res-text">${mdLite(data.ai_solution)}</div></details>`;
    }
    if (data.recognized_text) {
      html += `<details class="res-more"><summary>${esc(Sky.t('recogH'))}</summary><div class="recog">${esc(data.recognized_text)}</div></details>`;
    }
    if (data.truncated) html += `<div class="limit-note">${esc(Sky.t('resTrunc'))}</div>`;
  }
  showHomeworkResult(html, fail, data && data.tokens_used);
}

function showHomeworkResult(html, fail, tokens) {
  if (fail) html += `<div class="limit-note">${esc(fail)}</div>`;
  if (tokens && tokens.total) html += `<div class="tok-note">${esc(Sky.t('resTokens').replace('%1', tokens.total))}</div>`;
  html += `<div class="res-actions"><button type="button" class="btn ghost" id="againBtn">${esc(Sky.t('againBtn'))}</button></div>`;

  $('#resultSection').classList.remove('hidden');
  $('#result').innerHTML = html;
  $('#againBtn').addEventListener('click', resetCheck);
  $('#resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* «Проверить ещё раз»: убрать разбор и вернуть страницу к выбору фото. */
function resetCheck() {
  $('#resultSection').classList.add('hidden');
  $('#result').innerHTML = '';
  progressDone();
  setBusy(false);
  $('.shot').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- сохранение ---------- */
async function save(data) {
  const t = SkyTeachers.selected();
  const me = Sky.db && Sky.db.me && Sky.db.me();

  /* В сетевом режиме RLS требует, чтобы student_id совпадал с тем, кто
     пишет: без входа строку просто не примут. Показать разбор это не
     мешает, а вот промолчать про несохранённую историю — нечестно. */
  if (Sky.db && Sky.db.isCloud && Sky.db.isCloud() && !me) {
    lastSaved = null;
    Sky.toast(Sky.t('saveFail'), 5000);
    return;
  }

  try {
    lastSaved = await Sky.db.insert('photo_checks', {
      student_id: me ? me.id : 'local',
      teacher_id: t ? t.id : null,
      subject: 'english',
      task_text: $('#taskText').value.trim().slice(0, 800) || null,
      recognized_text: data.recognized_text || null,
      grade: data.grade || null,
      errors: data.errors || [],
      feedback: data.overall_feedback || null,
      next_step: data.next_step || null,
      ocr_flagged: false,
      status: 'ok'
    });
  } catch (e) {
    lastSaved = null;
  }
}

/* ---------- показ разбора ---------- */
function renderResult(data, partial) {
  $('#resultSection').classList.remove('hidden');
  const box = $('#result');
  const g = data.grade;

  const errors = Array.isArray(data.errors) ? data.errors : [];
  const good = Array.isArray(data.correct_parts) ? data.correct_parts : [];

  box.innerHTML =
    (partial ? '' :
    `<div class="gradebox">
       <div class="grade g${g || 3}">${esc(g || '—')}</div>
       <div class="said">${esc(data.overall_feedback || '')}</div>
     </div>`) +

    `<div class="recog-head">
       <b>${Sky.t('recogH')}</b>
       <button class="btn ghost small" id="flagBtn">${Sky.t('flagBtn')}</button>
     </div>
     <div class="recog">${esc(data.recognized_text || '')}</div>` +

    (partial ? '' :
      (good.length ? `<h3 style="margin:18px 0 9px;font-size:14px">${Sky.t('goodH')}</h3>` +
        good.map(x => `<div class="good-item">${esc(typeof x === 'string' ? x : JSON.stringify(x))}</div>`).join('') : '') +

      `<h3 style="margin:18px 0 9px;font-size:14px">${Sky.t('errH')}</h3>` +
      (errors.length
        ? errors.map(e => `
            <div class="err-item">
              <div class="frag">${esc(e.fragment || '')}</div>
              <div class="why">${esc(e.explanation || '')}</div>
              ${e.fix ? `<div class="fix">${Sky.t('fixL')}${esc(e.fix)}</div>` : ''}
            </div>`).join('')
        : `<p class="lead" style="font-size:13px">${Sky.t('noErrors')}</p>`) +

      (data.next_step
        ? `<h3 style="margin:18px 0 9px;font-size:14px">${Sky.t('nextH')}</h3>
           <p style="font-size:13.5px;line-height:1.65">${esc(data.next_step)}</p>` : '')
    );

  const flag = box.querySelector('#flagBtn');
  if (flag) flag.addEventListener('click', flagOcr);
}

/* ---------- жалоба на распознавание ----------
   Нужна не для красоты: это единственный способ узнать, как часто
   модель врёт на почерке. Оценка, выставленная по неверно прочитанному
   тексту, выглядит убедительно и при этом несправедлива — ученик
   должен иметь возможность сказать об этом прямо в интерфейсе. */
async function flagOcr(e) {
  const btn = e.currentTarget;
  btn.disabled = true;
  if (lastSaved && lastSaved.id) {
    try { await Sky.db.update('photo_checks', lastSaved.id, { ocr_flagged: true }); } catch (err) {}
  }
  btn.textContent = Sky.t('flagged');
  Sky.toast(Sky.t('flagThanks'), 6000);
  await renderHistory();
}

/* ---------- история ---------- */
async function renderHistory() {
  const me = Sky.db && Sky.db.me && Sky.db.me();
  let rows = [];
  try {
    /* В живой базе photo_checks устроена по schema-photo-limits.sql:
       владелец — user_id. Пишет её Worker после каждой проверки. */
    rows = await Sky.db.list('photo_checks', me ? { user_id: me.id } : undefined);
  } catch (e) { rows = []; }

  rows = (rows || []).slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  if (!rows.length) { $('#histSection').classList.add('hidden'); return; }

  $('#histSection').classList.remove('hidden');
  $('#hist').innerHTML = rows.slice(0, 20).map(r => `
    <div class="hist-row">
      <div class="g g${r.grade || 'x'}">${esc(r.grade || '—')}</div>
      <div class="txt">
        <b>${esc((r.recognized_text || r.ai_feedback || '').split('\n')[0].slice(0, 60) || '—')}</b>
        <span>${esc(new Date(r.created_at).toLocaleString())}</span>
      </div>
      ${r.ocr_flagged ? `<span class="flagged">${Sky.t('flagged')}</span>` : ''}
    </div>`).join('');
}

/* ---------- события ---------- */
$('#camBtn').addEventListener('click', openCamera);
$('#camOffBtn').addEventListener('click', closeCamera);
/* Снимок с камеры добавляется в список, камера остаётся включённой:
   задач обычно несколько, и выключать-включать её на каждую незачем.
   Сжимается снимок, как и файлы, только при отправке. */
$('#shotBtn').addEventListener('click', () => {
  const v = $('#video');
  if (!v.videoWidth || photos.length >= capNow()) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  c.toBlob(b => { c.width = c.height = 0; if (b) addPhotos([b]); }, 'image/jpeg', 0.92);
});
$('#fileBtn').addEventListener('click', () => $('#fileIn').click());
$('#clearBtn').addEventListener('click', clearPhotos);
$('#thumbs').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]');
  if (b && !busy) removePhoto(Number(b.dataset.rm));
});

/* Проверяем тип и размер ДО чтения файлов.

   accept на input — подсказка диалогу, а не защита: файл можно
   перетащить или выбрать «все файлы». heic с айфона без этой проверки
   доходил до canvas, тот отдавал пустой кадр, и ученик видел белый
   прямоугольник вместо ошибки.

   ПОТОЛОК НА ВХОДЕ ПОДНЯТ С 5 ДО 20 МБ. 5 МБ задавались, когда фото
   уходило почти как есть. Теперь оно в любом случае сжимается до
   1,5 МБ, а обычный снимок телефона — 3–12 МБ: старый потолок отсекал
   бы как раз тех, кто снимает на хорошую камеру. 20 МБ оставлены,
   чтобы не пытаться разжимать в памяти заведомо огромное. */
const OK_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
const MAX_INPUT_MB = 20;

$('#fileIn').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  /* Сбрасываем значение сразу: иначе повторный выбор того же файла
     не вызовет change, и кнопка будет выглядеть сломанной. */
  e.target.value = '';
  if (!files.length) return;

  const good = [];
  let badType = 0, tooHeavy = 0;
  for (const f of files) {
    if (!OK_TYPES.includes(f.type)) { badType++; continue; }
    if (f.size > MAX_INPUT_MB * 1024 * 1024) { tooHeavy++; continue; }
    good.push(f);
  }
  if (badType) Sky.toast(Sky.t('badType'), 5000);
  else if (tooHeavy) Sky.toast(Sky.t('tooHeavy'), 5000);
  if (good.length) addPhotos(good);
});

/* ---------- предмет ---------- */
let subject = Sky.get('hwSubject', 'physics');

if (!SkyCheck.SUBJECTS.some(s => s[0] === subject)) subject = 'physics';

function renderSubjects() {
  $('#subjRow').innerHTML = SkyCheck.SUBJECTS.map(([id]) =>
    `<button type="button" class="subj-btn${id === subject ? ' active' : ''}" data-subject="${id}"${busy ? ' disabled' : ''}>${esc(SkyCheck.subjName(id))}</button>`).join('');
}

$('#subjRow').addEventListener('click', e => {
  const b = e.target.closest('.subj-btn');
  if (!b) return;
  subject = b.dataset.subject;
  Sky.set('hwSubject', subject);   /* помним выбор: обычно ученик носит одну и ту же домашку */
  renderSubjects();
  renderUsage();
});

/* ---------- задание по ссылке от учителя ----------

   Ссылка вида photo.html?task=<uuid>. Открыть её можно без входа:
   задание показывается сразу. Вход понадобится только на отправку —
   там персональный лимит, и без имени его не посчитать. */
async function loadTeacherTask() {
  const id = new URLSearchParams(location.search).get('task');
  if (!id) return;
  try {
    await Sky.db.ready;
    const rows = await Sky.db.rpc('homework_task_get', { p_id: id });
    const t = Array.isArray(rows) ? rows[0] : rows;
    if (!t) { Sky.toast(Sky.t('taskGone'), 6000); return; }
    $('#tftText').textContent = t.task_text;
    $('#teacherTask').classList.remove('hidden');
    $('#taskText').value = t.task_text.slice(0, 800);
    if (t.subject && SkyCheck.SUBJECTS.some(s => s[0] === t.subject)) {
      subject = t.subject; renderSubjects(); renderUsage();
    }
  } catch (e) {
    Sky.toast(Sky.t('taskGone'), 6000);
  }
}

/* ---------- опции проверки ----------
   Пункт с пометкой тарифа без нужного тарифа не включается —
   вместо галочки открывается окно «Тарифы» с этим пунктом. */
document.querySelectorAll('#studentMode .opts input').forEach(inp => inp.addEventListener('change', () => {
  const need = inp.dataset.need;
  if (inp.checked && need && !SkyCheck.feature(need)) {
    inp.checked = false;
    SkyCheck.openTariffs(need === 'compare' ? 'paid' : 'plagiarism');
    return;
  }
  saveOptions();
}));
$('#lengthSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-len]');
  if (!b) return;
  lengthNow = b.dataset.len;
  renderLength();
  saveOptions();
});

/* ---------- ученик / учитель ----------
   Режим учителя (assets/photo-teacher.js) слушает событие photorole.
   Ссылка ?hw=<id> — работа, присланная учителю, — открывает его сразу. */
function setRole(r) {
  const role = r === 'teacher' ? 'teacher' : 'student';
  $('#studentMode').classList.toggle('hidden', role !== 'student');
  $('#teacherMode').classList.toggle('hidden', role !== 'teacher');
  $('#roleSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === role)));
  Sky.set('photoRole', role);
  document.dispatchEvent(new CustomEvent('photorole', { detail: role }));
}
$('#roleSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-role]');
  if (b) setRole(b.dataset.role);
});
$('#planBtn').addEventListener('click', () => SkyCheck.openTariffs());
SkyCheck.onChange(renderUsage);

$('#checkBtn').addEventListener('click', check);
document.addEventListener('teacherchange', renderTeacher);
document.addEventListener('langchange', () => {
  renderTeacher(); renderSubjects(); renderUsage(); renderHistory();
  $('#roleSeg').setAttribute('aria-label', Sky.t('roleAria'));
});
document.addEventListener('authchange', () => { loadUsage(); renderHistory(); });
window.addEventListener('pagehide', closeCamera);

/* ---------- запуск ---------- */
(function start() {
  renderTeacher();
  $('#camBtn').textContent = Sky.t('camBtn');
  $('#fileBtn').textContent = Sky.t('fileBtn');
  $('#shotBtn').textContent = Sky.t('shotBtn');
  $('#clearBtn').textContent = Sky.t('clearBtn');
  $('#frameHint').textContent = Sky.t('frameHint');

  if (!hasWorker) {
    const n = $('#needWorker');
    n.textContent = Sky.t('needWorker');
    n.classList.remove('hidden');
    $('#checkBtn').disabled = true;
  }
  $('#roleSeg').setAttribute('aria-label', Sky.t('roleAria'));
  const params = new URLSearchParams(location.search);
  /* ?to=<учитель> — ученик сдаёт работу учителю: форма отправки живёт
     в режиме учителя (вкладка ссылок), но выбор режима ему не нужен. */
  const sendTo = params.get('to');
  if (sendTo) document.documentElement.classList.add('photo-send-to');
  setRole(params.get('hw') || sendTo ? 'teacher' : params.get('task') ? 'student' : Sky.get('photoRole', 'student'));
  restoreOptions();
  renderSubjects();
  renderThumbs(false);
  renderHistory();
  loadTeacherTask();
  loadUsage();
  SkyCheck.renderTokens();
})();
</script>
